<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>KDX丨ZHX - 商城</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="/styles-premium.css">
    <link rel="stylesheet" href="/mobile.css">
    <script src="/vercel-analytics.js"></script>
</head>
<body>
    <!-- 顶部导航栏 - 永远固定 -->
    <header class="bg-white shadow-sm fixed top-0 left-0 right-0 z-50">
        <div class="container-wide py-4">
            <div class="flex items-center justify-between">
                <!-- Logo - 左侧 -->
                <a href="/shop" id="logo-link" class="flex items-center gap-3">
                    <h1 class="text-xl font-bold text-black">KDX丨ZHX</h1>
                </a>

                <!-- 标签栏 - 中间 -->
                <nav class="flex items-center gap-8">
                    <button class="tab-button px-4 py-4 font-medium text-black hover:text-gray-600 transition" data-tab="home" onclick="window.location.href='/shop'">首页</button>
                    <button class="tab-button px-4 py-4 font-medium text-gray-600 hover:text-black transition" data-tab="products" onclick="window.location.href='/shop'">商品</button>
                    <button class="tab-button px-4 py-4 font-medium text-gray-600 hover:text-black transition" data-tab="orders" onclick="window.location.href='/orders'">订单</button>
                    <button class="tab-button px-4 py-4 font-medium text-gray-600 hover:text-black transition" data-tab="chat" onclick="window.location.href='/chat'">智能客服</button>
                </nav>

                <!-- 功能按钮 - 右侧 -->
                <div class="flex items-center gap-4">
                    <!-- 登录按钮 -->
                    <div id="userSection">
                        <button id="loginBtn" onclick="window.location.href='/auth?returnUrl=' + encodeURIComponent(window.location.pathname + window.location.search)" class="bg-black text-white px-6 py-2 rounded-lg font-medium hover:bg-gray-800 transition">
                            登录
                        </button>
                        <div id="userInfo" class="hidden items-center gap-3 bg-gray-100 rounded-lg px-4 py-2">
                            <span id="userName" class="font-medium text-gray-800"></span>
                            <button onclick="handleLogout()" class="text-gray-500 hover:text-red-600 transition">
                                <i class="fas fa-sign-out-alt"></i>
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <!-- 主内容区域 -->
    <main class="pt-20 pb-24">
        <section class="py-12">
            <div class="container-wide">
                <!-- 筛选区域 -->
                <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 mb-8">
                    <div class="flex items-center gap-4">
                        <select id="category-filter" class="input-premium select-premium">
                            <option value="全部">全部分类</option>
                            <option value="watch">智能手表</option>
                            <option value="cable">数据线</option>
                            <option value="accessory">配件</option>
                            <option value="other">其他</option>
                        </select>
                        <select id="sort-filter" class="input-premium select-premium">
                            <option value="default">默认排序</option>
                            <option value="price-asc">价格从低到高</option>
                            <option value="price-desc">价格从高到低</option>
                            <option value="sales">销量优先</option>
                        </select>
                    </div>
                    <div class="relative w-full md:w-64">
                        <input type="text" id="search-input" placeholder="搜索商品..." class="input-premium w-full pr-10">
                        <button id="search-btn" class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 hover:text-black">
                            <i class="fas fa-search"></i>
                        </button>
                    </div>
                </div>

                <!-- 商品网格 -->
                <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-8" id="products-grid">
                    <!-- 商品将通过JS加载 -->
                </div>
            </div>
        </section>
    </main>



    <script>
        let cart = [];
        let products = [];
        let currentUser = null;
        
        function updateCartBadge() {
            const cartCount = cart.reduce((sum, item) => sum + item.quantity, 0);
            const cartBadge = document.getElementById('cart-count');
            
            if (cartBadge) {
                if (cartCount > 0) {
                    cartBadge.textContent = cartCount;
                    cartBadge.classList.remove('hidden');
                } else {
                    cartBadge.classList.add('hidden');
                }
            }
        }

        async function loadProducts() {
            try {
                const response = await fetch('/api/products');
                products = await response.json();
                renderProducts(products);
            } catch (error) {
                console.error('加载商品失败:', error);
            }
        }

        function renderProducts(productList) {
            const container = document.getElementById('products-grid');
            container.innerHTML = productList.map(product => `
                <div class="glass-card rounded-xl overflow-hidden transition-all duration-300 hover:shadow-lg hover:-translate-y-1 product-card" data-product-id="${product.id}">
                    <div class="relative aspect-square overflow-hidden" style="cursor: pointer;">
                        <img src="${product.image}" alt="${product.name}" class="w-full h-full object-cover">
                    </div>
                    <div class="p-6">
                        <div class="flex justify-between items-start mb-4">
                            <h3 class="font-semibold text-lg">${product.name}</h3>
                            <span class="text-2xl font-bold text-black">¥${product.price}</span>
                        </div>
                    </div>
                </div>
            `).join('');
            
            addProductCardEvents();
        }

        function addProductCardEvents() {
            const cards = document.querySelectorAll('.product-card');
            cards.forEach(card => {
                card.addEventListener('click', (e) => {
                    if (!e.target.closest('button')) {
                        const productId = card.dataset.productId;
                        window.location.href = `product-detail.html?id=${productId}`;
                    }
                });
            });
        }

        function addToCart(productId) {
            const product = products.find(p => p.id === productId);
            if (!product) return;
            
            const existingItem = cart.find(item => item.productId === productId);
            
            if (existingItem) {
                existingItem.quantity += 1;
            } else {
                cart.push({
                    productId: product.id,
                    id: product.id,
                    name: product.name,
                    price: product.price,
                    image: product.image,
                    quantity: 1
                });
            }
            
            localStorage.setItem('cart', JSON.stringify(cart));
            updateCartBadge();
            showToast('已加入购物车！');
        }

        function buyNow(productId) {
            const userStr = localStorage.getItem('user');
            if (!userStr) {
                showToast('请先登录后购买');
                setTimeout(() => { window.location.href = '/auth'; }, 1500);
                return;
            }
            addToCart(productId);
            showToast('正在跳转到结算页面...');
            setTimeout(() => { window.location.href = '/checkout'; }, 500);
        }

        function showToast(message) {
            const toast = document.createElement('div');
            toast.className = 'fixed bottom-24 left-1/2 -translate-x-1/2 bg-black text-white px-6 py-3 rounded-lg z-50 animate-fade-in-up';
            toast.textContent = message;
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 2000);
        }

        function checkLoginStatus() {
            const user = localStorage.getItem('user');
            if (user) {
                currentUser = JSON.parse(user);
                document.getElementById('loginBtn').classList.add('hidden');
                document.getElementById('userInfo').classList.remove('hidden');
                document.getElementById('userInfo').classList.add('flex');
                document.getElementById('userName').textContent = currentUser.username;
                
                // 添加点击事件跳转到用户中心
                const userInfo = document.getElementById('userInfo');
                if (userInfo) {
                    userInfo.style.cursor = 'pointer';
                    userInfo.onclick = function(e) {
                        // 如果点击的是退出按钮，不跳转
                        if (!e.target.closest('button')) {
                            window.location.href = 'user-center';
                        }
                    };
                }
            } else {
                document.getElementById('loginBtn').classList.remove('hidden');
                document.getElementById('userInfo').classList.add('hidden');
                document.getElementById('userInfo').classList.remove('flex');
            }
        }

        function handleLogout() {
            localStorage.removeItem('user');
            localStorage.removeItem('token');
            currentUser = null;
            checkLoginStatus();
            showToast('已退出登录');
        }

        document.addEventListener('DOMContentLoaded', function() {
            // 处理 OAuth 登录回调（GitHub 等）
            const urlParams = new URLSearchParams(window.location.search);
            const token = urlParams.get('token');
            const userData = urlParams.get('user');
            
            if (token && userData) {
                try {
                    const user = JSON.parse(decodeURIComponent(userData));
                    localStorage.setItem('user', JSON.stringify(user));
                    localStorage.setItem('token', token);
                    showToast('登录成功！');
                    // 清除 URL 参数
                    window.history.replaceState({}, document.title, '/shop');
                } catch (e) {
                    console.error('解析用户数据失败:', e);
                }
            }
            
            // 检查登录状态
            checkLoginStatus();
            // 从 localStorage 加载购物车
            const savedCart = localStorage.getItem('cart');
            if (savedCart) {
                cart = JSON.parse(savedCart);
            }
            updateCartBadge();
            loadProducts();

            // Logo点击逻辑：管理员跳转到后台，普通用户留在商城
            const logoLink = document.getElementById('logo-link');
            if (logoLink) {
                logoLink.addEventListener('click', function(e) {
                    e.preventDefault();
                    const user = JSON.parse(localStorage.getItem('user') || '{}');
                    if (user.isAdmin) {
                        window.location.href = '/admin';
                    } else {
                        window.location.href = '/shop';
                    }
                });
            }
        });
    </script>
    <script src="/ai-assistant.js"></script>
</body>
</html>
