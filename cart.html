<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>购物车 - KDX丨ZHX</title>
    <script src="/tailwind-cdn.js"></script>
    <link rel="stylesheet" href="https://cdn.staticfile.org/font-awesome/6.5.1/css/all.min.css?v=20260522152125">
    <link rel="stylesheet" href="/styles-premium.css">
    <link rel="stylesheet" href="/mobile.css">
    <link rel="stylesheet" href="/loader.css">
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }
    </style></head>
<body>
    <!-- 顶部导航栏 - 永远固定 -->
    <header class="bg-white shadow-sm fixed top-0 left-0 right-0 z-50">
        <div class="container-wide py-4">
            <div class="flex items-center justify-between">
                <!-- Logo - 左侧 -->
                <a href="/shop" class="flex items-center gap-3">
                    <h1 class="text-xl font-bold text-black">KDX丨ZHX</h1>
                </a>

                <!-- 标签栏 - 中间 -->
                <nav class="flex items-center gap-8">
                    <button class="tab-button px-4 py-4 font-medium text-black hover:text-gray-600 transition" data-tab="home" onclick="window.location.href='/shop'">首页</button>
                    <button class="tab-button px-4 py-4 font-medium text-gray-600 hover:text-black transition" data-tab="products" onclick="window.location.href='/shop'">商品</button>
                    <button class="tab-button px-4 py-4 font-medium text-gray-600 hover:text-black transition" data-tab="orders" onclick="window.location.href='/orders'">订单</button>
                    <button class="tab-button px-4 py-4 font-medium text-gray-600 hover:text-black transition" data-tab="chat" onclick="window.location.href='/chat'">智能客服</button>
                </nav>

                <!-- 功能按钮 - 右侧 -->
                <div class="flex items-center gap-4">
                    <button onclick="window.location.href='/chat'" class="text-gray-600 hover:text-black transition">
                        <i class="fas fa-headset text-xl"></i>
                    </button>
                    
                    <!-- 登录按钮 -->
                    <div id="userSection">
                        <button id="loginBtn" onclick="window.location.href='/auth?returnUrl=' + encodeURIComponent(window.location.pathname + window.location.search)" class="bg-black text-white px-6 py-2 rounded-lg font-medium hover:bg-gray-800 transition">
                            登录
                        </button>
                        <div id="userInfo" class="hidden items-center gap-3 bg-gray-100 rounded-lg px-4 py-2">
                            <span id="userName" class="font-medium text-gray-800"></span>
                            <button onclick="handleLogout()" class="text-gray-500 hover:text-red-600 transition">
                                <i class="fas fa-sign-out-alt"></i>
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <!-- 主内容区域 -->
    <main class="pt-20 pb-24">
        <section class="py-12">
            <div class="container-wide">
                <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
                    <div class="lg:col-span-2">
                        <div class="glass-card rounded-xl p-6">
                            <h2 class="text-xl font-bold text-black mb-6">
                                <i class="fas fa-shopping-cart mr-2"></i>
                                购物车商品
                            </h2>
                            <div id="cartItems" class="space-y-6">
                            </div>
                        </div>
                    </div>

                    <div class="lg:col-span-1">
                        <div class="glass-card rounded-xl p-6 sticky top-24">
                            <h3 class="text-lg font-bold text-black mb-4">订单摘要</h3>
                            
                            <div class="space-y-3 mb-6">
                                <div class="flex justify-between text-gray-600">
                                    <span>商品小计</span>
                                    <span id="subtotal">¥0.00</span>
                                </div>
                                <div class="flex justify-between text-gray-600">
                                    <span>运费</span>
                                    <span class="text-green-600">包邮</span>
                                </div>
                                <div class="divider-premium my-4"></div>
                                <div class="flex justify-between text-lg font-bold text-black">
                                    <span>合计</span>
                                    <span id="total" class="text-black text-xl">¥0.00</span>
                                </div>
                            </div>

                            <button id="checkoutBtn" onclick="checkout()" class="w-full btn-premium btn-lg">
                                <i class="fas fa-credit-card mr-2"></i>
                                去结算
                            </button>

                            <div class="mt-6 pt-6 border-t border-gray-200">
                                <p class="text-gray-500 text-sm">
                                    <i class="fas fa-shield-alt mr-2"></i>
                                    安全支付，支持多种支付方式
                                </p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <script>
        let cart = JSON.parse(localStorage.getItem('cart') || '[]');

        function renderCart() {
            const container = document.getElementById('cartItems');
            
            if (cart.length === 0) {
                container.innerHTML = `
                    <div class="text-center py-12">
                        <i class="fas fa-shopping-cart text-6xl text-gray-300 mb-4"></i>
                        <p class="text-gray-500 text-xl mb-4">购物车是空的</p>
                        <a href="/shop" class="inline-block btn-premium btn-lg">
                            <i class="fas fa-shopping-bag mr-2"></i>
                            去购物
                        </a>
                    </div>
                `;
                document.getElementById('checkoutBtn').disabled = true;
                document.getElementById('checkoutBtn').classList.add('opacity-50', 'cursor-not-allowed');
                return;
            }

            document.getElementById('checkoutBtn').disabled = false;
            document.getElementById('checkoutBtn').classList.remove('opacity-50', 'cursor-not-allowed');

            container.innerHTML = cart.map(item => `
                <div class="flex gap-4 p-4 bg-gray-50 rounded-xl border border-gray-100">
                    <img src="${item.image}" alt="${item.name}" class="w-28 h-28 object-cover rounded-xl" />
                    <div class="flex-1">
                        <h4 class="font-semibold text-black mb-2">${item.name}</h4>
                        <p class="text-black font-bold text-lg mb-4">¥${item.price}</p>
                        <div class="flex items-center justify-between">
                            <div class="flex items-center gap-3 border border-gray-200 rounded-lg overflow-hidden bg-white">
                                <button onclick="updateQuantity('${item.productId}', -1)" class="w-10 h-10 hover:bg-gray-100 transition text-gray-700">-</button>
                                <span class="w-12 text-center font-medium text-gray-900">${item.quantity}</span>
                                <button onclick="updateQuantity('${item.productId}', 1)" class="w-10 h-10 hover:bg-gray-100 transition text-gray-700">+</button>
                            </div>
                            <button onclick="removeFromCart('${item.productId}')" class="text-red-500 hover:text-red-600 transition">
                                <i class="fas fa-trash mr-1"></i>
                                删除
                            </button>
                        </div>
                    </div>
                    <div class="text-right">
                        <p class="text-lg font-bold text-black">¥${(item.price * item.quantity).toFixed(2)}</p>
                    </div>
                </div>
            `).join('');

            updateTotals();
        }

        function updateTotals() {
            const subtotal = cart.reduce((sum, item) => sum + item.price * item.quantity, 0);
            document.getElementById('subtotal').textContent = `¥${subtotal.toFixed(2)}`;
            document.getElementById('total').textContent = `¥${subtotal.toFixed(2)}`;
        }

        function updateQuantity(productId, delta) {
            const item = cart.find(item => item.productId === productId);
            if (item) {
                item.quantity += delta;
                if (item.quantity <= 0) {
                    cart = cart.filter(i => i.productId !== productId);
                }
                localStorage.setItem('cart', JSON.stringify(cart));
                renderCart();
            }
        }

        function removeFromCart(productId) {
            if (confirm('确定要删除这个商品吗？')) {
                cart = cart.filter(item => item.productId !== productId);
                localStorage.setItem('cart', JSON.stringify(cart));
                renderCart();
            }
        }

        function checkout() {
            if (cart.length === 0) {
                alert('购物车是空的！');
                return;
            }
            
            const userStr = localStorage.getItem('user');
            if (!userStr) {
                alert('请先登录后购买');
                window.location.href = '/auth?returnUrl=/cart';
                return;
            }
            
            window.location.href = '/checkout';
        }

        function checkLoginStatus() {
            const user = localStorage.getItem('user');
            if (user) {
                const currentUser = JSON.parse(user);
                document.getElementById('loginBtn').classList.add('hidden');
                document.getElementById('userInfo').classList.remove('hidden');
                document.getElementById('userInfo').classList.add('flex');
                document.getElementById('userName').textContent = currentUser.username;
            } else {
                document.getElementById('loginBtn').classList.remove('hidden');
                document.getElementById('userInfo').classList.add('hidden');
                document.getElementById('userInfo').classList.remove('flex');
            }
        }

        function handleLogout() {
            localStorage.removeItem('user');
            localStorage.removeItem('token');
            checkLoginStatus();
        }

        document.addEventListener('DOMContentLoaded', function() {
            checkLoginStatus();
            renderCart();
        });
    </script>
    <script src="/loader.js"></script>
    <script src="/loader-trigger.js"></script>
    <script src="/ai-assistant.js"></script>
<div id="appLoader">
    <div class="loader-container">
        <div class="loader-particles">
            <div class="particle"></div>
            <div class="particle"></div>
            <div class="particle"></div>
            <div class="particle"></div>
            <div class="particle"></div>
        </div>
        <div class="loader-logo">KDX丨ZHX</div>
        <div class="loader-progress">
            <div class="loader-progress-bar"></div>
        </div>
        <div class="loader-status" id="loaderStatus">加载中...</div>
    </div>
</div>
</body>
</html>
