<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KDX丨ZHX - 加载中</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .loader-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            transition: opacity 0.6s ease-out, visibility 0.6s ease-out;
        }

        .loader-container.hidden {
            opacity: 0;
            visibility: hidden;
        }

        .loader-box {
            background: #ffffff;
            border-radius: 24px;
            padding: 60px 80px;
            box-shadow: 0 25px 80px -20px rgba(0, 0, 0, 0.4),
                        0 0 0 1px rgba(255, 255, 255, 0.1) inset;
            position: relative;
            overflow: hidden;
            animation: boxAppear 0.8s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        @keyframes boxAppear {
            0% {
                transform: scale(0.8);
                opacity: 0;
            }
            100% {
                transform: scale(1);
                opacity: 1;
            }
        }

        .loader-box::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, 
                transparent 0%,
                #1a1a2e 20%,
                #667eea 50%,
                #764ba2 80%,
                transparent 100%
            );
            animation: gradientSlide 2s ease-in-out infinite;
        }

        @keyframes gradientSlide {
            0%, 100% {
                transform: translateX(-100%);
            }
            50% {
                transform: translateX(100%);
            }
        }

        .logo-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 30px;
        }

        .logo-icon {
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, #1a1a2e 0%, #0f3460 100%);
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            animation: iconFloat 3s ease-in-out infinite;
            position: relative;
        }

        @keyframes iconFloat {
            0%, 100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-10px);
            }
        }

        .logo-icon::before {
            content: 'K';
            font-size: 40px;
            font-weight: 900;
            color: #ffffff;
            letter-spacing: -2px;
        }

        .logo-icon::after {
            content: '';
            position: absolute;
            top: -3px;
            left: -3px;
            right: -3px;
            bottom: -3px;
            border: 2px solid transparent;
            border-radius: 22px;
            background: linear-gradient(135deg, #667eea, #764ba2) border-box;
            -webkit-mask: linear-gradient(#fff 0 0) padding-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            animation: borderRotate 3s linear infinite;
        }

        @keyframes borderRotate {
            0% {
                transform: rotate(0deg);
            }
            100% {
                transform: rotate(360deg);
            }
        }

        .logo-text {
            font-size: 36px;
            font-weight: 800;
            letter-spacing: 8px;
            color: #1a1a2e;
            position: relative;
            overflow: hidden;
            min-width: 280px;
            text-align: center;
        }

        .logo-text span {
            display: inline-block;
            opacity: 0;
            transform: translateX(-20px);
            animation: letterReveal 0.8s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
        }

        .logo-text span:nth-child(1) { animation-delay: 0.2s; }
        .logo-text span:nth-child(2) { animation-delay: 0.3s; }
        .logo-text span:nth-child(3) { animation-delay: 0.4s; }
        .logo-text span:nth-child(4) { animation-delay: 0.5s; }
        .logo-text span:nth-child(5) { animation-delay: 0.6s; }
        .logo-text span:nth-child(6) { animation-delay: 0.7s; }
        .logo-text span:nth-child(7) { animation-delay: 0.8s; }
        .logo-text span:nth-child(8) { animation-delay: 0.9s; }

        @keyframes letterReveal {
            0% {
                opacity: 0;
                transform: translateX(-20px);
                filter: blur(4px);
            }
            50% {
                opacity: 0.8;
                transform: translateX(5px);
                filter: blur(1px);
            }
            100% {
                opacity: 1;
                transform: translateX(0);
                filter: blur(0);
            }
        }

        .loader-bar {
            width: 100%;
            height: 3px;
            background: #f0f0f0;
            border-radius: 2px;
            overflow: hidden;
            margin-top: 20px;
        }

        .loader-progress {
            height: 100%;
            background: linear-gradient(90deg, #1a1a2e 0%, #667eea 50%, #764ba2 100%);
            border-radius: 2px;
            width: 0;
            animation: progressFill 2s ease-in-out infinite;
        }

        @keyframes progressFill {
            0% {
                width: 0%;
            }
            80% {
                width: 80%;
            }
            100% {
                width: 100%;
            }
        }

        .loader-status {
            font-size: 13px;
            color: #888888;
            margin-top: 16px;
            text-align: center;
            letter-spacing: 2px;
            animation: statusPulse 2s ease-in-out infinite;
        }

        @keyframes statusPulse {
            0%, 100% {
                opacity: 0.5;
            }
            50% {
                opacity: 1;
            }
        }

        .particles {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            overflow: hidden;
        }

        .particle {
            position: absolute;
            width: 4px;
            height: 4px;
            background: rgba(102, 126, 234, 0.6);
            border-radius: 50%;
            animation: particleFloat 4s ease-in-out infinite;
        }

        .particle:nth-child(1) { left: 10%; animation-delay: 0s; }
        .particle:nth-child(2) { left: 25%; animation-delay: 0.5s; }
        .particle:nth-child(3) { left: 40%; animation-delay: 1s; }
        .particle:nth-child(4) { left: 55%; animation-delay: 1.5s; }
        .particle:nth-child(5) { left: 70%; animation-delay: 2s; }
        .particle:nth-child(6) { left: 85%; animation-delay: 2.5s; }

        @keyframes particleFloat {
            0%, 100% {
                transform: translateY(0) scale(1);
                opacity: 0;
            }
            10% {
                opacity: 1;
            }
            90% {
                opacity: 1;
            }
            100% {
                transform: translateY(-100px) scale(0);
                opacity: 0;
            }
        }
    </style>
</head>
<body>
    <div class="loader-container" id="loader">
        <div class="particles">
            <div class="particle"></div>
            <div class="particle"></div>
            <div class="particle"></div>
            <div class="particle"></div>
            <div class="particle"></div>
            <div class="particle"></div>
        </div>
        
        <div class="loader-box">
            <div class="logo-wrapper">
                <div class="logo-icon"></div>
                <div class="logo-text">
                    <span>K</span><span>D</span><span>X</span><span>丨</span><span>Z</span><span>H</span><span>X</span>
                </div>
                <div class="loader-bar">
                    <div class="loader-progress"></div>
                </div>
                <div class="loader-status" id="status">正在加载...</div>
            </div>
        </div>
    </div>

    <script>
        const statusTexts = [
            '正在加载资源...',
            '正在初始化组件...',
            '正在连接服务器...',
            '正在加载数据...',
            '即将完成...'
        ];

        let statusIndex = 0;
        const statusElement = document.getElementById('status');

        setInterval(() => {
            statusIndex = (statusIndex + 1) % statusTexts.length;
            statusElement.textContent = statusTexts[statusIndex];
        }, 800);

        function hideLoader() {
            const loader = document.getElementById('loader');
            loader.classList.add('hidden');
        }

        function showLoader() {
            const loader = document.getElementById('loader');
            loader.classList.remove('hidden');
        }

        window.addEventListener('load', () => {
            setTimeout(hideLoader, 2500);
        });
    </script>
</body>
</html>
