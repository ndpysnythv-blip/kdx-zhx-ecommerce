<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KDX丨ZHX - 加载中</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .loader-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            transition: opacity 0.4s cubic-bezier(0.4, 0, 0.2, 1), visibility 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            will-change: opacity, visibility;
        }

        .loader-container.hidden {
            opacity: 0;
            visibility: hidden;
        }

        .loader-box {
            background: #ffffff;
            border-radius: 24px;
            padding: 60px 80px;
            box-shadow: 0 25px 80px -20px rgba(0, 0, 0, 0.4),
                        0 0 0 1px rgba(255, 255, 255, 0.1) inset;
            position: relative;
            overflow: visible;
            animation: boxAppear 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
            will-change: transform, opacity;
        }

        /* Apple Intelligence 风格边框走马灯呼吸灯效果 */
        .loader-box::before {
            content: '';
            position: absolute;
            top: -4px;
            left: -4px;
            right: -4px;
            bottom: -4px;
            border-radius: 28px;
            background: linear-gradient(
                45deg,
                #667eea,
                #764ba2,
                #f093fb,
                #f5576c,
                #4facfe,
                #00f2fe,
                #667eea
            );
            background-size: 400% 400%;
            z-index: -1;
            animation: borderGlowRotate 4s linear infinite, borderGlowPulse 3s ease-in-out infinite;
            filter: blur(10px);
            opacity: 0.75;
            will-change: background-position, filter, opacity;
        }

        @keyframes borderGlowRotate {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        @keyframes borderGlowPulse {
            0%, 100% {
                filter: blur(8px);
                opacity: 0.6;
            }
            50% {
                filter: blur(14px);
                opacity: 1;
            }
        }

        /* 内层细边框效果 */
        .loader-box::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            border-radius: 24px;
            background: linear-gradient(
                135deg,
                transparent 25%,
                rgba(102, 126, 234, 0.1) 50%,
                rgba(118, 75, 162, 0.1) 50%,
                transparent 75%
            );
            background-size: 400% 400%;
            animation: innerGlowRotate 5s ease-in-out infinite;
            pointer-events: none;
            will-change: background-position;
        }

        @keyframes innerGlowRotate {
            0% { background-position: 0% 0%; }
            50% { background-position: 100% 100%; }
            100% { background-position: 0% 0%; }
        }

        @keyframes boxAppear {
            0% {
                transform: scale(0.85) translateY(10px);
                opacity: 0;
            }
            100% {
                transform: scale(1) translateY(0);
                opacity: 1;
            }
        }

        .logo-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 30px;
        }

        .logo-icon {
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, #1a1a2e 0%, #0f3460 100%);
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            animation: iconFloat 4s ease-in-out infinite;
            position: relative;
            will-change: transform;
        }

        @keyframes iconFloat {
            0%, 100% { transform: translateY(0) scale(1); }
            50% { transform: translateY(-12px) scale(1.02); }
        }

        .logo-icon::before {
            content: 'K';
            font-size: 40px;
            font-weight: 900;
            color: #ffffff;
            letter-spacing: -2px;
        }

        .logo-icon::after {
            content: '';
            position: absolute;
            top: -3px;
            left: -3px;
            right: -3px;
            bottom: -3px;
            border: 2px solid transparent;
            border-radius: 22px;
            background: linear-gradient(135deg, #667eea, #764ba2) border-box;
            -webkit-mask: linear-gradient(#fff 0 0) padding-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            animation: borderRotate 4s linear infinite;
            will-change: transform;
        }

        @keyframes borderRotate {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .logo-text {
            font-size: 36px;
            font-weight: 800;
            letter-spacing: 8px;
            color: #1a1a2e;
            position: relative;
            overflow: hidden;
            min-width: 280px;
            text-align: center;
        }

        .logo-text span {
            display: inline-block;
            opacity: 0;
            transform: translateX(-25px) translateY(5px) rotateY(-15deg);
            animation: letterRevealLoop 6s cubic-bezier(0.23, 1, 0.32, 1) infinite;
            will-change: opacity, transform, filter;
        }

        .logo-text span:nth-child(1) { animation-delay: 0s; }
        .logo-text span:nth-child(2) { animation-delay: 0.25s; }
        .logo-text span:nth-child(3) { animation-delay: 0.5s; }
        .logo-text span:nth-child(4) { animation-delay: 0.75s; }
        .logo-text span:nth-child(5) { animation-delay: 1s; }
        .logo-text span:nth-child(6) { animation-delay: 1.25s; }
        .logo-text span:nth-child(7) { animation-delay: 1.5s; }

        @keyframes letterRevealLoop {
            0%, 3% { 
                opacity: 0; 
                transform: translateX(-25px) translateY(5px) rotateY(-15deg); 
                filter: blur(6px); 
            }
            10%, 85% { 
                opacity: 1; 
                transform: translateX(0) translateY(0) rotateY(0deg); 
                filter: blur(0); 
            }
            95%, 100% { 
                opacity: 0; 
                transform: translateX(25px) translateY(-5px) rotateY(15deg); 
                filter: blur(6px); 
            }
        }

        .loader-bar {
            width: 100%;
            height: 4px;
            background: #f0f0f0;
            border-radius: 2px;
            overflow: hidden;
            margin-top: 20px;
            position: relative;
        }

        .loader-bar::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(
                90deg,
                transparent 0%,
                rgba(255, 255, 255, 0.6) 50%,
                transparent 100%
            );
            animation: loaderBarShine 2s ease-in-out infinite;
            z-index: 1;
        }

        @keyframes loaderBarShine {
            0%, 100% { transform: translateX(-100%); }
            50% { transform: translateX(100%); }
        }

        .loader-progress {
            height: 100%;
            background: linear-gradient(90deg, #1a1a2e 0%, #667eea 50%, #764ba2 100%);
            border-radius: 2px;
            width: 0;
            animation: progressFillLoop 6s cubic-bezier(0.4, 0, 0.2, 1) infinite;
            position: relative;
            will-change: width;
        }

        @keyframes progressFillLoop {
            0% { width: 0%; }
            70% { width: 92%; }
            85%, 100% { width: 100%; }
        }

        .loader-status {
            font-size: 13px;
            color: #888888;
            margin-top: 16px;
            text-align: center;
            letter-spacing: 2px;
            animation: statusPulse 3s ease-in-out infinite;
            will-change: opacity;
        }

        @keyframes statusPulse {
            0%, 100% { opacity: 0.4; transform: translateY(0); }
            50% { opacity: 1; transform: translateY(-1px); }
        }

        .particles {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            overflow: hidden;
        }

        .particle {
            position: absolute;
            width: 6px;
            height: 6px;
            background: rgba(102, 126, 234, 0.5);
            border-radius: 50%;
            animation: particleFloat 6s cubic-bezier(0.37, 0, 0.63, 1) infinite;
            will-change: transform, opacity;
        }

        .particle:nth-child(1) { left: 8%; animation-delay: 0s; }
        .particle:nth-child(2) { left: 22%; animation-delay: 0.8s; }
        .particle:nth-child(3) { left: 38%; animation-delay: 1.6s; }
        .particle:nth-child(4) { left: 58%; animation-delay: 2.4s; }
        .particle:nth-child(5) { left: 72%; animation-delay: 3.2s; }
        .particle:nth-child(6) { left: 88%; animation-delay: 4s; }

        @keyframes particleFloat {
            0% { 
                transform: translateY(0) scale(0.5); 
                opacity: 0;
            }
            5% { 
                opacity: 1;
            }
            95% { 
                opacity: 0.8;
            }
            100% { 
                transform: translateY(-150px) scale(1.2); 
                opacity: 0;
            }
        }

        .response-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.95);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px;
            border-radius: 24px;
            opacity: 0;
            visibility: hidden;
            transform: scale(0.9);
            transition: all 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .response-container.show {
            opacity: 1;
            visibility: visible;
            transform: scale(1);
        }

        .response-icon {
            width: 60px;
            height: 60px;
            background: linear-gradient(135deg, #10b981, #059669);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 20px;
            animation: responseIconPop 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        @keyframes responseIconPop {
            0% {
                transform: scale(0);
            }
            100% {
                transform: scale(1);
            }
        }

        .response-title {
            font-size: 24px;
            font-weight: 700;
            color: #1a1a2e;
            margin-bottom: 16px;
            text-align: center;
        }

        .response-content {
            font-size: 16px;
            color: #666666;
            line-height: 1.8;
            text-align: center;
            max-height: 200px;
            overflow-y: auto;
            white-space: pre-line;
        }

        .response-close {
            margin-top: 24px;
            padding: 12px 40px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .response-close:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(102, 126, 234, 0.4);
        }
    </style>
</head>
<body>
    <div class="loader-container" id="loader">
        <div class="particles">
            <div class="particle"></div>
            <div class="particle"></div>
            <div class="particle"></div>
            <div class="particle"></div>
            <div class="particle"></div>
            <div class="particle"></div>
        </div>
        
        <div class="loader-box">
            <div class="logo-wrapper">
                <div class="logo-icon"></div>
                <div class="logo-text">
                    <span>K</span><span>D</span><span>X</span><span>丨</span><span>Z</span><span>H</span><span>X</span>
                </div>
                <div class="loader-bar">
                    <div class="loader-progress"></div>
                </div>
                <div class="loader-status" id="status">正在连接服务器...</div>
            </div>
            
            <div class="response-container" id="responseContainer">
                <div class="response-icon">
                    <i style="color: white; font-size: 28px;" class="fas fa-check-circle"></i>
                </div>
                <div class="response-title">处理完成</div>
                <div class="response-content" id="responseContent"></div>
                <button class="response-close" onclick="closeLoader()">关闭</button>
            </div>
        </div>
    </div>

    <script>
        const statusTexts = [
            '正在连接服务器...',
            '正在获取数据...',
            '正在处理请求...',
            '即将完成...',
            '正在加载资源...'
        ];

        let statusIndex = 0;
        const statusElement = document.getElementById('status');
        const loaderContainer = document.getElementById('loader');
        const responseContainer = document.getElementById('responseContainer');
        const responseContent = document.getElementById('responseContent');

        const statusInterval = setInterval(() => {
            statusIndex = (statusIndex + 1) % statusTexts.length;
            statusElement.textContent = statusTexts[statusIndex];
        }, 1200);

        function showResponse(content) {
            responseContent.textContent = content;
            responseContainer.classList.add('show');
            
            setTimeout(() => {
                document.querySelector('.logo-wrapper').style.opacity = '0';
                document.querySelector('.logo-wrapper').style.pointerEvents = 'none';
            }, 300);
            
            clearInterval(statusInterval);
        }

        function hideLoader() {
            loaderContainer.classList.add('hidden');
        }

        function closeLoader() {
            hideLoader();
        }

        async function simulateBackendRequest() {
            try {
                const response = await fetch('/api/ai', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        messages: [{ role: 'user', content: '你好，有什么可以帮我的？' }] 
                    })
                });
                
                if (response.ok) {
                    const data = await response.json();
                    if (data.choices && data.choices[0] && data.choices[0].message) {
                        showResponse(data.choices[0].message.content);
                    }
                } else {
                    showResponse('抱歉，服务器暂时无法响应，请稍后再试。');
                }
            } catch (error) {
                console.error('请求失败:', error);
                showResponse('抱歉，连接服务器失败，请检查网络连接后重试。');
            }
        }

        window.addEventListener('load', () => {
            simulateBackendRequest();
        });
    </script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"></script>
</body>
</html>
