<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>支付宝扫码支付 - KDX丨ZHX</title>
    <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="/styles-premium.css">
</head>
<body class="bg-gray-50 min-h-screen">
    <!-- 顶部导航 -->
    <header class="bg-white shadow-sm sticky top-0 z-50">
        <div class="container-wide py-4">
            <div class="flex items-center gap-4">
                <button onclick="window.location.href='/cart'" class="text-gray-500 hover:text-black transition">
                    <i class="fas fa-arrow-left text-xl"></i>
                </button>
                <h1 class="text-xl font-bold text-black">支付宝扫码支付</h1>
            </div>
        </div>
    </header>

    <!-- 主内容 -->
    <main class="container-wide py-8 max-w-lg mx-auto">
        <!-- 订单信息 -->
        <div class="bg-white rounded-2xl shadow-sm p-6 mb-6">
            <div class="flex justify-between items-center mb-4">
                <span class="text-gray-500">支付金额</span>
                <span class="text-3xl font-bold text-red-500" id="totalAmount">¥0.00</span>
            </div>
            <div class="border-t pt-4">
                <div class="flex justify-between text-sm">
                    <span class="text-gray-500">订单号</span>
                    <span class="font-mono text-gray-700" id="outTradeNo">-</span>
                </div>
            </div>
        </div>

        <!-- 二维码区域 -->
        <div class="bg-white rounded-2xl shadow-sm p-6 mb-6 text-center">
            <div id="qrcode-container" class="inline-block p-4 bg-white border-2 border-gray-100 rounded-xl mb-4">
                <div id="qrcode" class="w-56 h-56 flex items-center justify-center bg-gray-100 rounded-lg">
                    <span class="text-gray-400"><i class="fas fa-spinner fa-spin text-2xl"></i></span>
                </div>
            </div>
            
            <p class="text-gray-600 mb-2">请使用 <span class="text-blue-600 font-semibold">支付宝</span> 扫描二维码</p>
            
            <!-- 支付状态 -->
            <div id="payment-status" class="mt-4 p-4 rounded-xl bg-gray-50">
                <div class="flex items-center justify-center gap-2 text-gray-500">
                    <i class="fas fa-clock"></i>
                    <span>等待支付...</span>
                </div>
            </div>
        </div>

        <!-- 操作按钮 -->
        <div class="space-y-3">
            <button id="refreshBtn" onclick="refreshQRCode()" class="w-full py-3 bg-white border border-gray-200 text-gray-700 rounded-xl font-medium hover:bg-gray-50 transition flex items-center justify-center gap-2">
                <i class="fas fa-sync-alt"></i>
                刷新二维码
            </button>
            <button onclick="window.location.href='/cart'" class="w-full py-3 text-gray-500 hover:text-gray-700 transition">
                返回购物车
            </button>
        </div>
    </main>

    <script>
        let orderId = null;
        let outTradeNo = null;
        let totalAmount = null;
        let pollInterval = null;
        let qrCodeData = null;

        // 获取 URL 参数
        function getUrlParams() {
            const params = new URLSearchParams(window.location.search);
            return {
                orderId: params.get('orderId'),
                outTradeNo: params.get('outTradeNo'),
                totalAmount: params.get('totalAmount'),
                subject: params.get('subject')
            };
        }

        // 生成二维码
        function generateQRCode(text) {
            const container = document.getElementById('qrcode');
            container.innerHTML = '';
            
            try {
                new QRCode(container, {
                    text: text,
                    width: 224,
                    height: 224,
                    colorDark: '#000000',
                    colorLight: '#ffffff',
                    correctLevel: QRCode.CorrectLevel.H
                });
            } catch (error) {
                console.error('二维码生成失败:', error);
                container.innerHTML = '<div class="text-center text-gray-400"><i class="fas fa-qrcode text-4xl mb-2"></i><p>二维码加载失败</p></div>';
            }
        }

        // 创建扫码支付订单
        async function createQRCodePayment() {
            try {
                const params = getUrlParams();
                orderId = params.orderId;
                totalAmount = params.totalAmount;
                
                // 显示金额
                document.getElementById('totalAmount').textContent = `¥${totalAmount}`;
                
                const response = await fetch('/api/alipay/qrcode', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        orderId: orderId,
                        totalAmount: totalAmount,
                        subject: params.subject || '商品订单'
                    })
                });
                
                const data = await response.json();
                
                if (data.success) {
                    outTradeNo = data.outTradeNo;
                    qrCodeData = data.qrCode;
                    
                    document.getElementById('outTradeNo').textContent = outTradeNo;
                    
                    if (data.isMock) {
                        // 模拟模式：显示 SVG 二维码
                        document.getElementById('qrcode').innerHTML = `<img src="${data.qrCode}" class="w-full h-full" alt="模拟支付二维码"/>`;
                    } else {
                        // 真实模式：生成二维码图片
                        generateQRCode(data.qrCode);
                    }
                    
                    // 开始轮询支付状态
                    startPolling();
                } else {
                    throw new Error(data.error || '创建订单失败');
                }
            } catch (error) {
                console.error('创建支付订单失败:', error);
                updatePaymentStatus('error', error.message || '创建订单失败');
            }
        }

        // 刷新二维码
        async function refreshQRCode() {
            const btn = document.getElementById('refreshBtn');
            const originalHTML = btn.innerHTML;
            
            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> 刷新中...';
            
            // 停止之前的轮询
            if (pollInterval) {
                clearInterval(pollInterval);
            }
            
            // 重新创建订单
            await createQRCodePayment();
            
            btn.disabled = false;
            btn.innerHTML = originalHTML;
        }

        // 开始轮询支付状态
        function startPolling() {
            updatePaymentStatus('pending', '等待支付...');
            
            pollInterval = setInterval(async () => {
                try {
                    const response = await fetch(`/api/alipay/status/${orderId}`);
                    const data = await response.json();
                    
                    if (data.status === 'paid') {
                        clearInterval(pollInterval);
                        updatePaymentStatus('success', '支付成功！');
                        
                        setTimeout(() => {
                            window.location.href = `/payment-success?orderId=${orderId}&outTradeNo=${outTradeNo}&totalAmount=${totalAmount}`;
                        }, 1500);
                    } else if (data.status === 'closed') {
                        clearInterval(pollInterval);
                        updatePaymentStatus('expired', '订单已过期，请刷新');
                    }
                } catch (error) {
                    console.error('查询支付状态失败:', error);
                }
            }, 2000); // 每2秒查询一次
        }

        // 更新支付状态显示
        function updatePaymentStatus(status, message) {
            const container = document.getElementById('payment-status');
            
            const statusConfig = {
                pending: { icon: 'clock', color: 'text-gray-500', bg: 'bg-gray-50', text: '等待支付...' },
                success: { icon: 'check-circle', color: 'text-green-600', bg: 'bg-green-50', text: '支付成功！' },
                expired: { icon: 'exclamation-circle', color: 'text-yellow-600', bg: 'bg-yellow-50', text: '订单已过期' },
                error: { icon: 'times-circle', color: 'text-red-600', bg: 'bg-red-50', text: message }
            };
            
            const config = statusConfig[status] || statusConfig.error;
            
            container.className = `mt-4 p-4 rounded-xl ${config.bg}`;
            container.innerHTML = `
                <div class="flex items-center justify-center gap-2 ${config.color}">
                    <i class="fas fa-${config.icon}"></i>
                    <span>${status === 'error' ? message : config.text}</span>
                </div>
            `;
        }

        // 页面加载时初始化
        document.addEventListener('DOMContentLoaded', () => {
            createQRCodePayment();
        });

        // 页面离开时清理定时器
        window.addEventListener('beforeunload', () => {
            if (pollInterval) {
                clearInterval(pollInterval);
            }
        });
    </script>
</body>
</html>
