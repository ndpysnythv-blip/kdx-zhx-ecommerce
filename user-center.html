<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>用户中心 - KDX丨ZHX</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="/styles-premium.css">
    <link rel="stylesheet" href="/mobile.css">
    <link rel="stylesheet" href="/loader.css">
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }
    </style>
</head>
<body>
    <!-- 通用加载动画 -->
    <div class="loader-overlay" id="appLoader">
        <div class="particles">
            <div class="particle"></div>
            <div class="particle"></div>
            <div class="particle"></div>
            <div class="particle"></div>
            <div class="particle"></div>
            <div class="particle"></div>
        </div>
        
        <div class="loader-box">
            <div class="logo-wrapper">
                <div class="logo-icon"></div>
                <div class="logo-text">
                    <span>K</span><span>D</span><span>X</span><span>丨</span><span>Z</span><span>H</span><span>X</span>
                </div>
                <div class="loader-bar">
                    <div class="loader-progress"></div>
                </div>
                <div class="loader-status" id="loaderStatus">加载中...</div>
            </div>
        </div>
    </div>
    <!-- 顶部导航栏 - 永远固定 -->
    <header class="bg-white shadow-sm fixed top-0 left-0 right-0 z-50">
        <div class="container-wide py-4">
            <div class="flex items-center justify-between">
                <!-- Logo - 左侧 -->
                <a href="/shop" class="flex items-center gap-3">
                    <h1 class="text-xl font-bold text-black">KDX丨ZHX</h1>
                </a>

                <!-- 标签栏 - 中间 -->
                <nav class="flex items-center gap-8">
                    <button class="tab-button px-4 py-4 font-medium text-gray-600 hover:text-black transition" data-tab="home" onclick="window.location.href='/shop'">首页</button>
                    <button class="tab-button px-4 py-4 font-medium text-gray-600 hover:text-black transition" data-tab="products" onclick="window.location.href='/shop'">商品</button>
                    <button class="tab-button px-4 py-4 font-medium text-gray-600 hover:text-black transition" data-tab="orders" onclick="window.location.href='/orders'">订单</button>
                    <button class="tab-button px-4 py-4 font-medium text-gray-600 hover:text-black transition" data-tab="chat" onclick="window.location.href='/chat'">智能客服</button>
                </nav>

                <!-- 功能按钮 - 右侧 -->
                <div class="flex items-center gap-4">
                    <button onclick="window.location.href='/chat'" class="text-gray-600 hover:text-black transition">
                        <i class="fas fa-headset text-xl"></i>
                    </button>
                    
                    <!-- 登录按钮 -->
                    <div id="userSection">
                        <button id="loginBtn" onclick="window.location.href='/auth?returnUrl=' + encodeURIComponent(window.location.pathname + window.location.search)" class="bg-black text-white px-6 py-2 rounded-lg font-medium hover:bg-gray-800 transition">
                            登录
                        </button>
                        <div id="userInfo" class="hidden items-center gap-3 bg-gray-100 rounded-lg px-4 py-2">
                            <span id="userName" class="font-medium text-gray-800"></span>
                            <button onclick="handleLogout()" class="text-gray-500 hover:text-red-600 transition">
                                <i class="fas fa-sign-out-alt"></i>
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <!-- 主内容区域 -->
    <main class="pt-20 pb-24">
        <section class="py-12">
            <div class="container-wide">
                <!-- 用户信息卡片 -->
                <div class="bg-black rounded-xl p-8 mb-8 text-white">
                    <div class="flex items-center gap-6">
                        <div class="w-20 h-20 bg-white/20 rounded-full flex items-center justify-center">
                            <i class="fas fa-user text-4xl"></i>
                        </div>
                        <div class="flex-1">
                            <h2 id="userNameDisplay" class="text-2xl font-bold mb-2">用户</h2>
                            <p id="userPhoneDisplay" class="text-white/80 text-lg"></p>
                        </div>
                        <button onclick="showSettings()" class="bg-white/20 hover:bg-white/30 px-6 py-3 rounded-xl transition flex items-center gap-2">
                            <i class="fas fa-cog"></i>
                            <span>设置</span>
                        </button>
                    </div>
                </div>

                <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
                    <!-- 订单列表 -->
                    <div class="lg:col-span-2">
                        <div class="glass-card rounded-xl p-6">
                            <div class="flex items-center justify-between mb-6">
                                <h2 class="text-xl font-bold text-black">
                                    <i class="fas fa-shopping-bag mr-2"></i>
                                    进行中的订单
                                </h2>
                                <a href="/orders" class="text-black hover:text-gray-600 font-medium flex items-center gap-1 transition">
                                    <span>查看全部订单</span>
                                    <i class="fas fa-chevron-right text-sm"></i>
                                </a>
                            </div>
                            
                            <div id="activeOrders" class="space-y-6">
                                <div class="text-center py-12">
                                    <i class="fas fa-box-open text-6xl text-gray-300 mb-4"></i>
                                    <p class="text-gray-500 text-xl mb-4">暂无进行中的订单</p>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- 客服对话 -->
                    <div class="lg:col-span-1">
                        <div class="glass-card rounded-xl p-6">
                            <h3 class="text-lg font-bold text-black mb-6">
                                <i class="fas fa-comments mr-2"></i>
                                客服对话
                            </h3>
                            
                            <div class="space-y-4">
                                <div class="p-4 bg-gray-50 rounded-xl cursor-pointer hover:bg-gray-100 transition" onclick="window.location.href='/chat?type=ai'">
                                    <div class="flex items-center gap-4">
                                        <div class="w-12 h-12 bg-black rounded-xl flex items-center justify-center">
                                            <i class="fas fa-robot text-white text-xl"></i>
                                        </div>
                                        <div class="flex-1">
                                            <h4 class="font-semibold text-black">智能客服</h4>
                                            <p class="text-sm text-gray-500">24小时在线，随时为您解答</p>
                                        </div>
                                        <i class="fas fa-chevron-right text-gray-400"></i>
                                    </div>
                                </div>
                                
                                <div class="p-4 bg-gray-50 rounded-xl cursor-pointer hover:bg-gray-100 transition" onclick="window.location.href='/chat?type=human'">
                                    <div class="flex items-center gap-4">
                                        <div class="w-12 h-12 bg-gray-800 rounded-xl flex items-center justify-center">
                                            <i class="fas fa-user-circle text-white text-xl"></i>
                                        </div>
                                        <div class="flex-1">
                                            <h4 class="font-semibold text-black">人工客服</h4>
                                            <p class="text-sm text-gray-500">工作时间：9:00-21:00</p>
                                        </div>
                                        <i class="fas fa-chevron-right text-gray-400"></i>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <!-- 设置弹窗 -->
    <div id="settingsModal" class="fixed inset-0 bg-black/50 hidden flex items-center justify-center z-50 p-4">
        <div class="bg-white rounded-xl w-full max-w-md p-8 max-h-[80vh] overflow-y-auto">
            <div class="flex items-center justify-between mb-8">
                <h3 class="text-xl font-bold text-black">账号设置</h3>
                <button onclick="closeSettings()" class="text-gray-400 hover:text-black text-2xl">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            
            <div class="space-y-4">
                <button class="w-full flex items-center gap-4 p-4 hover:bg-gray-50 rounded-xl transition text-left">
                    <div class="w-12 h-12 bg-gray-100 rounded-xl flex items-center justify-center">
                        <i class="fas fa-user-circle text-black text-xl"></i>
                    </div>
                    <div class="flex-1">
                        <p class="font-medium text-black">个人信息</p>
                        <p class="text-sm text-gray-500">修改个人资料</p>
                    </div>
                    <i class="fas fa-chevron-right text-gray-400"></i>
                </button>
                
                <button class="w-full flex items-center gap-4 p-4 hover:bg-gray-50 rounded-xl transition text-left">
                    <div class="w-12 h-12 bg-gray-100 rounded-xl flex items-center justify-center">
                        <i class="fas fa-lock text-black text-xl"></i>
                    </div>
                    <div class="flex-1">
                        <p class="font-medium text-black">修改密码</p>
                        <p class="text-sm text-gray-500">重置登录密码</p>
                    </div>
                    <i class="fas fa-chevron-right text-gray-400"></i>
                </button>
                
                <button class="w-full flex items-center gap-4 p-4 hover:bg-gray-50 rounded-xl transition text-left">
                    <div class="w-12 h-12 bg-gray-100 rounded-xl flex items-center justify-center">
                        <i class="fas fa-bell text-black text-xl"></i>
                    </div>
                    <div class="flex-1">
                        <p class="font-medium text-black">消息通知</p>
                        <p class="text-sm text-gray-500">通知偏好设置</p>
                    </div>
                    <i class="fas fa-chevron-right text-gray-400"></i>
                </button>
                
                <button class="w-full flex items-center gap-4 p-4 hover:bg-gray-50 rounded-xl transition text-left">
                    <div class="w-12 h-12 bg-gray-100 rounded-xl flex items-center justify-center">
                        <i class="fas fa-question-circle text-black text-xl"></i>
                    </div>
                    <div class="flex-1">
                        <p class="font-medium text-black">帮助与反馈</p>
                        <p class="text-sm text-gray-500">问题解答和意见</p>
                    </div>
                    <i class="fas fa-chevron-right text-gray-400"></i>
                </button>
                
                <button class="w-full flex items-center gap-4 p-4 hover:bg-gray-50 rounded-xl transition text-left">
                    <div class="w-12 h-12 bg-gray-100 rounded-xl flex items-center justify-center">
                        <i class="fas fa-info-circle text-black text-xl"></i>
                    </div>
                    <div class="flex-1">
                        <p class="font-medium text-black">关于我们</p>
                        <p class="text-sm text-gray-500">了解更多</p>
                    </div>
                    <i class="fas fa-chevron-right text-gray-400"></i>
                </button>
            </div>
        </div>
    </div>

    <script>
        let currentUser = null;
        
        // 检查登录状态
        function checkLoginStatus() {
            const user = localStorage.getItem('user');
            if (user) {
                currentUser = JSON.parse(user);
                document.getElementById('loginBtn').classList.add('hidden');
                document.getElementById('userInfo').classList.remove('hidden');
                document.getElementById('userInfo').classList.add('flex');
                document.getElementById('userName').textContent = currentUser.username;
            } else {
                window.location.href = '/auth?returnUrl=' + encodeURIComponent(window.location.pathname + window.location.search);
            }
        }

        // 更新用户信息显示
        function updateUserInfo() {
            if (currentUser) {
                document.getElementById('userNameDisplay').textContent = currentUser.username || '用户';
                document.getElementById('userPhoneDisplay').textContent = currentUser.phone || '';
            }
        }
        
        // 加载进行中的订单
        async function loadActiveOrders() {
            try {
                const response = await fetch('/api/orders');
                if (response.ok) {
                    const allOrders = await response.json();
                    const activeOrders = allOrders.filter(order => 
                        order.status === 'pending' || 
                        order.status === 'payment_pending' || 
                        order.status === 'paid' ||
                        order.status === 'shipped'
                    );
                    
                    renderActiveOrders(activeOrders);
                }
            } catch (error) {
                console.error('Load orders error:', error);
            }
        }
        
        // 渲染订单列表
        function renderActiveOrders(orders) {
            const container = document.getElementById('activeOrders');
            
            if (orders.length === 0) {
                container.innerHTML = `
                    <div class="text-center py-12">
                        <i class="fas fa-box-open text-6xl text-gray-300 mb-4"></i>
                        <p class="text-gray-500 text-xl mb-4">暂无进行中的订单</p>
                    </div>
                `;
                return;
            }
            
            container.innerHTML = orders.map(order => {
                const items = order.items || [];
                const item = items.length > 0 ? items[0] : null;
                const productName = item ? item.name : '商品';
                const productImage = item ? item.image : 'https://via.placeholder.com/112';
                const quantity = item ? item.quantity : 0;
                const totalPrice = order.total || 0;
                const orderNo = order.orderNo || order.outTradeNo || order.id;
                
                return `
                <div class="p-6 bg-gray-50 rounded-xl">
                    <div class="flex items-start justify-between mb-4">
                        <div>
                            <span class="text-sm text-gray-500">订单号: ${orderNo}</span>
                        </div>
                        <span class="px-4 py-2 rounded-full text-sm font-medium ${order.status === 'pending' ? 'bg-yellow-100 text-yellow-700' : order.status === 'payment_pending' ? 'bg-orange-100 text-orange-700' : order.status === 'paid' ? 'bg-blue-100 text-blue-700' : 'bg-green-100 text-green-700'}">
                            ${getStatusText(order.status)}
                        </span>
                    </div>
                    <div class="flex items-center gap-4">
                        <img src="${productImage}" alt="${productName}" class="w-28 h-28 object-cover rounded-xl" />
                        <div class="flex-1">
                            <h4 class="font-semibold text-black mb-2">${productName}</h4>
                            <p class="text-sm text-gray-500 mb-2">数量: ${quantity}</p>
                            <p class="text-2xl font-bold text-black">¥${totalPrice}</p>
                        </div>
                    </div>
                </div>
            `}).join('');
        }
        
        // 获取状态文本
        function getStatusText(status) {
            const statusMap = {
                'pending': '待付款',
                'payment_pending': '待审核',
                'paid': '已付款',
                'processing': '处理中',
                'shipped': '已发货',
                'delivered': '已收货',
                'completed': '已完成',
                'cancelled': '已取消',
                'refund_pending': '退款中',
                'refunded': '已退款'
            };
            return statusMap[status] || status;
        }
        
        // 显示设置弹窗
        function showSettings() {
            document.getElementById('settingsModal').classList.remove('hidden');
        }
        
        // 关闭设置弹窗
        function closeSettings() {
            document.getElementById('settingsModal').classList.add('hidden');
        }
        
        // 退出登录
        function handleLogout() {
            localStorage.removeItem('user');
            localStorage.removeItem('token');
            currentUser = null;
            window.location.href = '/auth';
        }

        // 点击弹窗外部关闭
        document.getElementById('settingsModal').addEventListener('click', function(e) {
            if (e.target === this) {
                closeSettings();
            }
        });

        // 初始化页面
        document.addEventListener('DOMContentLoaded', async () => {
            checkLoginStatus();
            if (currentUser) {
                updateUserInfo();
                await loadActiveOrders();
            }
        });
    </script>
    <script src="/ai-assistant.js"></script>
    <script src="/loader.js"></script>
</body>
</html>
