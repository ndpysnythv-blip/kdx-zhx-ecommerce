<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KDX · 宇宙粒子</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;background:#000;overflow:hidden}
body{font-family:sans-serif;color:#fff;user-select:none}
canvas{display:block;position:fixed;top:0;left:0}
#cam{position:fixed;bottom:16px;right:16px;width:160px;height:120px;border-radius:10px;
overflow:hidden;z-index:20;background:#000;display:none;
border:1px solid rgba(255,255,255,.05);opacity:.6}
#cam video{width:100%;height:100%;object-fit:cover;transform:scaleX(-1)}
#lbl{position:fixed;top:40px;left:50%;transform:translateX(-50%);font-size:12px;
font-weight:300;letter-spacing:12px;z-index:10;
opacity:0;transition:opacity .6s;pointer-events:none;
text-transform:uppercase;color:rgba(255,255,255,.35)}
#lbl.show{opacity:1}
#hint{position:fixed;bottom:20px;left:20px;z-index:10;font-size:10px;
color:rgba(255,255,255,.08);line-height:2.2;pointer-events:none;letter-spacing:1.5px}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="cam"><video id="v" autoplay playsinline muted></video></div>
<div id="lbl"></div>
<div id="hint">张开 · 扩散 &nbsp;&nbsp; 握拳 · 收缩 &nbsp;&nbsp; 捏合 · 漩涡 &nbsp;&nbsp; 指向 · 追踪 &nbsp;&nbsp; 1-5 切换</div>

<script>
(function(){
'use strict';

var cv=document.getElementById('c'),ctx=cv.getContext('2d');
var vid=document.getElementById('v'),camBox=document.getElementById('cam');
var lbl=document.getElementById('lbl');
var W=innerWidth,H=innerHeight;
cv.width=W;cv.height=H;

addEventListener('resize',function(){W=innerWidth;H=innerHeight;cv.width=W;cv.height=H});

var gest='none',hx=.5,hy=.5,hx2=.5,hy2=.5,hasH=false,hdx=0,hdy=0,phx=.5,phy=.5,time=0;
var NAMES={none:'',open:'expansion',fist:'contraction',pinch:'vortex',point:'tracking',two:'gravity'};
var PAL={
  none:{h:220,s:30,l:50},open:{h:35,s:55,l:55},fist:{h:280,s:40,l:45},
  pinch:{h:250,s:45,l:50},point:{h:180,s:40,l:48},two:{h:210,s:50,l:52}
};
function setG(g){if(g!==gest){gest=g;lbl.textContent=NAMES[g]||'';lbl.classList.toggle('show',!!NAMES[g])}}

/* Stars */
var stars=[];
for(var i=0;i<180;i++)stars.push({x:Math.random()*W,y:Math.random()*H,
  r:Math.random()*.5+.15,a:Math.random()*.2+.04,tw:Math.random()*6.28,sp:Math.random()*.3+.08});

/* Orbs */
var ORB_N=100,cnt=70,orbs=[];
function Orb(){
  this.x=Math.random()*W;this.y=Math.random()*H;
  this.vx=(Math.random()-.5)*.12;this.vy=(Math.random()-.5)*.12;
  this.sz=Math.random()*2.5+1.2;this.bsz=this.sz;
  this.h=Math.random()*50+215;this.s=Math.random()*20+28;this.l=Math.random()*12+42;
  this.a=Math.random()*.35+.12;this.ba=this.a;
  this.gs=Math.random()*20+10;this.p=Math.random()*6.28;this.ps=Math.random()*.012+.006;
  this.ph=Math.random()*6.28;this.tl=[];this.tn=3;
}
for(var i=0;i<ORB_N;i++)orbs.push(new Orb());

/* Nebula — pre-rendered */
var nebCvs=document.createElement('canvas'),nebCtx=nebCvs.getContext('2d');
function genNebula(){
  nebCvs.width=W;nebCvs.height=H;
  nebCtx.fillStyle='#000008';nebCtx.fillRect(0,0,W,H);
  var cls=[{x:.25,y:.35,r:.45,h:260,a:.022},{x:.7,y:.6,r:.4,h:300,a:.018},
           {x:.5,y:.2,r:.35,h:220,a:.015},{x:.8,y:.3,r:.3,h:340,a:.012}];
  for(var i=0;i<cls.length;i++){var cl=cls[i];
    var g=nebCtx.createRadialGradient(cl.x*W,cl.y*H,0,cl.x*W,cl.y*H,cl.r*W);
    g.addColorStop(0,'hsla('+cl.h+',15%,5%,'+cl.a+')');
    g.addColorStop(.6,'hsla('+cl.h+',12%,3%,'+(cl.a*.4)+')');
    g.addColorStop(1,'transparent');
    nebCtx.fillStyle=g;nebCtx.fillRect(0,0,W,H)}
}
genNebula();

/* Connections */
function drawConn(){
  var md=80,mn=120,n=0;
  for(var i=0;i<cnt&&n<mn;i++)for(var j=i+1;j<cnt&&n<mn;j++){
    var dx=orbs[i].x-orbs[j].x,dy=orbs[i].y-orbs[j].y,d=Math.sqrt(dx*dx+dy*dy);
    if(d<md){var al=(1-d/md)*.05;
      ctx.beginPath();ctx.moveTo(orbs[i].x,orbs[i].y);ctx.lineTo(orbs[j].x,orbs[j].y);
      ctx.strokeStyle='hsla(230,25%,55%,'+al+')';ctx.lineWidth=.3;ctx.stroke();n++}}
}

/* Physics */
function phys(dt){
  time+=dt;var col=PAL[gest];
  for(var i=0;i<cnt;i++){
    var p=orbs[i];p.p+=p.ps;
    p.h+=(col.h+Math.sin(time*.5+p.ph)*15-p.h)*.01;
    p.s+=(col.s-p.s)*.01;p.l+=(col.l-p.l)*.01;

    var dx,dy,d,f,a;
    switch(gest){
      case'open':dx=p.x-hx*W;dy=p.y-hy*H;d=Math.sqrt(dx*dx+dy*dy);
        if(d<250&&d>1){f=(1-d/250)*(1-d/250)*1.5;p.vx+=dx/d*f;p.vy+=dy/d*f;
          p.sz=p.bsz*(1+(1-d/250)*1.2);a=Math.atan2(dy,dx);
          p.vx+=Math.cos(a+1.57)*f*.18;p.vy+=Math.sin(a+1.57)*f*.18}p.tn=6;break;
      case'fist':dx=hx*W-p.x;dy=hy*H-p.y;d=Math.sqrt(dx*dx+dy*dy);
        if(d<280&&d>12){f=(1-d/280)*(1-d/280)*2.5;p.vx+=dx/d*f;p.vy+=dy/d*f;
          p.sz=p.bsz*(.4+d/280*.6);a=Math.atan2(dy,dx);
          p.vx+=Math.cos(a+1.57)*f*.08;p.vy+=Math.sin(a+1.57)*f*.08}
        else if(d<=12){a=Math.atan2(p.y-hy*H,p.x-hx*W);
          p.vx=Math.cos(a+1.8)*.6;p.vy=Math.sin(a+1.8)*.6;p.sz=p.bsz*.3}p.tn=2;break;
      case'pinch':dx=hx*W-p.x;dy=hy*H-p.y;d=Math.sqrt(dx*dx+dy*dy);
        if(d<180&&d>2){f=(1-d/180)*(1-d/180)*3;a=Math.atan2(dy,dx);
          p.vx+=Math.cos(a+1.57)*f*.55;p.vy+=Math.sin(a+1.57)*f*.55;
          p.vx+=dx/d*f*.18;p.vy+=dy/d*f*.18;
          p.sz=p.bsz*(1+Math.sin(time*4+p.ph)*.3)}p.tn=8;break;
      case'point':dx=p.x-hx*W;dy=p.y-hy*H;d=Math.sqrt(dx*dx+dy*dy);
        if(d<280&&d>4){var dl=Math.sqrt(hdx*hdx+hdy*hdy);
          if(dl>.0005){var nx=hdx/dl,ny=hdy/dl;p.vx+=nx*1;p.vy+=ny*1;p.sz=p.bsz*1.1}}p.tn=4;break;
      case'two':for(var h=0;h<2;h++){var hhx=(h?hx2:hx)*W,hhy=(h?hy2:hy)*H;
          dx=hhx-p.x;dy=hhy-p.y;d=Math.sqrt(dx*dx+dy*dy);
          if(d<250&&d>1){f=(1-d/250)*(1-d/250)*1.8;p.vx+=dx/d*f;p.vy+=dy/d*f}}p.tn=7;break;
      default:p.vx+=Math.sin(time*.25+p.ph)*.004;p.vy+=Math.cos(time*.2+p.ph*1.3)*.004;
        p.sz+=(p.bsz-p.sz)*.03;p.tn=3;break;
    }
    p.vx+=Math.sin(time*.6+p.ph)*.003;p.vy+=Math.cos(time*.5+p.ph2)*.003;
    p.vx*=.99;p.vy*=.99;
    p.tl.push({x:p.x,y:p.y});if(p.tl.length>p.tn)p.tl.shift();
    p.x+=p.vx;p.y+=p.vy;
    if(p.x<-20)p.x=W+20;if(p.x>W+20)p.x=-20;
    if(p.y<-20)p.y=H+20;if(p.y>H+20)p.y=-20;
  }
}

/* Render */
var lt=0,fc=0,ft=0,fps=0,dt2=0;

function frame(ts){
  var dt=Math.min((ts-lt)/1000,.05);lt=ts;fc++;ft+=dt;dt2+=dt;
  if(ft>=1){fps=fc;fc=0;ft=0}
  if(dt2>.066){detectHand();dt2=0}

  // Fade
  ctx.fillStyle='rgba(0,0,8,.06)';ctx.fillRect(0,0,W,H);

  // Nebula
  ctx.globalAlpha=.006;ctx.drawImage(nebCvs,0,0);ctx.globalAlpha=1;

  // Stars
  for(var i=0;i<stars.length;i++){var st=stars[i];st.tw+=dt*st.sp;
    var sa=st.a*(.3+.7*Math.sin(st.tw));
    ctx.beginPath();ctx.arc(st.x,st.y,st.r,0,6.28);
    ctx.fillStyle='rgba(255,255,255,'+sa+')';ctx.fill()}

  phys(dt);

  // Draw orbs
  for(var i=0;i<cnt;i++){
    var p=orbs[i];var pulse=.7+.3*Math.sin(p.p);
    var al=p.a*pulse;if(al<.003)continue;
    var ih=Math.floor(p.h),is=Math.floor(p.s),il=Math.floor(p.l);
    var sz=p.sz*pulse;

    // Trail
    if(p.tl.length>1){
      ctx.beginPath();ctx.moveTo(p.tl[0].x,p.tl[0].y);
      for(var j=1;j<p.tl.length;j++)ctx.lineTo(p.tl[j].x,p.tl[j].y);
      ctx.strokeStyle='hsla('+ih+','+is+'%,'+il+'%,'+(al*.1)+')';
      ctx.lineWidth=sz*.3;ctx.lineCap='round';ctx.stroke()}

    // Outer glow
    var gs=p.gs*pulse;
    var g=ctx.createRadialGradient(p.x,p.y,0,p.x,p.y,gs);
    g.addColorStop(0,'hsla('+ih+','+is+'%,'+(il+12)+'%,'+(al*.4)+')');
    g.addColorStop(.3,'hsla('+ih+','+is+'%,'+il+'%,'+(al*.15)+')');
    g.addColorStop(.7,'hsla('+ih+','+is+'%,'+(il-3)+'%,'+(al*.04)+')');
    g.addColorStop(1,'hsla('+ih+','+is+'%,'+il+'%,0)');
    ctx.beginPath();ctx.arc(p.x,p.y,gs,0,6.28);ctx.fillStyle=g;ctx.fill();

    // Core glow
    var cg=ctx.createRadialGradient(p.x,p.y,0,p.x,p.y,sz*2);
    cg.addColorStop(0,'hsla('+ih+',45%,80%,'+(al*.7)+')');
    cg.addColorStop(.5,'hsla('+ih+','+is+'%,'+(il+15)+'%,'+(al*.3)+')');
    cg.addColorStop(1,'hsla('+ih+','+is+'%,'+il+'%,0)');
    ctx.beginPath();ctx.arc(p.x,p.y,sz*2,0,6.28);ctx.fillStyle=cg;ctx.fill();

    // Bright center
    ctx.beginPath();ctx.arc(p.x,p.y,sz*.3,0,6.28);
    ctx.fillStyle='hsla('+ih+',25%,90%,'+(al*.5)+')';ctx.fill();
  }

  drawConn();

  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

/* Camera */
var camOk=false;
var pc=document.createElement('canvas');pc.width=100;pc.height=75;
var pcx=pc.getContext('2d',{willReadFrequently:true});

function startCam(){
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia)return;
  navigator.mediaDevices.getUserMedia({video:{width:640,height:480,facingMode:'user'}})
    .then(function(s){vid.srcObject=s;camBox.style.display='block';return vid.play()})
    .then(function(){camOk=true}).catch(function(){});
}
startCam();

function detectHand(){
  if(!camOk||vid.readyState<2)return;
  pcx.drawImage(vid,0,0,100,75);
  var img=pcx.getImageData(0,0,100,75),d=img.data,PW=100,PH=75;
  var skin=[];for(var i=0;i<PW*PH;i++)skin[i]=0;
  for(var i=0;i<d.length;i+=4){var r=d[i],g=d[i+1],b=d[i+2];
    var cb=128-.169*r-.331*g+.5*b,cr=128+.5*r-.419*g-.081*b;
    if(cr>133&&cr<175&&cb>80&&cb<135)skin[i/4]=1}
  var vis=[];for(var i=0;i<PW*PH;i++)vis[i]=0;var blobs=[];
  for(var y=1;y<PH-1;y++)for(var xx=1;xx<PW-1;xx++){var idx=y*PW+xx;
    if(!skin[idx]||vis[idx])continue;
    var sx=0,sy=0,n=0,q=[idx];vis[idx]=1;
    while(q.length&&n<400){var ci=q.shift(),cx=ci%PW,cy=(ci-cx)/PW;sx+=cx;sy+=cy;n++;
      var nb=[[cx-1,cy],[cx+1,cy],[cx,cy-1],[cx,cy+1]];
      for(var k=0;k<4;k++){var nx=nb[k][0],ny=nb[k][1];
        if(nx>=0&&nx<PW&&ny>=0&&ny<PH){var ni=ny*PW+nx;if(skin[ni]&&!vis[ni]){vis[ni]=1;q.push(ni)}}}}
    if(n>60)blobs.push({x:1-sx/n/PW,y:sy/n/PH,n:n})}
  blobs.sort(function(a,b){return b.n-a.n});
  if(blobs.length>=2&&blobs[1].n>50){hx=blobs[0].x;hy=blobs[0].y;hx2=blobs[1].x;hy2=blobs[1].y;hasH=true;setG('two')}
  else if(blobs.length>=1&&blobs[0].n>80){phx=hx;phy=hy;hx=blobs[0].x;hy=blobs[0].y;hdx=hx-phx;hdy=hy-phy;hasH=true;
    var sp=Math.sqrt(hdx*hdx+hdy*hdy),sz=blobs[0].n;
    if(sp>.02)setG('open');else if(sz>250)setG('fist');else if(sz>120)setG('pinch');else setG('point')}
  else{hasH=false;setG('none')}
}

/* Mouse/Touch */
var md=false;
cv.style.cursor='crosshair';
cv.addEventListener('mousemove',function(e){
  if(camOk&&hasH)return;lmx=hx*W;lmy=hy*H;hx=e.clientX/W;hy=e.clientY/H;
  hdx=hx-lmx/W;hdy=hy-lmy/H;hasH=true;
  var sp=Math.sqrt(hdx*hdx+hdy*hdy);
  if(md)setG('fist');else if(sp>.008)setG('open');else setG('point')});
cv.addEventListener('mousedown',function(){md=true;if(!camOk||!hasH)setG('fist')});
cv.addEventListener('mouseup',function(){md=false;if(!camOk||!hasH)setG('open')});
cv.addEventListener('mouseleave',function(){if(!camOk){hasH=false;setG('none')}});
cv.addEventListener('touchmove',function(e){e.preventDefault();
  if(camOk&&hasH)return;var t=e.touches[0];hx=t.clientX/W;hy=t.clientY/H;hasH=true;setG('pinch')},{passive:false});
cv.addEventListener('touchend',function(){if(!camOk){hasH=false;setG('none')}});
var lmx=W/2,lmy=H/2;
var km={'0':'none','1':'open','2':'fist','3':'pinch','4':'point','5':'two'};
addEventListener('keydown',function(e){if(km[e.key]){hasH=true;setG(km[e.key])}
  if(e.key==='+'||e.key==='=')cnt=Math.min(ORB_N,cnt+10);if(e.key==='-')cnt=Math.max(20,cnt-10)});

})();
</script>
</body>
</html>
