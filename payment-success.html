<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#000000">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>支付成功 - KDX丨ZHX</title>
    <link rel="manifest" href="/manifest.json">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="/styles-premium.css">
    <link rel="stylesheet" href="/mobile.css">
    <!-- Vercel Web Analytics -->
    <script defer src="https://cdn.vercel-insights.com/v1/script.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: white;
            min-height: 100vh;
        }
    </style>
</head>
<body>
    <!-- 导航栏 -->
    <header class="bg-white shadow-sm fixed top-0 left-0 right-0 z-50">
        <div class="container-wide py-4">
            <div class="flex items-center justify-between">
                <a href="/shop" class="flex items-center gap-3">
                    <h1 class="text-xl font-bold text-black">KDX丨ZHX</h1>
                </a>
                
                <div class="flex items-center gap-4">
                    <a href="/cart" class="relative">
                        <i class="fas fa-shopping-cart text-black text-xl"></i>
                        <span id="cartBadge" class="absolute -top-2 -right-2 bg-black text-white text-xs w-5 h-5 rounded-full flex items-center justify-center hidden">0</span>
                    </a>
                    <a href="/auth" id="loginBtn">
                        <i class="fas fa-user text-black text-xl"></i>
                    </a>
                    <div id="userInfo" class="hidden items-center gap-2">
                        <span id="userName" class="text-black font-medium"></span>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <!-- 主要内容 -->
    <main class="pt-24 pb-16">
        <div class="container-wide max-w-2xl text-center">
            <div class="w-24 h-24 bg-black rounded-full flex items-center justify-center mx-auto mb-8">
                <i class="fas fa-check-circle text-white text-5xl"></i>
            </div>

            <h1 class="text-3xl font-bold text-black mb-4">支付成功！</h1>
            <p class="text-gray-600 text-lg mb-8">您的订单已提交成功，我们会尽快为您处理</p>

            <div class="glass-card p-8 mb-8">
                <div class="grid grid-cols-2 gap-6 text-left">
                    <div>
                        <p class="text-gray-500 text-sm mb-2">订单编号</p>
                        <p id="orderNumber" class="font-semibold text-black text-lg"></p>
                    </div>
                    <div>
                        <p class="text-gray-500 text-sm mb-2">支付金额</p>
                        <p id="orderAmount" class="font-semibold text-black text-2xl"></p>
                    </div>
                    <div>
                        <p class="text-gray-500 text-sm mb-2">支付方式</p>
                        <p class="font-semibold text-black">支付宝</p>
                    </div>
                    <div>
                        <p class="text-gray-500 text-sm mb-2">支付时间</p>
                        <p id="orderTime" class="font-semibold text-black"></p>
                    </div>
                </div>
            </div>

            <div class="flex flex-col sm:flex-row gap-4 justify-center">
                <button onclick="viewOrder()" class="btn-premium btn-lg flex-1">
                    <i class="fas fa-receipt mr-2"></i>
                    查看订单
                </button>
                <button onclick="continueShopping()" class="btn-premium btn-lg flex-1" style="background: white; color: black; border: 2px solid black;">
                    <i class="fas fa-shopping-bag mr-2"></i>
                    继续购物
                </button>
            </div>

            <div class="mt-8 pt-8 border-t border-gray-200">
                <p class="text-gray-500 text-sm">
                    <i class="fas fa-info-circle mr-2"></i>
                    如有问题，请联系客服
                </p>
            </div>
        </div>
    </main>

    <script>
        let currentOrderId = null;

        function getQueryParam(param) {
            const urlParams = new URLSearchParams(window.location.search);
            return urlParams.get(param);
        }

        function checkLoginStatus() {
            const user = localStorage.getItem('user');
            if (user) {
                const currentUser = JSON.parse(user);
                document.getElementById('loginBtn').classList.add('hidden');
                document.getElementById('userInfo').classList.remove('hidden');
                document.getElementById('userInfo').classList.add('flex');
                document.getElementById('userName').textContent = currentUser.username;
            } else {
                document.getElementById('loginBtn').classList.remove('hidden');
                document.getElementById('userInfo').classList.add('hidden');
                document.getElementById('userInfo').classList.remove('flex');
            }
        }

        async function loadOrder() {
            const orderId = getQueryParam('orderId');
            const outTradeNo = getQueryParam('outTradeNo');
            const totalAmount = getQueryParam('totalAmount');
            
            currentOrderId = orderId || outTradeNo;
            
            if (!currentOrderId) {
                document.getElementById('orderNumber').textContent = '未知订单';
                document.getElementById('orderAmount').textContent = '¥0.00';
                document.getElementById('orderTime').textContent = new Date().toLocaleString();
                return;
            }

            try {
                // 尝试从服务器获取订单信息
                const response = await fetch(`/api/orders/${currentOrderId}`);
                if (response.ok) {
                    const order = await response.json();
                    document.getElementById('orderNumber').textContent = order.orderNo || order.id.substring(0, 8) + '...';
                    document.getElementById('orderAmount').textContent = `¥${(order.total || 0).toFixed(2)}`;
                    document.getElementById('orderTime').textContent = new Date(order.paidAt || order.createdAt || Date.now()).toLocaleString();
                } else {
                    document.getElementById('orderNumber').textContent = currentOrderId.substring(0, 8) + '...';
                    document.getElementById('orderAmount').textContent = totalAmount ? `¥${totalAmount}` : '¥0.00';
                    document.getElementById('orderTime').textContent = new Date().toLocaleString();
                }
            } catch (error) {
                console.error('Error loading order:', error);
                document.getElementById('orderNumber').textContent = currentOrderId.substring(0, 8) + '...';
                document.getElementById('orderAmount').textContent = totalAmount ? `¥${totalAmount}` : '¥0.00';
                document.getElementById('orderTime').textContent = new Date().toLocaleString();
            }

            // 清空购物车
            const cart = [];
            localStorage.setItem('cart', JSON.stringify(cart));
        }

        function viewOrder() {
            window.location.href = '/my-orders';
        }

        function continueShopping() {
            window.location.href = '/shop';
        }

        document.addEventListener('DOMContentLoaded', function() {
            checkLoginStatus();
            loadOrder();
        });
    </script>
    <script src="/ai-assistant.js"></script>
</body>
</html>
