<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KDX 手势粒子特效</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;overflow:hidden;font-family:'Segoe UI',sans-serif;color:#fff;user-select:none}
canvas{position:fixed;top:0;left:0;width:100%;height:100%}
#bg{z-index:0}#main{z-index:1}#overlay{z-index:2;pointer-events:none}
#cam{position:fixed;bottom:20px;right:20px;width:220px;height:165px;border-radius:14px;
overflow:hidden;border:2px solid rgba(255,255,255,.12);z-index:10;background:#111;
box-shadow:0 8px 32px rgba(0,0,0,.5);display:none}
#cam video{width:100%;height:100%;object-fit:cover;transform:scaleX(-1)}
#label{position:fixed;top:28px;left:50%;transform:translateX(-50%);font-size:26px;
font-weight:300;letter-spacing:5px;z-index:5;text-shadow:0 0 25px rgba(255,255,255,.4);
opacity:0;transition:opacity .35s;pointer-events:none}
#label.show{opacity:1}
#info{position:fixed;top:28px;left:28px;z-index:5;font-size:12px;line-height:1.7;
opacity:.45;pointer-events:none}
#btn{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);z-index:20;
padding:16px 44px;font-size:17px;font-weight:300;letter-spacing:3px;
background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.18);color:#fff;
border-radius:50px;cursor:pointer;backdrop-filter:blur(16px);transition:all .25s}
#btn:hover{background:rgba(255,255,255,.13);border-color:rgba(255,255,255,.35);
box-shadow:0 0 35px rgba(255,255,255,.08)}
#btn:disabled{opacity:.45;cursor:wait}
#msg{position:fixed;top:50%;left:50%;transform:translate(-50%,calc(-50%+55px));
z-index:21;font-size:13px;color:rgba(255,255,255,.55);pointer-events:none;
text-align:center;max-width:380px;line-height:1.7}
#keys{position:fixed;bottom:28px;left:28px;z-index:5;font-size:11px;line-height:2;
opacity:.35;pointer-events:none}
#keys span{display:inline-block;padding:2px 9px;margin:2px 3px;
background:rgba(255,255,255,.05);border-radius:18px;border:1px solid rgba(255,255,255,.08)}
#loader{position:fixed;top:0;left:0;width:100%;height:100%;
background:rgba(0,0,0,.82);z-index:30;display:none;
justify-content:center;align-items:center;flex-direction:column;gap:18px}
#loader .spin{width:36px;height:36px;border:3px solid rgba(255,255,255,.08);
border-top-color:rgba(255,255,255,.6);border-radius:50%;animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
#loader .txt{font-size:15px;opacity:.6}
</style>
</head>
<body>
<canvas id="bg"></canvas>
<canvas id="main"></canvas>
<canvas id="overlay"></canvas>
<div id="cam"><video id="v" autoplay playsinline muted></video></div>
<div id="label"></div>
<div id="info"></div>
<div id="msg"></div>
<button id="btn">启动手势感应</button>
<div id="keys">
<span>✋ 张开 — 扩散</span><span>✊ 握拳 — 收缩</span><span>🤏 捏合 — 漩涡</span>
<span>☝️ 指向 — 追踪</span><span>🖐️🖐️ 双手 — 引力场</span>
</div>
<div id="loader"><div class="spin"></div><div class="txt" id="ltxt">加载中...</div></div>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1675469240/hands.js" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils@0.3.1675466862/camera_utils.js" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils@0.3.1675466124/drawing_utils.js" crossorigin="anonymous"></script>

<script>
(function(){
'use strict';

/* ── DOM ── */
const $=id=>document.getElementById(id);
const video=$('v'),camBox=$('cam'),oc=$('overlay'),ox=oc.getContext('2d');
const mc=$('main'),mx=mc.getContext('2d'),bc=$('bg'),bx=bc.getContext('2d');
const label=$('label'),info=$('info'),msg=$('msg'),btn=$('btn');
const loader=$('loader'),ltxt=$('ltxt');

/* ── Resize ── */
let W,H;
function resize(){
  W=innerWidth;H=innerHeight;
  for(const c of[mc,bc,oc]){c.width=W;c.height=H}
  bgStars.forEach(s=>{s.x=Math.random()*W;s.y=Math.random()*H});
}
resize();addEventListener('resize',resize);

/* ── Gesture constants ── */
const G={NONE:'none',OPEN:'open',FIST:'fist',PINCH:'pinch',POINT:'point',TWO:'two'};
const GN={
  [G.NONE]:'等待手势',[G.OPEN]:'张开 · 扩散',[G.FIST]:'握拳 · 收缩',
  [G.PINCH]:'捏合 · 漩涡',[G.POINT]:'指向 · 追踪',[G.TWO]:'双手 · 引力场'
};
const GC={
  [G.NONE]:{h:200,s:30,l:60},[G.OPEN]:{h:45,s:100,l:65},
  [G.FIST]:{h:350,s:100,l:55},[G.PINCH]:{h:270,s:90,l:60},
  [G.POINT]:{h:160,s:90,l:55},[G.TWO]:{h:200,s:100,l:65}
};

/* ── Gesture recognition ── */
function fingers(lm){
  const tips=[4,8,12,16,20],pips=[3,6,10,14,18],r=[];
  r.push(Math.abs(lm[4].x-lm[2].x)>Math.abs(lm[3].x-lm[2].x)*1.2);
  for(let i=1;i<5;i++) r.push(lm[tips[i]].y<lm[pips[i]].y);
  return r;
}
function gesture(lm){
  const f=fingers(lm),all=f.every(v=>v),none=f.slice(1).every(v=>!v);
  const idx=f[1]&&!f[2]&&!f[3]&&!f[4];
  const pd=Math.hypot(lm[4].x-lm[8].x,lm[4].y-lm[8].y);
  if(pd<.06)return G.PINCH;if(all)return G.OPEN;
  if(none&&!f[0])return G.FIST;if(idx)return G.POINT;
  if(none&&f[0])return G.FIST;return G.NONE;
}
function center(lm){return{x:lm[9].x,y:lm[9].y}}
function pinch(lm){return{x:(lm[4].x+lm[8].x)/2,y:(lm[4].y+lm[8].y)/2}}
function pdir(lm){return{x:lm[8].x-lm[6].x,y:lm[8].y-lm[6].y}}

/* ── Particles ── */
const MAX=2000,arr=[],N=()=>800;
let cnt=800;
class P{
  constructor(){this.reset()}
  reset(){
    this.x=Math.random()*W;this.y=Math.random()*H;
    this.vx=(Math.random()-.5)*2;this.vy=(Math.random()-.5)*2;
    this.r=Math.random()*2.5+.5;this.br=this.r;
    this.life=1;this.decay=0;this.h=Math.random()*360;
    this.s=80;this.l=60;this.a=Math.random()*.6+.2;this.ba=this.a;
    this.tl=[];this.tlen=5;this.on=true;this.ph=Math.random()*Math.PI*2;
  }
  update(dt){
    if(!this.on)return;
    this.tl.push({x:this.x,y:this.y});
    if(this.tl.length>this.tlen)this.tl.shift();
    this.x+=this.vx;this.y+=this.vy;
    if(this.x<-20)this.x=W+20;if(this.x>W+20)this.x=-20;
    if(this.y<-20)this.y=H+20;if(this.y>H+20)this.y=-20;
    if(this.decay>0){this.life-=this.decay;if(this.life<=0)this.on=false}
  }
  draw(c){
    if(!this.on)return;
    if(this.tl.length>1){
      c.beginPath();c.moveTo(this.tl[0].x,this.tl[0].y);
      for(let i=1;i<this.tl.length;i++)c.lineTo(this.tl[i].x,this.tl[i].y);
      c.strokeStyle=`hsla(${this.h},${this.s}%,${this.l}%,${this.a*.3*this.life})`;
      c.lineWidth=this.r*.5;c.stroke();
    }
    const g=c.createRadialGradient(this.x,this.y,0,this.x,this.y,this.r*3);
    g.addColorStop(0,`hsla(${this.h},${this.s}%,${this.l}%,${this.a*this.life})`);
    g.addColorStop(.5,`hsla(${this.h},${this.s}%,${this.l}%,${this.a*.3*this.life})`);
    g.addColorStop(1,`hsla(${this.h},${this.s}%,${this.l}%,0)`);
    c.beginPath();c.arc(this.x,this.y,this.r*3,0,Math.PI*2);c.fillStyle=g;c.fill();
    c.beginPath();c.arc(this.x,this.y,this.r*.5,0,Math.PI*2);
    c.fillStyle=`hsla(${this.h},100%,90%,${this.a*this.life})`;c.fill();
  }
}
for(let i=0;i<MAX;i++)arr.push(new P);

/* ── Gesture state ── */
let gs={type:G.NONE,hc:[],pp:[],pd:[],t:0};

/* ── Physics ── */
function physics(dt){
  gs.t+=dt;const col=GC[gs.type];
  for(let i=0;i<cnt;i++){
    const p=arr[i];if(!p.on)continue;
    p.h+=(col.h+(Math.random()-.5)*30-p.h)*.02;
    p.s+=(col.s-p.s)*.02;p.l+=(col.l-p.l)*.02;
    switch(gs.type){
      case G.OPEN:phOpen(p);break;case G.FIST:phFist(p);break;
      case G.PINCH:phPinch(p);break;case G.POINT:phPoint(p);break;
      case G.TWO:phTwo(p);break;default:phIdle(p);
    }
    p.vx+=(Math.random()-.5)*.1;p.vy+=(Math.random()-.5)*.1;
    p.vx*=.98;p.vy*=.98;
  }
}
function phIdle(p){
  p.vx+=Math.sin(gs.t*.5+p.ph)*.02;p.vy+=Math.cos(gs.t*.3+p.ph*1.3)*.02;
  p.r+=(p.br-p.r)*.05;p.a+=(p.ba-p.a)*.05;p.tlen=Math.max(3,p.tlen-1);
}
function phOpen(p){
  if(!gs.hc.length)return;const h=gs.hc[0],hx=h.x*W,hy=h.y*H;
  const dx=p.x-hx,dy=p.y-hy,d=Math.sqrt(dx*dx+dy*dy);
  if(d<300&&d>1){const f=(1-d/300)*3;p.vx+=dx/d*f;p.vy+=dy/d*f;
    p.r=p.br*(1+(1-d/300)*2);p.a=Math.min(1,p.ba*(1+(1-d/300)));
    const a=Math.atan2(dy,dx);p.vx+=Math.cos(a+Math.PI/2)*f*.3;p.vy+=Math.sin(a+Math.PI/2)*f*.3}
  p.tlen=10;
}
function phFist(p){
  if(!gs.hc.length)return;const h=gs.hc[0],hx=h.x*W,hy=h.y*H;
  const dx=hx-p.x,dy=hy-p.y,d=Math.sqrt(dx*dx+dy*dy);
  if(d<350&&d>20){const f=(1-d/350)*4;p.vx+=dx/d*f;p.vy+=dy/d*f;
    p.r=p.br*(.3+d/350*.7);const a=Math.atan2(dy,dx);
    p.vx+=Math.cos(a+Math.PI/2)*f*.15;p.vy+=Math.sin(a+Math.PI/2)*f*.15}
  else if(d<=20){const a=Math.atan2(p.y-hy,p.x-hx);
    p.vx=Math.cos(a+1.5)*2;p.vy=Math.sin(a+1.5)*2;
    p.r=p.br*.3;p.a=Math.min(1,p.ba*2)}
  p.tlen=4;
}
function phPinch(p){
  if(!gs.pp.length)return;const pt=gs.pp[0],px=pt.x*W,py=pt.y*H;
  const dx=px-p.x,dy=py-p.y,d=Math.sqrt(dx*dx+dy*dy);
  if(d<250&&d>5){const f=(1-d/250)*5,a=Math.atan2(dy,dx);
    p.vx+=Math.cos(a+Math.PI/2)*f*.8;p.vy+=Math.sin(a+Math.PI/2)*f*.8;
    p.vx+=dx/d*f*.3;p.vy+=dy/d*f*.3;
    p.r=p.br*(1+Math.sin(gs.t*5+p.ph)*.5);p.a=Math.min(1,p.ba*(1+(1-d/250)))}
  p.tlen=15;
}
function phPoint(p){
  if(!gs.hc.length||!gs.pd.length)return;
  const h=gs.hc[0],dir=gs.pd[0],hx=h.x*W,hy=h.y*H;
  const dx=p.x-hx,dy=p.y-hy,d=Math.sqrt(dx*dx+dy*dy);
  if(d<400&&d>10){const dl=Math.sqrt(dir.x*dir.x+dir.y*dir.y);
    if(dl>0){const nx=dir.x/dl,ny=dir.y/dl,cr=dx*ny-dy*nx;
      if(Math.abs(cr)<80&&(dx*nx+dy*ny)>0){
        p.vx+=nx*2;p.vy+=ny*2;p.vx-=cr*ny*.05;p.vy+=cr*nx*.05;
        p.r=p.br*(1+(1-Math.abs(cr)/80));p.a=Math.min(1,p.ba*1.5)}}}
  p.tlen=8;
}
function phTwo(p){
  if(gs.hc.length<2){
    if(gs.hc.length===1){const h=gs.hc[0],dx=h.x*W-p.x,dy=h.y*H-p.y,d=Math.sqrt(dx*dx+dy*dy);
      if(d<300&&d>1){const f=(1-d/300)*3;p.vx+=dx/d*f;p.vy+=dy/d*f}}return}
  const[h1,h2]=gs.hc;
  for(const hand of[h1,h2]){const dx=hand.x*W-p.x,dy=hand.y*H-p.y,d=Math.sqrt(dx*dx+dy*dy);
    if(d<300&&d>1){const f=(1-d/300)*2.5;p.vx+=dx/d*f;p.vy+=dy/d*f}}
  const mx=(h1.x+h2.x)/2*W,my=(h1.y+h2.y)/2*H,dx=mx-p.x,dy=my-p.y,d=Math.sqrt(dx*dx+dy*dy);
  if(d<100){p.vx-=dx/d*1.5;p.vy-=dy/d*1.5}
  p.r=p.br*(1+Math.sin(gs.t*3+p.ph)*.3);p.tlen=12;
}

/* ── Background stars ── */
let bgStars=[];
for(let i=0;i<200;i++)bgStars.push({x:Math.random()*W,y:Math.random()*H,
  r:Math.random()*1.5+.3,a:Math.random()*.5+.1,tw:Math.random()*Math.PI*2});

function drawBg(dt){
  bx.fillStyle='rgba(0,0,0,.15)';bx.fillRect(0,0,W,H);
  for(const s of bgStars){s.tw+=dt*2;const a=s.a*(.5+.5*Math.sin(s.tw));
    bx.beginPath();bx.arc(s.x,s.y,s.r,0,Math.PI*2);bx.fillStyle=`rgba(255,255,255,${a})`;bx.fill()}
  if(gs.hc.length>0){const h=gs.hc[0],col=GC[gs.type];
    const g=bx.createRadialGradient(h.x*W,h.y*H,0,h.x*W,h.y*H,300);
    g.addColorStop(0,`hsla(${col.h},${col.s}%,${col.l}%,.05)`);g.addColorStop(1,'transparent');
    bx.fillStyle=g;bx.fillRect(0,0,W,H)}
}

/* ── Connections ── */
function drawConn(){
  const md=80,mc2=300;let n=0;
  for(let i=0;i<cnt&&n<mc2;i++){const a=arr[i];if(!a.on)continue;
    for(let j=i+1;j<cnt&&n<mc2;j++){const b=arr[j];if(!b.on)continue;
      const dx=a.x-b.x,dy=a.y-b.y,d=Math.sqrt(dx*dx+dy*dy);
      if(d<md){const al=(1-d/md)*.15*a.life*b.life;
        mx.beginPath();mx.moveTo(a.x,a.y);mx.lineTo(b.x,b.y);
        mx.strokeStyle=`hsla(${(a.h+b.h)/2},60%,60%,${al})`;mx.lineWidth=.5;mx.stroke();n++}}}
}

/* ── Hand overlay ── */
const HC=[[0,1],[1,2],[2,3],[3,4],[0,5],[5,6],[6,7],[7,8],[5,9],[9,10],[10,11],[11,12],
  [9,13],[13,14],[14,15],[15,16],[13,17],[0,17],[17,18],[18,19],[19,20]];
function drawHand(lms){
  ox.clearRect(0,0,W,H);if(!lms)return;
  const col=GC[gs.type];
  for(const lm of lms){
    ox.strokeStyle=`hsla(${col.h},${col.s}%,${col.l}%,.3)`;ox.lineWidth=1;
    for(const[s,e]of HC){ox.beginPath();ox.moveTo(lm[s].x*W,lm[s].y*H);
      ox.lineTo(lm[e].x*W,lm[e].y*H);ox.stroke()}
    for(const p of lm){const x=p.x*W,y=p.y*H;
      const g=ox.createRadialGradient(x,y,0,x,y,8);
      g.addColorStop(0,`hsla(${col.h},${col.s}%,${col.l}%,.8)`);g.addColorStop(1,'transparent');
      ox.beginPath();ox.arc(x,y,8,0,Math.PI*2);ox.fillStyle=g;ox.fill();
      ox.beginPath();ox.arc(x,y,2,0,Math.PI*2);ox.fillStyle=`hsla(${col.h},100%,90%,.9)`;ox.fill()}}
}

/* ── Main loop ── */
let lt=0,fc=0,ft=0,fps=0;
function loop(ts){
  const dt=Math.min((ts-lt)/1000,.05);lt=ts;fc++;ft+=dt;
  if(ft>=1){fps=fc;fc=0;ft=0}
  mx.fillStyle='rgba(0,0,0,.08)';mx.fillRect(0,0,W,H);
  drawBg(dt);physics(dt);
  for(let i=0;i<cnt;i++){arr[i].update(dt);arr[i].draw(mx)}
  drawConn();
  info.innerHTML=`FPS: ${fps}<br>粒子: ${cnt}<br>手势: ${GN[gs.type]}`;
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

/* ── Camera & MediaPipe ── */
let camOn=false,handsObj=null,camObj=null;

async function startCam(){
  if(typeof window.Hands==='undefined'){
    throw new Error('MediaPipe 库加载失败。请检查网络连接后刷新页面重试。');
  }
  ltxt.textContent='正在请求摄像头权限...';loader.style.display='flex';

  let stream;
  try{
    stream=await navigator.mediaDevices.getUserMedia({video:{width:640,height:480,facingMode:'user'}});
  }catch(e){
    loader.style.display='none';
    if(e.name==='NotAllowedError')throw new Error('摄像头权限被拒绝。请点击地址栏🔒图标→允许摄像头访问→刷新重试。');
    if(e.name==='NotFoundError')throw new Error('未检测到摄像头。请确认设备有可用摄像头。');
    throw new Error('摄像头错误: '+e.message);
  }

  video.srcObject=stream;camBox.style.display='block';
  await new Promise(r=>{video.onloadedmetadata=()=>{video.play();r()}});

  ltxt.textContent='正在加载手势识别模型...';

  handsObj=new window.Hands({locateFile:f=>`https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1675469240/${f}`});
  handsObj.setOptions({maxNumHands:2,modelComplexity:1,minDetectionConfidence:.7,minTrackingConfidence:.5});
  handsObj.onResults(res=>{
    drawHand(res.multiHandLandmarks);
    if(res.multiHandLandmarks&&res.multiHandLandmarks.length>0){
      const h=res.multiHandLandmarks;
      gs.hc=h.map(center);gs.pp=h.map(pinch);gs.pd=h.map(pdir);
      gs.type=h.length>=2?G.TWO:gesture(h[0]);
    }else{gs.type=G.NONE;gs.hc=[];gs.pp=[];gs.pd=[]}
    label.textContent=GN[gs.type];label.classList.toggle('show',gs.type!==G.NONE);
  });

  camObj=new window.Camera(video,{
    onFrame:async()=>{if(handsObj)await handsObj.send({image:video})},
    width:640,height:480
  });
  await camObj.start();
  loader.style.display='none';camOn=true;
}

/* ── Mouse/Touch fallback ── */
let mx2=W/2,my2=H/2,mDown=false,lx=mx2,ly=my2;
mc.style.pointerEvents='auto';mc.style.zIndex='3';

mc.addEventListener('mousemove',e=>{
  lx=mx2;ly=my2;mx2=e.clientX;my2=e.clientY;if(camOn)return;
  gs.hc=[{x:mx2/W,y:my2/H}];gs.pp=[{x:mx2/W,y:my2/H}];
  const dx=mx2-lx,dy=my2-ly,sp=Math.sqrt(dx*dx+dy*dy);
  gs.type=mDown?G.FIST:sp>10?G.OPEN:G.POINT;
  if(gs.type===G.POINT)gs.pd=[{x:dx*.01,y:dy*.01}];
  label.textContent=GN[gs.type]+' (鼠标)';label.classList.add('show');
});
mc.addEventListener('mousedown',()=>{mDown=true;if(!camOn)gs.type=G.FIST});
mc.addEventListener('mouseup',()=>{mDown=false;if(!camOn)gs.type=G.OPEN});
mc.addEventListener('mouseleave',()=>{if(!camOn){gs.type=G.NONE;gs.hc=[];label.classList.remove('show')}});
mc.addEventListener('touchmove',e=>{e.preventDefault();
  const t=e.touches[0];lx=mx2;ly=my2;mx2=t.clientX;my2=t.clientY;if(camOn)return;
  gs.hc=[{x:mx2/W,y:my2/H}];gs.pp=[{x:mx2/W,y:my2/H}];gs.type=G.PINCH;
  label.textContent=GN[G.PINCH]+' (触摸)';label.classList.add('show')},{passive:false});
mc.addEventListener('touchend',()=>{if(!camOn){gs.type=G.NONE;gs.hc=[];label.classList.remove('show')}});

/* ── Button ── */
btn.addEventListener('click',async()=>{
  btn.disabled=true;btn.textContent='启动中...';msg.textContent='';
  try{await startCam();btn.style.display='none';msg.textContent=''}
  catch(e){console.error(e);msg.textContent=e.message;btn.textContent='重试启动';btn.disabled=false}
});

/* ── Keyboard ── */
const km={'0':G.NONE,'1':G.OPEN,'2':G.FIST,'3':G.PINCH,'4':G.POINT,'5':G.TWO};
addEventListener('keydown',e=>{
  if(km[e.key]!==undefined){gs.type=km[e.key];
    label.textContent=GN[gs.type]+' (键盘)';label.classList.toggle('show',gs.type!==G.NONE)}
  if(e.key==='+'||e.key==='=')cnt=Math.min(MAX,cnt+100);
  if(e.key==='-')cnt=Math.max(100,cnt-100);
});

})();
