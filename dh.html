<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KDX 手势粒子特效</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;background:#000;overflow:hidden}
body{font-family:sans-serif;color:#fff;user-select:none}
#c1{position:fixed;top:0;left:0;width:100%;height:100%;z-index:1}
#camBox{position:fixed;bottom:16px;right:16px;width:200px;height:150px;
border-radius:12px;overflow:hidden;border:1px solid rgba(255,255,255,.1);
z-index:20;background:#000;box-shadow:0 4px 20px rgba(0,0,0,.5);display:none}
#camBox video{width:100%;height:100%;object-fit:cover;transform:scaleX(-1)}
#status{position:fixed;top:20px;left:50%;transform:translateX(-50%);
z-index:30;font-size:13px;color:rgba(255,255,255,.6);text-align:center;
pointer-events:none;letter-spacing:2px}
#gestureName{position:fixed;top:50px;left:50%;transform:translateX(-50%);
z-index:30;font-size:22px;font-weight:200;color:rgba(255,255,255,.8);
text-align:center;pointer-events:none;letter-spacing:6px;
text-shadow:0 0 20px rgba(255,255,255,.3);opacity:0;transition:opacity .3s}
#gestureName.show{opacity:1}
#hint{position:fixed;bottom:20px;left:20px;z-index:30;font-size:11px;
color:rgba(255,255,255,.25);line-height:2;pointer-events:none}
</style>
</head>
<body>
<canvas id="c1"></canvas>
<div id="camBox"><video id="vid" autoplay playsinline muted></video></div>
<div id="status">初始化中...</div>
<div id="gestureName"></div>
<div id="hint">
✋ 张开手 — 粒子扩散 &nbsp; ✊ 握拳 — 粒子收缩 &nbsp; 🤏 捏合 — 漩涡<br>
☝️ 指向 — 粒子追踪 &nbsp; 键盘 1-5 切换手势 &nbsp; +/- 调节粒子数
</div>

<script>
(function(){
'use strict';

// ============ DOM ============
var c1 = document.getElementById('c1');
var ctx = c1.getContext('2d');
var vid = document.getElementById('vid');
var camBox = document.getElementById('camBox');
var statusEl = document.getElementById('status');
var gestureEl = document.getElementById('gestureName');

var W = window.innerWidth;
var H = window.innerHeight;
c1.width = W;
c1.height = H;

window.addEventListener('resize', function(){
  W = window.innerWidth;
  H = window.innerHeight;
  c1.width = W;
  c1.height = H;
});

statusEl.textContent = '粒子引擎启动中...';

// ============ PARTICLES ============
var MAX = 2000;
var particleCount = 800;
var particles = [];

function Particle(){
  this.x = Math.random() * W;
  this.y = Math.random() * H;
  this.vx = (Math.random() - 0.5) * 1.5;
  this.vy = (Math.random() - 0.5) * 1.5;
  this.radius = Math.random() * 3 + 1;
  this.baseRadius = this.radius;
  this.hue = Math.random() * 360;
  this.alpha = Math.random() * 0.6 + 0.3;
  this.baseAlpha = this.alpha;
  this.phase = Math.random() * Math.PI * 2;
  this.life = 1;
  this.trail = [];
  this.trailLen = 5;
}

for(var i = 0; i < MAX; i++){
  particles.push(new Particle());
}

// ============ GESTURE STATE ============
var gesture = 'none'; // none, open, fist, pinch, point, two
var handX = 0.5, handY = 0.5;
var handX2 = 0.5, handY2 = 0.5;
var hasHand = false;
var handDirX = 0, handDirY = 0;
var prevHX = 0.5, prevHY = 0.5;

var gestureNames = {
  none: '', open: '张开 · 扩散', fist: '握拳 · 收缩',
  pinch: '捏合 · 漩涡', point: '指向 · 追踪', two: '双手 · 引力场'
};
var gestureColors = {
  none: {h:210, s:40}, open: {h:38, s:100}, fist: {h:345, s:100},
  pinch: {h:265, s:95}, point: {h:165, s:90}, two: {h:195, s:100}
};

function setGesture(g){
  if(g !== gesture){
    gesture = g;
    var name = gestureNames[g] || '';
    gestureEl.textContent = name;
    if(name){ gestureEl.classList.add('show'); }
    else { gestureEl.classList.remove('show'); }
  }
}

// ============ CAMERA + HAND DETECTION ============
var camReady = false;
var procCvs = document.createElement('canvas');
procCvs.width = 120; procCvs.height = 90;
var procCtx = procCvs.getContext('2d', {willReadFrequently: true});

function startCamera(){
  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
    statusEl.textContent = '浏览器不支持摄像头 · 请用鼠标体验';
    return;
  }
  statusEl.textContent = '请求摄像头权限...';
  navigator.mediaDevices.getUserMedia({video:{width:640,height:480,facingMode:'user'}})
    .then(function(stream){
      vid.srcObject = stream;
      camBox.style.display = 'block';
      return vid.play();
    })
    .then(function(){
      camReady = true;
      statusEl.textContent = '摄像头就绪 · 请伸出手掌';
      setTimeout(function(){ statusEl.style.opacity = '0.3'; }, 3000);
    })
    .catch(function(err){
      if(err.name === 'NotAllowedError'){
        statusEl.textContent = '摄像头权限被拒绝 · 用鼠标或键盘1-5体验';
      } else if(err.name === 'NotFoundError'){
        statusEl.textContent = '未检测到摄像头 · 用鼠标或键盘1-5体验';
      } else {
        statusEl.textContent = '摄像头错误: ' + err.message;
      }
    });
}

// Skin color detection + blob analysis
function detectHand(){
  if(!camReady || vid.readyState < 2) return;

  procCtx.drawImage(vid, 0, 0, 120, 90);
  var img = procCtx.getImageData(0, 0, 120, 90);
  var d = img.data;
  var PW = 120, PH = 90;

  // Skin detection in YCbCr
  var skin = [];
  for(var i = 0; i < PW * PH; i++) skin[i] = 0;

  for(var i = 0; i < d.length; i += 4){
    var r = d[i], g = d[i+1], b = d[i+2];
    var cb = 128 - 0.169*r - 0.331*g + 0.5*b;
    var cr = 128 + 0.5*r - 0.419*g - 0.081*b;
    if(cr > 135 && cr < 175 && cb > 85 && cb < 135){
      skin[i/4] = 1;
    }
  }

  // Find blobs via flood fill
  var visited = [];
  for(var i = 0; i < PW * PH; i++) visited[i] = 0;
  var blobs = [];

  for(var y = 1; y < PH - 1; y++){
    for(var x = 1; x < PW - 1; x++){
      var idx = y * PW + x;
      if(!skin[idx] || visited[idx]) continue;

      var sumX = 0, sumY = 0, count = 0;
      var queue = [idx];
      visited[idx] = 1;

      while(queue.length > 0 && count < 600){
        var ci = queue.shift();
        var cx = ci % PW;
        var cy = (ci - cx) / PW;
        sumX += cx; sumY += cy; count++;

        var neighbors = [[cx-1,cy],[cx+1,cy],[cx,cy-1],[cx,cy+1]];
        for(var n = 0; n < 4; n++){
          var nx = neighbors[n][0], ny = neighbors[n][1];
          if(nx >= 0 && nx < PW && ny >= 0 && ny < PH){
            var ni = ny * PW + nx;
            if(skin[ni] && !visited[ni]){
              visited[ni] = 1;
              queue.push(ni);
            }
          }
        }
      }

      if(count > 80){
        blobs.push({
          x: 1 - sumX / count / PW, // mirror
          y: sumY / count / PH,
          count: count
        });
      }
    }
  }

  blobs.sort(function(a,b){ return b.count - a.count; });

  if(blobs.length >= 2 && blobs[1].count > 60){
    handX = blobs[0].x; handY = blobs[0].y;
    handX2 = blobs[1].x; handY2 = blobs[1].y;
    hasHand = true;
    setGesture('two');
  } else if(blobs.length >= 1 && blobs[0].count > 100){
    prevHX = handX; prevHY = handY;
    handX = blobs[0].x; handY = blobs[0].y;
    handDirX = handX - prevHX;
    handDirY = handY - prevHY;
    hasHand = true;

    var speed = Math.sqrt(handDirX*handDirX + handDirY*handDirY);
    var size = blobs[0].count;

    if(speed > 0.025){
      setGesture('open');
    } else if(size > 300){
      setGesture('fist');
    } else if(size > 150){
      setGesture('pinch');
    } else {
      setGesture('point');
    }
  } else {
    hasHand = false;
    setGesture('none');
  }
}

// ============ PHYSICS ============
var time = 0;

function applyPhysics(dt){
  time += dt;
  var col = gestureColors[gesture] || gestureColors.none;

  for(var i = 0; i < particleCount; i++){
    var p = particles[i];

    // Smooth color transition
    p.hue += (col.h + Math.sin(time * 2 + p.phase) * 12 - p.hue) * 0.03;

    var hx = handX * W, hy = handY * H;
    var dx, dy, dist, force, angle;

    switch(gesture){
      case 'open':
        dx = p.x - hx; dy = p.y - hy;
        dist = Math.sqrt(dx*dx + dy*dy);
        if(dist < 300 && dist > 1){
          force = (1 - dist/300) * (1 - dist/300) * 3;
          p.vx += (dx/dist) * force;
          p.vy += (dy/dist) * force;
          p.radius = p.baseRadius * (1 + (1 - dist/300) * 2);
          angle = Math.atan2(dy, dx);
          p.vx += Math.cos(angle + 1.57) * force * 0.3;
          p.vy += Math.sin(angle + 1.57) * force * 0.3;
        }
        p.trailLen = 10;
        break;

      case 'fist':
        dx = hx - p.x; dy = hy - p.y;
        dist = Math.sqrt(dx*dx + dy*dy);
        if(dist < 350 && dist > 20){
          force = (1 - dist/350) * (1 - dist/350) * 4;
          p.vx += (dx/dist) * force;
          p.vy += (dy/dist) * force;
          p.radius = p.baseRadius * (0.3 + dist/350 * 0.7);
          angle = Math.atan2(dy, dx);
          p.vx += Math.cos(angle + 1.57) * force * 0.15;
          p.vy += Math.sin(angle + 1.57) * force * 0.15;
        } else if(dist <= 20){
          angle = Math.atan2(p.y - hy, p.x - hx);
          p.vx = Math.cos(angle + 1.8) * 1.8;
          p.vy = Math.sin(angle + 1.8) * 1.8;
          p.radius = p.baseRadius * 0.2;
        }
        p.trailLen = 3;
        break;

      case 'pinch':
        dx = hx - p.x; dy = hy - p.y;
        dist = Math.sqrt(dx*dx + dy*dy);
        if(dist < 250 && dist > 3){
          force = (1 - dist/250) * (1 - dist/250) * 5;
          angle = Math.atan2(dy, dx);
          p.vx += Math.cos(angle + 1.57) * force * 0.8;
          p.vy += Math.sin(angle + 1.57) * force * 0.8;
          p.vx += (dx/dist) * force * 0.3;
          p.vy += (dy/dist) * force * 0.3;
          p.radius = p.baseRadius * (1 + Math.sin(time * 5 + p.phase) * 0.5);
        }
        p.trailLen = 15;
        break;

      case 'point':
        dx = p.x - hx; dy = p.y - hy;
        dist = Math.sqrt(dx*dx + dy*dy);
        if(dist < 350 && dist > 8){
          var dl = Math.sqrt(handDirX*handDirX + handDirY*handDirY);
          if(dl > 0.001){
            var nx = handDirX/dl, ny = handDirY/dl;
            p.vx += nx * 2; p.vy += ny * 2;
            p.radius = p.baseRadius * 1.3;
          }
        }
        p.trailLen = 8;
        break;

      case 'two':
        var hx2 = handX2 * W, hy2 = handY2 * H;
        for(var h = 0; h < 2; h++){
          var hhx = h === 0 ? hx : hx2;
          var hhy = h === 0 ? hy : hy2;
          dx = hhx - p.x; dy = hhy - p.y;
          dist = Math.sqrt(dx*dx + dy*dy);
          if(dist < 300 && dist > 1){
            force = (1 - dist/300) * (1 - dist/300) * 2.5;
            p.vx += (dx/dist) * force;
            p.vy += (dy/dist) * force;
          }
        }
        p.trailLen = 12;
        break;

      default: // idle
        p.vx += Math.sin(time * 0.4 + p.phase) * 0.012;
        p.vy += Math.cos(time * 0.35 + p.phase * 1.3) * 0.012;
        p.radius += (p.baseRadius - p.radius) * 0.04;
        p.trailLen = Math.max(3, p.trailLen - 1);
        break;
    }

    // Noise
    p.vx += Math.sin(time * 1.1 + p.phase * 2) * 0.01;
    p.vy += Math.cos(time * 0.9 + p.phase) * 0.01;
    // Damping
    p.vx *= 0.985;
    p.vy *= 0.985;

    // Move
    p.trail.push({x: p.x, y: p.y});
    if(p.trail.length > p.trailLen) p.trail.shift();
    p.x += p.vx;
    p.y += p.vy;

    // Wrap
    if(p.x < -20) p.x = W + 20;
    if(p.x > W + 20) p.x = -20;
    if(p.y < -20) p.y = H + 20;
    if(p.y > H + 20) p.y = -20;
  }
}

// ============ RENDER ============
var stars = [];
for(var i = 0; i < 150; i++){
  stars.push({
    x: Math.random() * W, y: Math.random() * H,
    r: Math.random() * 1 + 0.3,
    a: Math.random() * 0.3 + 0.05,
    tw: Math.random() * 6.28
  });
}

var lastTime = 0;
var frameCount = 0;
var fpsTime = 0;
var currentFps = 0;
var detTime = 0;

function loop(timestamp){
  var dt = Math.min((timestamp - lastTime) / 1000, 0.05);
  lastTime = timestamp;
  frameCount++;
  fpsTime += dt;
  if(fpsTime >= 1){ currentFps = frameCount; frameCount = 0; fpsTime = 0; }
  detTime += dt;

  // Hand detection at ~15fps
  if(detTime > 0.066){ detectHand(); detTime = 0; }

  // Clear with fade
  ctx.fillStyle = 'rgba(0, 0, 0, 0.08)';
  ctx.fillRect(0, 0, W, H);

  // Stars
  for(var i = 0; i < stars.length; i++){
    var s = stars[i];
    s.tw += dt * 0.5;
    var sa = s.a * (0.4 + 0.6 * Math.sin(s.tw));
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.r, 0, 6.28);
    ctx.fillStyle = 'rgba(255,255,255,' + sa + ')';
    ctx.fill();
  }

  // Physics
  applyPhysics(dt);

  // Draw particles
  var col = gestureColors[gesture] || gestureColors.none;
  for(var i = 0; i < particleCount; i++){
    var p = particles[i];
    var al = p.alpha;

    // Trail
    if(p.trail.length > 1){
      ctx.beginPath();
      ctx.moveTo(p.trail[0].x, p.trail[0].y);
      for(var j = 1; j < p.trail.length; j++){
        ctx.lineTo(p.trail[j].x, p.trail[j].y);
      }
      ctx.strokeStyle = 'hsla(' + Math.floor(p.hue) + ',' + col.s + '%,55%,' + (al * 0.25) + ')';
      ctx.lineWidth = p.radius * 0.5;
      ctx.lineCap = 'round';
      ctx.stroke();
    }

    // Glow
    var grad = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.radius * 4);
    grad.addColorStop(0, 'hsla(' + Math.floor(p.hue) + ',' + col.s + '%,70%,' + al + ')');
    grad.addColorStop(0.3, 'hsla(' + Math.floor(p.hue) + ',' + col.s + '%,55%,' + (al * 0.35) + ')');
    grad.addColorStop(1, 'hsla(' + Math.floor(p.hue) + ',' + col.s + '%,50%,0)');
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.radius * 4, 0, 6.28);
    ctx.fillStyle = grad;
    ctx.fill();

    // Core
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.radius * 0.4, 0, 6.28);
    ctx.fillStyle = 'hsla(' + Math.floor(p.hue) + ',100%,93%,' + (al * 0.85) + ')';
    ctx.fill();
  }

  // Bloom pass
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  ctx.filter = 'blur(15px) brightness(0.6)';
  ctx.globalAlpha = 0.2;
  ctx.drawImage(c1, 0, 0, W, H);
  ctx.filter = 'none';
  ctx.globalAlpha = 1;
  ctx.globalCompositeOperation = 'source-over';
  ctx.restore();

  // FPS
  ctx.fillStyle = 'rgba(255,255,255,0.2)';
  ctx.font = '11px sans-serif';
  ctx.fillText('FPS ' + currentFps + ' · ' + particleCount + ' 粒子', 20, 25);

  requestAnimationFrame(loop);
}

requestAnimationFrame(loop);
statusEl.textContent = '粒子已启动 · 正在请求摄像头...';

// Start camera
startCamera();

// ============ MOUSE/TOUCH FALLBACK ============
var mouseDown = false;
var lastMX = W/2, lastMY = H/2;

c1.style.cursor = 'crosshair';

c1.addEventListener('mousemove', function(e){
  if(camReady && hasHand) return;
  lastMX = handX * W; lastMY = handY * H;
  handX = e.clientX / W;
  handY = e.clientY / H;
  handDirX = handX - lastMX / W;
  handDirY = handY - lastMY / H;
  hasHand = true;

  var speed = Math.sqrt(handDirX*handDirX + handDirY*handDirY);
  if(mouseDown) setGesture('fist');
  else if(speed > 0.01) setGesture('open');
  else setGesture('point');
});

c1.addEventListener('mousedown', function(){ mouseDown = true; if(!camReady||!hasHand) setGesture('fist'); });
c1.addEventListener('mouseup', function(){ mouseDown = false; if(!camReady||!hasHand) setGesture('open'); });
c1.addEventListener('mouseleave', function(){ if(!camReady){ hasHand = false; setGesture('none'); }});

c1.addEventListener('touchmove', function(e){
  e.preventDefault();
  if(camReady && hasHand) return;
  var t = e.touches[0];
  handX = t.clientX / W;
  handY = t.clientY / H;
  hasHand = true;
  setGesture('pinch');
}, {passive: false});

c1.addEventListener('touchend', function(){
  if(!camReady){ hasHand = false; setGesture('none'); }
});

// Keyboard
var keyMap = {'0':'none','1':'open','2':'fist','3':'pinch','4':'point','5':'two'};
document.addEventListener('keydown', function(e){
  if(keyMap[e.key]){
    hasHand = true;
    setGesture(keyMap[e.key]);
  }
  if(e.key === '+' || e.key === '=') particleCount = Math.min(MAX, particleCount + 100);
  if(e.key === '-') particleCount = Math.max(200, particleCount - 100);
});

})();
</script>
</body>
</html>
