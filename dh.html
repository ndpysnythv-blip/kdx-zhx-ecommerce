<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KDX · 宇宙粒子</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;background:#000;overflow:hidden}
body{font-family:'SF Pro Display','Helvetica Neue',sans-serif;color:#fff;user-select:none}
canvas{display:block;position:fixed;top:0;left:0}
#c{z-index:1}
#cam{position:fixed;bottom:16px;right:16px;width:160px;height:120px;border-radius:10px;
overflow:hidden;z-index:20;background:#000;display:none;
border:1px solid rgba(255,255,255,.06);opacity:.7}
#cam video{width:100%;height:100%;object-fit:cover;transform:scaleX(-1)}
#lbl{position:fixed;top:40px;left:50%;transform:translateX(-50%);font-size:13px;
font-weight:300;letter-spacing:10px;z-index:10;
opacity:0;transition:opacity .6s cubic-bezier(.4,0,.2,1);pointer-events:none;
text-transform:uppercase;color:rgba(255,255,255,.5)}
#lbl.show{opacity:1}
#hint{position:fixed;bottom:20px;left:20px;z-index:10;font-size:10px;
color:rgba(255,255,255,.12);line-height:2;pointer-events:none;letter-spacing:1px}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="cam"><video id="v" autoplay playsinline muted></video></div>
<div id="lbl"></div>
<div id="hint">
张开 · 扩散 &nbsp;&nbsp; 握拳 · 收缩 &nbsp;&nbsp; 捏合 · 漩涡 &nbsp;&nbsp; 指向 · 追踪 &nbsp;&nbsp; 1-5 键盘切换
</div>

<script>
(function(){
'use strict';

var c=document.getElementById('c'),x=c.getContext('2d');
var vid=document.getElementById('v'),camBox=document.getElementById('cam');
var lbl=document.getElementById('lbl');
var W,H;

function resize(){W=innerWidth;H=innerHeight;c.width=W;c.height=H}
resize();addEventListener('resize',resize);

/* ═══════════ COLOR PALETTE ═══════════ */
var PAL={
  none: {h:220,s:25,l:18},
  open: {h:38,s:55,l:28},
  fist: {h:340,s:45,l:22},
  pinch:{h:265,s:50,l:25},
  point:{h:175,s:40,l:22},
  two:  {h:210,s:50,l:25}
};

var NAMES={none:'',open:'expansion',fist:'contraction',pinch:'vortex',point:'tracking',two:'gravity'};

/* ═══════════ STATE ═══════════ */
var gest='none',hx=.5,hy=.5,hx2=.5,hy2=.5,hasH=false,hdx=0,hdy=0,phx=.5,phy=.5;
var time=0;

function setG(g){if(g!==gest){gest=g;lbl.textContent=NAMES[g]||'';lbl.classList.toggle('show',!!NAMES[g])}}

/* ═══════════ PARTICLES ═══════════ */
var N=1500,cnt=800,P=[];

function Pt(){
  this.x=Math.random()*W;this.y=Math.random()*H;
  this.vx=(Math.random()-.5)*.3;this.vy=(Math.random()-.5)*.3;
  this.r=Math.random()*.8+.3;this.br=this.r;
  this.h=Math.random()*360;this.s=30;this.l=15;
  this.a=Math.random()*.25+.08;this.ba=this.a;
  this.tl=[];this.tlN=3;
  this.ph=Math.random()*6.28;this.ph2=Math.random()*6.28;
}
for(var i=0;i<N;i++)P.push(new Pt());

/* ═══════════ PHYSICS ═══════════ */
function phys(dt){
  time+=dt;
  var col=PAL[gest],ch=col.h,cs=col.s,cl=col.l;

  for(var i=0;i<cnt;i++){
    var p=P[i];
    // Slow hue drift
    p.h+=(ch+Math.sin(time*.8+p.ph)*20-p.h)*.015;
    p.s+=(cs-p.s)*.015;p.l+=(cl-p.l)*.015;

    var dx,dy,d,f,a;
    switch(gest){
      case 'open':
        dx=p.x-hx*W;dy=p.y-hy*H;d=Math.hypot(dx,dy);
        if(d<280&&d>1){f=(1-d/280)*(1-d/280)*2;p.vx+=dx/d*f;p.vy+=dy/d*f;
          p.r=p.br*(1+(1-d/280)*1.5);p.a=Math.min(.6,p.ba*(1+(1-d/280)));
          a=Math.atan2(dy,dx);p.vx+=Math.cos(a+1.57)*f*.25;p.vy+=Math.sin(a+1.57)*f*.25}
        p.tlN=8;break;

      case 'fist':
        dx=hx*W-p.x;dy=hy*H-p.y;d=Math.hypot(dx,dy);
        if(d<320&&d>18){f=(1-d/320)*(1-d/320)*3.5;p.vx+=dx/d*f;p.vy+=dy/d*f;
          p.r=p.br*(.3+d/320*.7);a=Math.atan2(dy,dx);
          p.vx+=Math.cos(a+1.57)*f*.12;p.vy+=Math.sin(a+1.57)*f*.12}
        else if(d<=18){a=Math.atan2(p.y-hy*H,p.x-hx*W);
          p.vx=Math.cos(a+1.8)*1.2;p.vy=Math.sin(a+1.8)*1.2;p.r=p.br*.25}
        p.tlN=2;break;

      case 'pinch':
        dx=hx*W-p.x;dy=hy*H-p.y;d=Math.hypot(dx,dy);
        if(d<220&&d>2){f=(1-d/220)*(1-d/220)*4;a=Math.atan2(dy,dx);
          p.vx+=Math.cos(a+1.57)*f*.7;p.vy+=Math.sin(a+1.57)*f*.7;
          p.vx+=dx/d*f*.25;p.vy+=dy/d*f*.25;
          p.r=p.br*(1+Math.sin(time*5+p.ph)*.4)}
        p.tlN=12;break;

      case 'point':
        dx=p.x-hx*W;dy=p.y-hy*H;d=Math.hypot(dx,dy);
        if(d<320&&d>6){var dl=Math.hypot(hdx,hdy);
          if(dl>.0005){var nx=hdx/dl,ny=hdy/dl;
            p.vx+=nx*1.5;p.vy+=ny*1.5;p.r=p.br*1.2}}p.tlN=6;break;

      case 'two':
        for(var h=0;h<2;h++){var hhx=(h?hx2:hx)*W,hhy=(h?hy2:hy)*H;
          dx=hhx-p.x;dy=hhy-p.y;d=Math.hypot(dx,dy);
          if(d<280&&d>1){f=(1-d/280)*(1-d/280)*2;p.vx+=dx/d*f;p.vy+=dy/d*f}}
        p.tlN=10;break;

      default:
        p.vx+=Math.sin(time*.3+p.ph)*.008+Math.cos(time*.5+p.ph2)*.004;
        p.vy+=Math.cos(time*.25+p.ph*1.3)*.008+Math.sin(time*.4+p.ph2)*.004;
        p.r+=(p.br-p.r)*.03;p.a+=(p.ba-p.a)*.03;p.tlN=3;break;
    }

    p.vx+=Math.sin(time*.9+p.ph2)*.006;p.vy+=Math.cos(time*.7+p.ph)*.006;
    p.vx*=.988;p.vy*=.988;

    p.tl.push({x:p.x,y:p.y});if(p.tl.length>p.tlN)p.tl.shift();
    p.x+=p.vx;p.y+=p.vy;
    if(p.x<-20)p.x=W+20;if(p.x>W+20)p.x=-20;
    if(p.y<-20)p.y=H+20;if(p.y>H+20)p.y=-20;
  }
}

/* ═══════════ STARS ═══════════ */
var stars=[];
for(var i=0;i<120;i++)stars.push({x:Math.random()*W,y:Math.random()*H,
  r:Math.random()*.6+.15,a:Math.random()*.15+.03,tw:Math.random()*6.28});

/* ═══════════ NEBULA BACKGROUND ═══════════ */
var nebulaCvs=document.createElement('canvas');
var nebulaCtx=nebulaCvs.getContext('2d');
var nebReady=false;

function genNebula(){
  nebulaCvs.width=W;nebulaCvs.height=H;
  var nc=nebulaCtx;
  nc.fillStyle='#000';nc.fillRect(0,0,W,H);
  // Soft colored clouds
  var clouds=[
    {x:W*.3,y:H*.4,r:W*.4,h:220,s:20,l:4,a:.03},
    {x:W*.7,y:H*.6,r:W*.35,h:260,s:15,l:3,a:.025},
    {x:W*.5,y:H*.3,r:W*.3,h:200,s:12,l:3,a:.02}
  ];
  for(var i=0;i<clouds.length;i++){
    var cl=clouds[i];
    var g=nc.createRadialGradient(cl.x,cl.y,0,cl.x,cl.y,cl.r);
    g.addColorStop(0,'hsla('+cl.h+','+cl.s+'%,'+cl.l+'%,'+cl.a+')');
    g.addColorStop(.5,'hsla('+cl.h+','+cl.s+'%,'+(cl.l-1)+'%,'+(cl.a*.5)+')');
    g.addColorStop(1,'transparent');
    nc.fillStyle=g;nc.fillRect(0,0,W,H);
  }
  nebReady=true;
}
genNebula();
addEventListener('resize',function(){setTimeout(genNebula,100)});

/* ═══════════ RENDER ═══════════ */
var lt=0,fc=0,ft=0,fps=0,dt2=0;

function frame(ts){
  var dt=Math.min((ts-lt)/1000,.05);lt=ts;fc++;ft+=dt;dt2+=dt;
  if(ft>=1){fps=fc;fc=0;ft=0}
  if(dt2>.066){detectHand();dt2=0}

  // Fade
  x.fillStyle='rgba(0,0,0,.06)';x.fillRect(0,0,W,H);

  // Nebula (draw once, then just let it fade)
  if(nebReady){x.globalAlpha=.015;x.drawImage(nebulaCvs,0,0);x.globalAlpha=1}

  // Stars
  for(var i=0;i<stars.length;i++){var s=stars[i];s.tw+=dt*.4;
    var sa=s.a*(.3+.7*Math.sin(s.tw));
    x.beginPath();x.arc(s.x,s.y,s.r,0,6.28);
    x.fillStyle='rgba(255,255,255,'+sa+')';x.fill()}

  phys(dt);

  // Draw particles
  var col=PAL[gest];
  for(var i=0;i<cnt;i++){
    var p=P[i];var al=p.a;if(al<.005)continue;
    var h=Math.floor(p.h),s=Math.floor(p.s),l=Math.floor(p.l);

    // Trail
    if(p.tl.length>1){
      x.beginPath();x.moveTo(p.tl[0].x,p.tl[0].y);
      for(var j=1;j<p.tl.length;j++)x.lineTo(p.tl[j].x,p.tl[j].y);
      x.strokeStyle='hsla('+h+','+s+'%,'+l+'%,'+(al*.15)+')';
      x.lineWidth=p.r*.4;x.lineCap='round';x.stroke();
    }

    // Soft glow
    var g=x.createRadialGradient(p.x,p.y,0,p.x,p.y,p.r*3.5);
    g.addColorStop(0,'hsla('+h+','+s+'%,'+(l+8)+'%,'+al+')');
    g.addColorStop(.4,'hsla('+h+','+s+'%,'+l+'%,'+(al*.25)+')');
    g.addColorStop(1,'hsla('+h+','+s+'%,'+l+'%,0)');
    x.beginPath();x.arc(p.x,p.y,p.r*3.5,0,6.28);x.fillStyle=g;x.fill();

    // Tiny bright core
    x.beginPath();x.arc(p.x,p.y,p.r*.3,0,6.28);
    x.fillStyle='hsla('+h+',60%,'+Math.min(70,l+25)+'%,'+(al*.7)+')';x.fill();
  }

  // Subtle bloom
  x.save();x.globalCompositeOperation='lighter';
  x.filter='blur(18px) brightness(.4)';x.globalAlpha=.12;x.drawImage(c,0,0);
  x.filter='none';x.globalAlpha=1;x.globalCompositeOperation='source-over';x.restore();

  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

/* ═══════════ CAMERA ═══════════ */
var camOk=false;
var pc=document.createElement('canvas');pc.width=100;pc.height=75;
var px=pc.getContext('2d',{willReadFrequently:true});

function startCam(){
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia)return;
  navigator.mediaDevices.getUserMedia({video:{width:640,height:480,facingMode:'user'}})
    .then(function(s){vid.srcObject=s;camBox.style.display='block';return vid.play()})
    .then(function(){camOk=true})
    .catch(function(){});
}
startCam();

function detectHand(){
  if(!camOk||vid.readyState<2)return;
  px.drawImage(vid,0,0,100,75);
  var img=px.getImageData(0,0,100,75),d=img.data,PW=100,PH=75;
  var skin=[];for(var i=0;i<PW*PH;i++)skin[i]=0;
  for(var i=0;i<d.length;i+=4){
    var r=d[i],g=d[i+1],b=d[i+2];
    var cb=128-.169*r-.331*g+.5*b,cr=128+.5*r-.419*g-.081*b;
    if(cr>133&&cr<175&&cb>80&&cb<135)skin[i/4]=1;
  }
  var vis=[];for(var i=0;i<PW*PH;i++)vis[i]=0;
  var blobs=[];
  for(var y=1;y<PH-1;y++)for(var xx=1;xx<PW-1;xx++){
    var idx=y*PW+xx;if(!skin[idx]||vis[idx])continue;
    var sx=0,sy=0,n=0,q=[idx];vis[idx]=1;
    while(q.length&&n<500){var ci=q.shift(),cx=ci%PW,cy=(ci-cx)/PW;sx+=cx;sy+=cy;n++;
      var nb=[[cx-1,cy],[cx+1,cy],[cx,cy-1],[cx,cy+1]];
      for(var k=0;k<4;k++){var nx=nb[k][0],ny=nb[k][1];
        if(nx>=0&&nx<PW&&ny>=0&&ny<PH){var ni=ny*PW+nx;if(skin[ni]&&!vis[ni]){vis[ni]=1;q.push(ni)}}}}
    if(n>60)blobs.push({x:1-sx/n/PW,y:sy/n/PH,n:n});
  }
  blobs.sort(function(a,b){return b.n-a.n});
  if(blobs.length>=2&&blobs[1].n>50){
    hx=blobs[0].x;hy=blobs[0].y;hx2=blobs[1].x;hy2=blobs[1].y;hasH=true;setG('two');
  }else if(blobs.length>=1&&blobs[0].n>80){
    phx=hx;phy=hy;hx=blobs[0].x;hy=blobs[0].y;hdx=hx-phx;hdy=hy-phy;hasH=true;
    var sp=Math.hypot(hdx,hdy),sz=blobs[0].n;
    if(sp>.02)setG('open');else if(sz>250)setG('fist');else if(sz>120)setG('pinch');else setG('point');
  }else{hasH=false;setG('none')}
}

/* ═══════════ MOUSE/TOUCH ═══════════ */
var md=false,lmx=W/2,lmy=H/2;
c.style.cursor='crosshair';
c.addEventListener('mousemove',function(e){
  if(camOk&&hasH)return;lmx=hx*W;lmy=hy*H;hx=e.clientX/W;hy=e.clientY/H;
  hdx=hx-lmx/W;hdy=hy-lmy/H;hasH=true;
  var sp=Math.hypot(hdx,hdy);
  if(md)setG('fist');else if(sp>.008)setG('open');else setG('point');
});
c.addEventListener('mousedown',function(){md=true;if(!camOk||!hasH)setG('fist')});
c.addEventListener('mouseup',function(){md=false;if(!camOk||!hasH)setG('open')});
c.addEventListener('mouseleave',function(){if(!camOk){hasH=false;setG('none')}});
c.addEventListener('touchmove',function(e){e.preventDefault();
  if(camOk&&hasH)return;var t=e.touches[0];hx=t.clientX/W;hy=t.clientY/H;hasH=true;setG('pinch')},{passive:false});
c.addEventListener('touchend',function(){if(!camOk){hasH=false;setG('none')}});
var km={'0':'none','1':'open','2':'fist','3':'pinch','4':'point','5':'two'};
addEventListener('keydown',function(e){
  if(km[e.key]){hasH=true;setG(km[e.key])}
  if(e.key==='+'||e.key==='=')cnt=Math.min(N,cnt+100);
  if(e.key==='-')cnt=Math.max(200,cnt-100);
});

})();
</script>
</body>
</html>
