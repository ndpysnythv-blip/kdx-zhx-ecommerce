<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KDX · 宇宙粒子</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;background:#000005;overflow:hidden}
body{font-family:'SF Pro Display','Helvetica Neue',sans-serif;color:#fff;user-select:none}
canvas{display:block;position:fixed;top:0;left:0}
#cam{position:fixed;bottom:16px;right:16px;width:160px;height:120px;border-radius:10px;
overflow:hidden;z-index:20;background:#000;display:none;
border:1px solid rgba(255,255,255,.05);opacity:.65}
#cam video{width:100%;height:100%;object-fit:cover;transform:scaleX(-1)}
#lbl{position:fixed;top:40px;left:50%;transform:translateX(-50%);font-size:12px;
font-weight:300;letter-spacing:12px;z-index:10;
opacity:0;transition:opacity .8s cubic-bezier(.4,0,.2,1);pointer-events:none;
text-transform:uppercase;color:rgba(255,255,255,.35)}
#lbl.show{opacity:1}
#hint{position:fixed;bottom:20px;left:20px;z-index:10;font-size:10px;
color:rgba(255,255,255,.08);line-height:2.2;pointer-events:none;letter-spacing:1.5px}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="cam"><video id="v" autoplay playsinline muted></video></div>
<div id="lbl"></div>
<div id="hint">张开 · 扩散 &nbsp;&nbsp; 握拳 · 收缩 &nbsp;&nbsp; 捏合 · 漩涡 &nbsp;&nbsp; 指向 · 追踪 &nbsp;&nbsp; 1-5 切换</div>

<script>
(function(){
'use strict';

var c=document.getElementById('c'),x=c.getContext('2d');
var vid=document.getElementById('v'),camBox=document.getElementById('cam');
var lbl=document.getElementById('lbl');
var W,H;

/* Nebula background canvas — must exist before resize calls genNebula */
var nebC=document.createElement('canvas'),nebX=nebC.getContext('2d');
function genNebula(){
  nebC.width=W;nebC.height=H;
  nebX.fillStyle='#000005';nebX.fillRect(0,0,W,H);
  var clouds=[
    {x:W*.25,y:H*.35,r:W*.45,h:260,s:15,l:5,a:.025},
    {x:W*.7,y:H*.6,r:W*.4,h:300,s:12,l:4,a:.02},
    {x:W*.5,y:H*.2,r:W*.35,h:220,s:10,l:4,a:.018},
    {x:W*.8,y:H*.3,r:W*.3,h:340,s:8,l:3,a:.015}
  ];
  for(var i=0;i<clouds.length;i++){
    var cl=clouds[i];
    var g=nebX.createRadialGradient(cl.x,cl.y,0,cl.x,cl.y,cl.r);
    g.addColorStop(0,'hsla('+cl.h+','+cl.s+'%,'+cl.l+'%,'+cl.a+')');
    g.addColorStop(.6,'hsla('+cl.h+','+cl.s+'%,'+(cl.l-1)+'%,'+(cl.a*.4)+')');
    g.addColorStop(1,'transparent');
    nebX.fillStyle=g;nebX.fillRect(0,0,W,H);
  }
}

function resize(){W=innerWidth;H=innerHeight;c.width=W;c.height=H;genNebula()}
resize();addEventListener('resize',resize);

/* ═══════════ GESTURE STATE ═══════════ */
var gest='none',hx=.5,hy=.5,hx2=.5,hy2=.5,hasH=false,hdx=0,hdy=0,phx=.5,phy=.5,time=0;

var NAMES={none:'',open:'expansion',fist:'contraction',pinch:'vortex',point:'tracking',two:'gravity'};

// Deep space palette — low saturation, high depth
var PAL={
  none: {h:220,s:30,l:50},
  open: {h:35,s:50,l:55},
  fist: {h:280,s:35,l:45},
  pinch:{h:250,s:40,l:50},
  point:{h:180,s:35,l:48},
  two:  {h:210,s:45,l:52}
};

function setG(g){if(g!==gest){gest=g;lbl.textContent=NAMES[g]||'';lbl.classList.toggle('show',!!NAMES[g])}}

/* ═══════════ STAR PARTICLES (tiny background) ═══════════ */
var stars=[];
for(var i=0;i<200;i++)stars.push({
  x:Math.random()*W,y:Math.random()*H,
  r:Math.random()*.5+.15,
  a:Math.random()*.2+.05,
  tw:Math.random()*6.28,sp:Math.random()*.3+.1
});

/* ═══════════ ORB PARTICLES (glowing spheres) ═══════════ */
var ORB_N=120,cnt=80,orbs=[];

function Orb(){
  this.x=Math.random()*W;this.y=Math.random()*H;
  this.vx=(Math.random()-.5)*.15;this.vy=(Math.random()-.5)*.15;
  this.size=Math.random()*3+1.5;this.baseSize=this.size;
  this.hue=Math.random()*60+210; // blue-purple range
  this.sat=Math.random()*20+25;
  this.lit=Math.random()*15+40;
  this.alpha=Math.random()*.4+.15;this.baseAlpha=this.alpha;
  this.glowSize=Math.random()*25+12;
  this.pulse=Math.random()*6.28;
  this.pulseSpd=Math.random()*.015+.008;
  this.ph=Math.random()*6.28;
  this.trail=[];this.trailN=4;
}
for(var i=0;i<ORB_N;i++)orbs.push(new Orb());

/* ═══════════ CONNECTIONS (very subtle) ═══════════ */
function drawConn(){
  var maxD=90,maxN=150,n=0;
  for(var i=0;i<cnt&&n<maxN;i++){
    for(var j=i+1;j<cnt&&n<maxN;j++){
      var dx=orbs[i].x-orbs[j].x,dy=orbs[i].y-orbs[j].y;
      var d=Math.sqrt(dx*dx+dy*dy);
      if(d<maxD){
        var al=(1-d/maxD)*.06;
        x.beginPath();x.moveTo(orbs[i].x,orbs[i].y);x.lineTo(orbs[j].x,orbs[j].y);
        x.strokeStyle='hsla(230,30%,60%,'+al+')';x.lineWidth=.3;x.stroke();n++;
      }
    }
  }
}

/* ═══════════ PHYSICS ═══════════ */
function phys(dt){
  time+=dt;
  var col=PAL[gest];

  for(var i=0;i<cnt;i++){
    var p=orbs[i];
    p.pulse+=p.pulseSpd;

    // Color drift toward gesture color
    p.hue+=(col.h+Math.sin(time*.6+p.ph)*18-p.hue)*.012;
    p.sat+=(col.s-p.sat)*.012;
    p.lit+=(col.l-p.lit)*.012;

    var dx,dy,d,f,a;
    switch(gest){
      case 'open':
        dx=p.x-hx*W;dy=p.y-hy*H;d=Math.hypot(dx,dy);
        if(d<260&&d>1){f=(1-d/260)*(1-d/260)*1.8;p.vx+=dx/d*f;p.vy+=dy/d*f;
          p.size=p.baseSize*(1+(1-d/260)*1.5);
          a=Math.atan2(dy,dx);p.vx+=Math.cos(a+1.57)*f*.2;p.vy+=Math.sin(a+1.57)*f*.2}
        p.trailN=7;break;

      case 'fist':
        dx=hx*W-p.x;dy=hy*H-p.y;d=Math.hypot(dx,dy);
        if(d<300&&d>15){f=(1-d/300)*(1-d/300)*3;p.vx+=dx/d*f;p.vy+=dy/d*f;
          p.size=p.baseSize*(.4+d/300*.6);a=Math.atan2(dy,dx);
          p.vx+=Math.cos(a+1.57)*f*.1;p.vy+=Math.sin(a+1.57)*f*.1}
        else if(d<=15){a=Math.atan2(p.y-hy*H,p.x-hx*W);
          p.vx=Math.cos(a+1.8)*.8;p.vy=Math.sin(a+1.8)*.8;p.size=p.baseSize*.3}
        p.trailN=2;break;

      case 'pinch':
        dx=hx*W-p.x;dy=hy*H-p.y;d=Math.hypot(dx,dy);
        if(d<200&&d>2){f=(1-d/200)*(1-d/200)*3.5;a=Math.atan2(dy,dx);
          p.vx+=Math.cos(a+1.57)*f*.6;p.vy+=Math.sin(a+1.57)*f*.6;
          p.vx+=dx/d*f*.2;p.vy+=dy/d*f*.2;
          p.size=p.baseSize*(1+Math.sin(time*4+p.ph)*.35)}
        p.trailN=10;break;

      case 'point':
        dx=p.x-hx*W;dy=p.y-hy*H;d=Math.hypot(dx,dy);
        if(d<300&&d>5){var dl=Math.hypot(hdx,hdy);
          if(dl>.0005){var nx=hdx/dl,ny=hdy/dl;
            p.vx+=nx*1.2;p.vy+=ny*1.2;p.size=p.baseSize*1.1}}p.trailN=5;break;

      case 'two':
        for(var h=0;h<2;h++){var hhx=(h?hx2:hx)*W,hhy=(h?hy2:hy)*H;
          dx=hhx-p.x;dy=hhy-p.y;d=Math.hypot(dx,dy);
          if(d<260&&d>1){f=(1-d/260)*(1-d/260)*2;p.vx+=dx/d*f;p.vy+=dy/d*f}}
        p.trailN=8;break;

      default:
        p.vx+=Math.sin(time*.25+p.ph)*.005+Math.cos(time*.4+p.ph*1.3)*.003;
        p.vy+=Math.cos(time*.2+p.ph*1.3)*.005+Math.sin(time*.35+p.ph2)*.003;
        p.size+=(p.baseSize-p.size)*.03;p.trailN=3;break;
    }

    p.vx+=Math.sin(time*.7+p.ph)*.004;p.vy+=Math.cos(time*.6+p.ph2)*.004;
    p.vx*=.99;p.vy*=.99;

    p.trail.push({x:p.x,y:p.y});if(p.trail.length>p.trailN)p.trail.shift();
    p.x+=p.vx;p.y+=p.vy;
    if(p.x<-30)p.x=W+30;if(p.x>W+30)p.x=-30;
    if(p.y<-30)p.y=H+30;if(p.y>H+30)p.y=-30;
  }
}

/* ═══════════ RENDER ═══════════ */
var lt=0,fc=0,ft=0,fps=0,dt2=0;

function frame(ts){
  var dt=Math.min((ts-lt)/1000,.05);lt=ts;fc++;ft+=dt;dt2+=dt;
  if(ft>=1){fps=fc;fc=0;ft=0}
  if(dt2>.066){detectHand();dt2=0}

  // Fade
  x.fillStyle='rgba(0,0,5,.07)';x.fillRect(0,0,W,H);

  // Nebula overlay (very faint)
  x.globalAlpha=.008;x.drawImage(nebC,0,0);x.globalAlpha=1;

  // Background stars
  for(var i=0;i<stars.length;i++){var s=stars[i];s.tw+=dt*s.sp;
    var sa=s.a*(.3+.7*Math.sin(s.tw));
    x.beginPath();x.arc(s.x,s.y,s.r,0,6.28);
    x.fillStyle='rgba(255,255,255,'+sa+')';x.fill()}

  phys(dt);

  // Draw orbs — the main visual
  for(var i=0;i<cnt;i++){
    var p=orbs[i];
    var pulse=.7+.3*Math.sin(p.pulse);
    var al=p.alpha*pulse;if(al<.003)continue;
    var h=Math.floor(p.hue),s=Math.floor(p.sat),l=Math.floor(p.lit);
    var sz=p.size*pulse;

    // Trail
    if(p.trail.length>1){
      x.beginPath();x.moveTo(p.trail[0].x,p.trail[0].y);
      for(var j=1;j<p.trail.length;j++)x.lineTo(p.trail[j].x,p.trail[j].y);
      x.strokeStyle='hsla('+h+','+s+'%,'+l+'%,'+(al*.12)+')';
      x.lineWidth=sz*.3;x.lineCap='round';x.stroke();
    }

    // Outer glow — large soft halo
    var gSize=p.glowSize*pulse;
    var g=x.createRadialGradient(p.x,p.y,0,p.x,p.y,gSize);
    g.addColorStop(0,'hsla('+h+','+s+'%,'+(l+15)+'%,'+(al*.5)+')');
    g.addColorStop(.25,'hsla('+h+','+s+'%,'+l+'%,'+(al*.2)+')');
    g.addColorStop(.6,'hsla('+h+','+s+'%,'+(l-5)+'%,'+(al*.06)+')');
    g.addColorStop(1,'hsla('+h+','+s+'%,'+l+'%,0)');
    x.beginPath();x.arc(p.x,p.y,gSize,0,6.28);x.fillStyle=g;x.fill();

    // Mid glow — medium ring
    var mg=x.createRadialGradient(p.x,p.y,0,p.x,p.y,sz*2.5);
    mg.addColorStop(0,'hsla('+h+','+s+'%,'+(l+10)+'%,'+(al*.7)+')');
    mg.addColorStop(.5,'hsla('+h+','+s+'%,'+l+'%,'+(al*.15)+')');
    mg.addColorStop(1,'hsla('+h+','+s+'%,'+l+'%,0)');
    x.beginPath();x.arc(p.x,p.y,sz*2.5,0,6.28);x.fillStyle=mg;x.fill();

    // Core — bright center
    var cg=x.createRadialGradient(p.x,p.y,0,p.x,p.y,sz);
    cg.addColorStop(0,'hsla('+h+',50%,85%,'+(al*.9)+')');
    cg.addColorStop(.5,'hsla('+h+','+s+'%,'+(l+20)+'%,'+(al*.5)+')');
    cg.addColorStop(1,'hsla('+h+','+s+'%,'+l+'%,0)');
    x.beginPath();x.arc(p.x,p.y,sz,0,6.28);x.fillStyle=cg;x.fill();

    // Tiny hot center
    x.beginPath();x.arc(p.x,p.y,sz*.25,0,6.28);
    x.fillStyle='hsla('+h+',30%,92%,'+(al*.6)+')';x.fill();
  }

  // Subtle connections
  drawConn();

  // Very subtle bloom
  x.save();x.globalCompositeOperation='lighter';
  x.filter='blur(20px) brightness(.3)';x.globalAlpha=.08;x.drawImage(c,0,0);
  x.filter='none';x.globalAlpha=1;x.globalCompositeOperation='source-over';x.restore();

  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

/* ═══════════ CAMERA ═══════════ */
var camOk=false;
var pc=document.createElement('canvas');pc.width=100;pc.height=75;
var px=pc.getContext('2d',{willReadFrequently:true});

function startCam(){
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia)return;
  navigator.mediaDevices.getUserMedia({video:{width:640,height:480,facingMode:'user'}})
    .then(function(s){vid.srcObject=s;camBox.style.display='block';return vid.play()})
    .then(function(){camOk=true})
    .catch(function(){});
}
startCam();

function detectHand(){
  if(!camOk||vid.readyState<2)return;
  px.drawImage(vid,0,0,100,75);
  var img=px.getImageData(0,0,100,75),d=img.data,PW=100,PH=75;
  var skin=[];for(var i=0;i<PW*PH;i++)skin[i]=0;
  for(var i=0;i<d.length;i+=4){
    var r=d[i],g=d[i+1],b=d[i+2];
    var cb=128-.169*r-.331*g+.5*b,cr=128+.5*r-.419*g-.081*b;
    if(cr>133&&cr<175&&cb>80&&cb<135)skin[i/4]=1;
  }
  var vis=[];for(var i=0;i<PW*PH;i++)vis[i]=0;
  var blobs=[];
  for(var y=1;y<PH-1;y++)for(var xx=1;xx<PW-1;xx++){
    var idx=y*PW+xx;if(!skin[idx]||vis[idx])continue;
    var sx=0,sy=0,n=0,q=[idx];vis[idx]=1;
    while(q.length&&n<500){var ci=q.shift(),cx=ci%PW,cy=(ci-cx)/PW;sx+=cx;sy+=cy;n++;
      var nb=[[cx-1,cy],[cx+1,cy],[cx,cy-1],[cx,cy+1]];
      for(var k=0;k<4;k++){var nx=nb[k][0],ny=nb[k][1];
        if(nx>=0&&nx<PW&&ny>=0&&ny<PH){var ni=ny*PW+nx;if(skin[ni]&&!vis[ni]){vis[ni]=1;q.push(ni)}}}}
    if(n>60)blobs.push({x:1-sx/n/PW,y:sy/n/PH,n:n});
  }
  blobs.sort(function(a,b){return b.n-a.n});
  if(blobs.length>=2&&blobs[1].n>50){
    hx=blobs[0].x;hy=blobs[0].y;hx2=blobs[1].x;hy2=blobs[1].y;hasH=true;setG('two');
  }else if(blobs.length>=1&&blobs[0].n>80){
    phx=hx;phy=hy;hx=blobs[0].x;hy=blobs[0].y;hdx=hx-phx;hdy=hy-phy;hasH=true;
    var sp=Math.hypot(hdx,hdy),sz=blobs[0].n;
    if(sp>.02)setG('open');else if(sz>250)setG('fist');else if(sz>120)setG('pinch');else setG('point');
  }else{hasH=false;setG('none')}
}

/* ═══════════ MOUSE/TOUCH ═══════════ */
var md=false,lmx=W/2,lmy=H/2;
c.style.cursor='crosshair';
c.addEventListener('mousemove',function(e){
  if(camOk&&hasH)return;lmx=hx*W;lmy=hy*H;hx=e.clientX/W;hy=e.clientY/H;
  hdx=hx-lmx/W;hdy=hy-lmy/H;hasH=true;
  var sp=Math.hypot(hdx,hdy);
  if(md)setG('fist');else if(sp>.008)setG('open');else setG('point');
});
c.addEventListener('mousedown',function(){md=true;if(!camOk||!hasH)setG('fist')});
c.addEventListener('mouseup',function(){md=false;if(!camOk||!hasH)setG('open')});
c.addEventListener('mouseleave',function(){if(!camOk){hasH=false;setG('none')}});
c.addEventListener('touchmove',function(e){e.preventDefault();
  if(camOk&&hasH)return;var t=e.touches[0];hx=t.clientX/W;hy=t.clientY/H;hasH=true;setG('pinch')},{passive:false});
c.addEventListener('touchend',function(){if(!camOk){hasH=false;setG('none')}});
var km={'0':'none','1':'open','2':'fist','3':'pinch','4':'point','5':'two'};
addEventListener('keydown',function(e){
  if(km[e.key]){hasH=true;setG(km[e.key])}
  if(e.key==='+'||e.key==='=')cnt=Math.min(ORB_N,cnt+10);
  if(e.key==='-')cnt=Math.max(20,cnt-10);
});

})();
</script>
</body>
</html>
