<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>留言板 - KDX丨ZHX</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
            padding-top: 100px;
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            box-shadow: 0 25px 80px -20px rgba(0, 0, 0, 0.15);
        }
        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #fff;
            transition: all 0.3s ease;
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.4);
        }
    </style>
</head>
<body>
    <header class="bg-white shadow-sm fixed top-0 left-0 right-0 z-50">
        <div class="container mx-auto px-4 py-4">
            <div class="flex items-center justify-between">
                <a href="/shop" class="flex items-center gap-3">
                    <h1 class="text-xl font-bold text-black">KDX丨ZHX</h1>
                </a>
                <nav class="flex items-center gap-8">
                    <a href="/shop" class="font-medium text-gray-600 hover:text-black transition">首页</a>
                    <a href="/chat" class="font-medium text-gray-600 hover:text-black transition">智能客服</a>
                    <a href="/orders" class="font-medium text-gray-600 hover:text-black transition">订单</a>
                </nav>
                <div id="userSection">
                    <button id="loginBtn" onclick="window.location.href='/auth'" class="bg-black text-white px-6 py-2 rounded-lg font-medium hover:bg-gray-800 transition">登录</button>
                    <div id="userInfo" class="hidden items-center gap-3">
                        <span id="userName" class="font-medium text-gray-800"></span>
                        <button onclick="handleLogout()" class="text-gray-500 hover:text-red-600"><i class="fas fa-sign-out-alt"></i></button>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <main class="container mx-auto px-4 py-8">
        <div class="max-w-2xl mx-auto">
            <div class="glass-card rounded-3xl p-8">
                <h2 class="text-2xl font-bold text-gray-900 mb-6">留言板</h2>
                <p class="text-gray-600 mb-8">有任何问题或建议，请在这里留言，我们会尽快回复您。</p>

                <form id="messageForm" class="space-y-6">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">您的姓名</label>
                        <input type="text" id="name" class="w-full px-4 py-3 border-2 border-gray-200 rounded-xl focus:outline-none focus:border-purple-500" placeholder="请输入您的姓名" required>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">联系邮箱</label>
                        <input type="email" id="email" class="w-full px-4 py-3 border-2 border-gray-200 rounded-xl focus:outline-none focus:border-purple-500" placeholder="请输入您的邮箱">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">留言内容</label>
                        <textarea id="content" rows="5" class="w-full px-4 py-3 border-2 border-gray-200 rounded-xl focus:outline-none focus:border-purple-500 resize-none" placeholder="请输入您的留言..." required></textarea>
                    </div>
                    <button type="submit" class="w-full btn-primary py-3 rounded-xl font-semibold">提交留言</button>
                </form>

                <div id="successMsg" class="hidden mt-6 p-4 bg-green-50 border border-green-200 rounded-xl text-green-700">
                    <i class="fas fa-check-circle mr-2"></i>留言提交成功！我们会尽快回复您。
                </div>
            </div>
        </div>
    </main>

    <script>
        function checkLoginStatus() {
            const user = localStorage.getItem('user');
            if (user) {
                const currentUser = JSON.parse(user);
                document.getElementById('loginBtn').classList.add('hidden');
                document.getElementById('userInfo').classList.remove('hidden');
                document.getElementById('userInfo').classList.add('flex');
                document.getElementById('userName').textContent = currentUser.username;
            }
        }

        function handleLogout() {
            localStorage.removeItem('user');
            localStorage.removeItem('token');
            checkLoginStatus();
        }

        document.getElementById('messageForm').addEventListener('submit', function(e) {
            e.preventDefault();
            document.getElementById('messageForm').classList.add('hidden');
            document.getElementById('successMsg').classList.remove('hidden');
        });

        checkLoginStatus();
    </script>
</body>
</html>
