<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>联系我们 - KDX商城</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="/styles-premium.css">
  <link rel="stylesheet" href="/mobile.css">
  <link rel="stylesheet" href="/loader.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .container {
      max-width: 600px;
      width: 100%;
    }

    .header {
      text-align: center;
      color: white;
      margin-bottom: 30px;
    }

    .header h1 {
      font-size: 32px;
      margin-bottom: 10px;
    }

    .header p {
      font-size: 16px;
      opacity: 0.9;
    }

    .contact-form {
      background: white;
      padding: 40px;
      border-radius: 16px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
    }

    .form-header {
      text-align: center;
      margin-bottom: 30px;
    }

    .form-header h2 {
      color: #333;
      font-size: 24px;
      margin-bottom: 8px;
    }

    .form-header p {
      color: #666;
      font-size: 14px;
    }

    .form-group {
      margin-bottom: 24px;
    }

    .form-group label {
      display: block;
      margin-bottom: 8px;
      color: #333;
      font-weight: 500;
      font-size: 14px;
    }

    .form-group input,
    .form-group textarea {
      width: 100%;
      padding: 14px 16px;
      border: 2px solid #e0e0e0;
      border-radius: 10px;
      font-size: 15px;
      transition: all 0.3s ease;
      background: #f8f9fa;
    }

    .form-group input:focus,
    .form-group textarea:focus {
      outline: none;
      border-color: #667eea;
      background: white;
      box-shadow: 0 0 0 4px rgba(102, 126, 234, 0.1);
    }

    .form-group textarea {
      resize: vertical;
      min-height: 120px;
    }

    .submit-btn {
      width: 100%;
      padding: 16px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      position: relative;
      overflow: hidden;
    }

    .submit-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 30px rgba(102, 126, 234, 0.4);
    }

    .submit-btn:disabled {
      opacity: 0.7;
      cursor: not-allowed;
      transform: none;
    }

    .btn-text {
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .loader {
      width: 18px;
      height: 18px;
      border: 2px solid transparent;
      border-top: 2px solid white;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .message {
      padding: 16px;
      border-radius: 10px;
      margin-bottom: 20px;
      display: none;
      align-items: center;
      gap: 10px;
      font-weight: 500;
    }

    .message.show {
      display: flex;
      animation: slideIn 0.3s ease;
    }

    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateY(-10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .success-message {
      background: #d4edda;
      color: #155724;
      border: 1px solid #c3e6cb;
    }

    .error-message {
      background: #f8d7da;
      color: #721c24;
      border: 1px solid #f5c6cb;
    }

    .contact-info {
      margin-top: 30px;
      padding-top: 30px;
      border-top: 1px solid #e0e0e0;
    }

    .contact-info h3 {
      color: #333;
      font-size: 18px;
      margin-bottom: 16px;
    }

    .info-item {
      display: flex;
      align-items: center;
      gap: 12px;
      color: #666;
      padding: 8px 0;
      font-size: 14px;
    }

    .info-item svg {
      width: 20px;
      height: 20px;
      color: #667eea;
    }

    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: white;
      text-decoration: none;
      margin-bottom: 20px;
      font-weight: 500;
      opacity: 0.9;
      transition: opacity 0.3s ease;
    }

    .back-link:hover {
      opacity: 1;
    }

    .back-link svg {
      width: 20px;
      height: 20px;
    }

    .footer-note {
      text-align: center;
      margin-top: 24px;
      color: #999;
      font-size: 12px;
    }

    .footer-note a {
      color: #667eea;
      text-decoration: none;
    }

    .footer-note a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="container">
    <a href="#" class="back-link" onclick="history.back()">
      <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path>
      </svg>
      返回首页
    </a>

    <div class="header">
      <h1>📬 联系我们</h1>
      <p>有任何问题或建议？我们随时为您服务！</p>
    </div>

    <div class="contact-form">
      <div class="form-header">
        <h2>发送消息</h2>
        <p>填写下方表单，我们会在24小时内回复您</p>
      </div>

      <div id="success-message" class="message success-message">
        <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path>
        </svg>
        ✅ 消息已发送！我们会尽快回复您。
      </div>

      <div id="error-message" class="message error-message">
        <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
        </svg>
        ❌ 发送失败，请稍后重试。
      </div>

      <form id="contact-form">
        <div class="form-group">
          <label for="name">您的姓名 *</label>
          <input type="text" id="name" name="to_name" placeholder="请输入您的姓名" required>
        </div>

        <div class="form-group">
          <label for="email">您的邮箱 *</label>
          <input type="email" id="email" name="from_email" placeholder="请输入您的邮箱" required>
        </div>

        <div class="form-group">
          <label for="phone">您的电话（可选）</label>
          <input type="tel" id="phone" name="phone" placeholder="请输入您的电话">
        </div>

        <div class="form-group">
          <label for="subject">主题 *</label>
          <input type="text" id="subject" name="subject" placeholder="请输入主题" required>
        </div>

        <div class="form-group">
          <label for="message">消息内容 *</label>
          <textarea id="message" name="message" placeholder="请输入您的消息..." rows="5" required></textarea>
        </div>

        <button type="submit" class="submit-btn" id="submit-btn">
          <span class="btn-text">
            <span id="btn-text">发送消息</span>
            <span id="btn-loader" class="loader" style="display: none;"></span>
          </span>
        </button>
      </form>

      <div class="contact-info">
        <h3>其他联系方式</h3>
        <div class="info-item">
          <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path>
          </svg>
          support@kdxzhx.com
        </div>
        <div class="info-item">
          <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z"></path>
          </svg>
          400-888-8888
        </div>
        <div class="info-item">
          <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"></path>
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"></path>
          </svg>
          北京市朝阳区XX大厦
        </div>
      </div>

      <div class="footer-note">
        使用 <a href="https://www.emailjs.com" target="_blank">EmailJS</a> 提供的邮件服务 | 
        查看 <a href="EMAILJS_SETUP.md" target="_blank">配置文档</a>
      </div>
    </div>
  </div>

  <!-- EmailJS SDK -->
  <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>

  <script type="text/javascript">
    // ============================================
    // EmailJS 配置
    // ============================================
    
    // 请替换为您的实际配置
    // 获取地址：https://dashboard.emailjs.com/
    const CONFIG = {
      publicKey: 'mpcnF0Ueaq6qFJOId',       // Public Key
      serviceId: 'service_g4yw2de',            // Service ID
      templateId: 'your_template_id'           // 请替换为您的 Template ID
    };

    // 初始化EmailJS
    if (CONFIG.publicKey && CONFIG.publicKey !== 'your_public_key_here') {
      emailjs.init(CONFIG.publicKey);
      console.log('✅ EmailJS 已初始化');
    } else {
      console.warn('⚠️ 请先在代码中配置 EmailJS 参数');
    }

    // ============================================
    // 表单提交处理
    // ============================================
    
    const form = document.getElementById('contact-form');
    const submitBtn = document.getElementById('submit-btn');
    const btnText = document.getElementById('btn-text');
    const btnLoader = document.getElementById('btn-loader');
    const successMsg = document.getElementById('success-message');
    const errorMsg = document.getElementById('error-message');

    // 显示/隐藏消息
    function showMessage(type) {
      successMsg.classList.remove('show');
      errorMsg.classList.remove('show');
      
      if (type === 'success') {
        successMsg.classList.add('show');
      } else if (type === 'error') {
        errorMsg.classList.add('show');
      }
    }

    // 设置按钮加载状态
    function setLoading(isLoading) {
      submitBtn.disabled = isLoading;
      btnText.textContent = isLoading ? '发送中...' : '发送消息';
      btnLoader.style.display = isLoading ? 'inline-block' : 'none';
    }

    // 表单提交
    form.addEventListener('submit', async function(event) {
      event.preventDefault();
      
      // 检查是否配置了EmailJS
      if (!CONFIG.publicKey || CONFIG.publicKey === 'your_public_key_here') {
        alert('⚠️ 请先在代码中配置 EmailJS 参数！\n\n1. 访问 https://www.emailjs.com 注册账号\n2. 创建邮件服务和模板\n3. 获取 Public Key、Service ID、Template ID\n4. 替换代码中的配置');
        return;
      }

      // 获取表单数据
      const formData = {
        to_name: document.getElementById('name').value,
        from_email: document.getElementById('email').value,
        phone: document.getElementById('phone').value || '未提供',
        subject: document.getElementById('subject').value,
        message: document.getElementById('message').value
      };

      // 设置加载状态
      setLoading(true);
      showMessage(null);

      try {
        // 发送邮件
        const response = await emailjs.send(
          CONFIG.serviceId,
          CONFIG.templateId,
          formData
        );

        console.log('✅ 邮件发送成功！', response);
        
        // 显示成功消息
        showMessage('success');
        
        // 重置表单
        form.reset();
        
        // 5秒后隐藏成功消息
        setTimeout(() => {
          successMsg.classList.remove('show');
        }, 5000);

      } catch (error) {
        console.error('❌ 邮件发送失败：', error);
        
        // 显示错误消息
        showMessage('error');
        
        // 详细错误信息
        let errorDetails = '发送失败，请稍后重试';
        if (error.text) {
          errorDetails = error.text;
        } else if (error.message) {
          errorDetails = error.message;
        }
        
        alert(errorDetails);
      } finally {
        // 恢复按钮状态
        setLoading(false);
      }
    });

    // ============================================
    // 开发环境模拟（仅用于测试）
    // ============================================
    
    // 如果未配置EmailJS，提供模拟功能
    if (!CONFIG.publicKey || CONFIG.publicKey === 'your_public_key_here') {
      console.log('🔧 开发模式：已启用模拟发送功能');
      
      // 覆盖提交处理，提供模拟体验
      form.addEventListener('submit', function(event) {
        event.preventDefault();
        
        const name = document.getElementById('name').value;
        const email = document.getElementById('email').value;
        
        // 模拟发送
        setLoading(true);
        showMessage(null);
        
        setTimeout(() => {
          setLoading(false);
          showMessage('success');
          form.reset();
          
          console.log('📧 模拟发送成功！');
          console.log('收件人：', name);
          console.log('邮箱：', email);
          
          alert('✅ 消息已发送（模拟）！\n\n要使用真实的邮件服务，请配置 EmailJS 参数。');
        }, 1500);
      });
    }
  </script>
    <script src="/ai-assistant.js"></script>
    <script src="/loader.js"></script>
</body>
</html>
