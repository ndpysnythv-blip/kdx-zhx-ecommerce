<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="description" content="KDX丨ZHX - 合作联系">
    <meta name="keywords" content="KDX丨ZHX,合作,商务合作,联系我们">
    <meta name="author" content="KDX丨ZHX">
    <title>合作 - KDX丨ZHX</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(180deg, #ffffff 0%, #f5f5f7 100%);
            min-height: 100vh;
        }
        
        .section-title {
            font-size: 2.5rem;
            font-weight: 700;
            letter-spacing: -0.02em;
        }
        
        .section-subtitle {
            font-size: 1.125rem;
            color: #666666;
            line-height: 1.6;
        }
        
        .apple-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 0.875rem 2rem;
            border-radius: 28px;
            font-weight: 600;
            font-size: 0.9375rem;
            transition: all 0.3s cubic-bezier(0.25, 0.1, 0.25, 1);
            cursor: pointer;
            border: none;
            text-decoration: none;
        }
        
        .apple-btn-dark {
            background-color: #000000;
            color: #ffffff;
        }
        
        .apple-btn-dark:hover {
            background-color: #333333;
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15);
        }
        
        .card-hover {
            transition: transform 0.3s cubic-bezier(0.25, 0.1, 0.25, 1), box-shadow 0.3s cubic-bezier(0.25, 0.1, 0.25, 1);
        }
        
        .card-hover:hover {
            transform: translateY(-4px);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
        }
        
        .hover-lift {
            transition: transform 0.3s cubic-bezier(0.25, 0.1, 0.25, 1);
        }
        
        .hover-lift:hover {
            transform: translateY(-4px);
        }
        
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        
        @keyframes slideUp {
            from { 
                opacity: 0;
                transform: translateY(30px);
            }
            to { 
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .animate-fade-in {
            animation: fadeIn 0.8s ease-out forwards;
        }
        
        .animate-slide-up {
            animation: slideUp 0.8s ease-out forwards;
        }
    </style>
</head>
<body>
    <!-- 导航栏 -->
    <nav class="fixed top-0 left-0 right-0 bg-white/80 backdrop-blur-md z-50 shadow-sm">
        <div class="max-w-7xl mx-auto px-6 py-4 flex items-center justify-between">
            <a href="https://kdxzhx.top" class="font-bold text-xl">KDX丨ZHX</a>
            <div class="flex items-center space-x-8">
                <a href="https://kdxzhx.top" class="text-sm font-medium hover:text-gray-600 transition-colors">首页</a>
                <a href="https://kdxzhx.top/dy" class="text-sm font-medium hover:text-gray-600 transition-colors">主页</a>
                <a href="#" class="text-sm font-medium text-black border-b-2 border-black pb-1">合作</a>
            </div>
        </div>
    </nav>

    <!-- 合作页面内容 -->
    <section class="pt-24 pb-16 px-6 md:px-12">
        <div class="max-w-4xl mx-auto">
            <!-- 标题区域 -->
            <div class="text-center mb-12">
                <h1 class="section-title mb-4 animate-slide-up">合作</h1>
                <p class="section-subtitle mt-6 max-w-2xl mx-auto animate-fade-in" style="animation-delay: 0.2s;">
                    无论你是有合作意向，还是想交流分享，都欢迎随时合作
                </p>
            </div>
            
            <!-- 合作表单 -->
            <div class="max-w-lg mx-auto animate-slide-up" style="animation-delay: 0.3s;">
                <form action="https://formsubmit.co/3548806030@qq.com" method="POST" class="bg-white p-8 rounded-3xl shadow-lg w-full card-hover">
                    <input type="hidden" name="_subject" value="KDX丨ZHX 官网合作消息">
                    <input type="hidden" name="_captcha" value="false">
                    <input type="hidden" name="_next" value="https://kdxzhx.top/hz">
                    
                    <div class="mb-6">
                        <label for="name" class="block text-sm font-medium mb-2 text-gray-700">姓名</label>
                        <input type="text" id="name" name="name" required placeholder="请输入您的姓名" class="w-full px-4 py-3 border border-gray-200 rounded-2xl focus:outline-none focus:ring-2 focus:ring-black focus:border-transparent transition-all duration-300">
                    </div>
                    
                    <div class="mb-6">
                        <label for="email" class="block text-sm font-medium mb-2 text-gray-700">邮箱</label>
                        <input type="email" id="email" name="email" required placeholder="请输入您的邮箱" class="w-full px-4 py-3 border border-gray-200 rounded-2xl focus:outline-none focus:ring-2 focus:ring-black focus:border-transparent transition-all duration-300">
                    </div>
                    
                    <div class="mb-6">
                        <label for="message" class="block text-sm font-medium mb-2 text-gray-700">留言</label>
                        <div class="relative">
                            <textarea id="message" name="message" rows="4" placeholder="请输入您的合作意向或留言..." class="w-full px-4 py-3 border border-gray-200 rounded-2xl focus:outline-none focus:ring-2 focus:ring-black focus:border-transparent transition-all duration-300 resize-none"></textarea>
                            <span id="messageCount" class="absolute bottom-3 right-3 text-xs text-gray-400">0</span>
                        </div>
                        <p id="messageError" class="text-red-500 text-sm mt-2 hidden"></p>
                    </div>
                    
                    <button type="button" onclick="validateAndSubmit()" class="w-full apple-btn apple-btn-dark hover-lift py-3">发送消息</button>
                </form>
                
                <script>
                    // 违禁词列表
                    const forbiddenWords = [
                        '色情', '赌博', '毒品', '诈骗', '传销', '枪支', '弹药', '暴力',
                        '恐怖', '反动', '邪教', '谣言', '诽谤', '辱骂', '侮辱', '威胁',
                        '黑客', '病毒', '木马', '钓鱼', '色情', '成人', '性用品', '保健品',
                        '壮阳', '减肥', '增高', '丰胸', '美白', '祛斑', '祛痘', '脱发',
                        '癌症', '特效药', '偏方', '祖传', '秘方', '神药', '无副作用',
                        '国家级', '最高级', '第一', '唯一', '绝对', '保证', '无效退款',
                        '秒杀', '限时', '抢购', '爆款', '网红', '种草', '微商', '返利',
                        '刷单', '优惠券', '红包', '抽奖', '中奖', '免费', '包邮', '买一送一'
                    ];
                    
                    // 留言字数计数
                    document.getElementById('message').addEventListener('input', function(e) {
                        const count = e.target.value.length;
                        const countEl = document.getElementById('messageCount');
                        
                        countEl.textContent = count;
                    });
                    
                    // 验证并提交表单
                    function validateAndSubmit() {
                        const message = document.getElementById('message').value.trim();
                        const errorEl = document.getElementById('messageError');
                        
                        // 清空之前的错误提示
                        errorEl.classList.add('hidden');
                        errorEl.textContent = '';
                        
                        // 验证字数
                        if (message.length < 30) {
                            errorEl.textContent = '字数要求30字以上';
                            errorEl.classList.remove('hidden');
                            return;
                        }
                        
                        // 检测违禁词
                        const foundWords = forbiddenWords.filter(word => message.includes(word));
                        if (foundWords.length > 0) {
                            errorEl.textContent = `留言内容包含违禁词，禁止发送。`;
                            errorEl.classList.remove('hidden');
                            return;
                        }
                        
                        // 验证通过，提交表单
                        document.querySelector('form').submit();
                    }
                </script>
            </div>
            

        </div>
    </section>

    <!-- 页脚 -->
    <footer class="py-8 border-t border-gray-100">
        <div class="max-w-7xl mx-auto px-6 text-center">
            <p class="text-gray-500 text-sm">© 2024 KDX丨ZHX. All rights reserved.</p>
        </div>
    </footer>
</body>
</html>
