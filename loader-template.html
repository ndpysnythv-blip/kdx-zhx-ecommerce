<div class="loader-overlay" id="appLoader">
    <div class="particles">
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
    </div>
    
    <div class="loader-box">
        <!-- 四个角落的装饰光点 -->
        <div class="corner-glow"></div>
        <div class="corner-glow"></div>
        <div class="corner-glow"></div>
        <div class="corner-glow"></div>
        
        <div class="logo-wrapper">
            <div class="logo-icon"></div>
            <div class="logo-text">
                <span>K</span><span>D</span><span>X</span><span>丨</span><span>Z</span><span>H</span><span>X</span>
            </div>
            <div class="loader-bar">
                <div class="loader-progress"></div>
            </div>
            <div class="loader-status" id="loaderStatus">处理中...</div>
        </div>
    </div>
</div>

<script>
    window.AppLoader = {
        statusTexts: [
            '正在处理...',
            '正在加载资源...',
            '正在连接服务器...',
            '正在获取数据...',
            '即将完成...'
        ],
        
        statusIndex: 0,
        statusInterval: null,
        statusElement: null,
        loaderContainer: null,
        
        init() {
            this.loaderContainer = document.getElementById('appLoader');
            this.statusElement = document.getElementById('loaderStatus');
            
            if (this.loaderContainer && this.statusElement) {
                this.startStatusRotation();
            }
        },
        
        startStatusRotation() {
            if (this.statusInterval) {
                clearInterval(this.statusInterval);
            }
            
            this.statusInterval = setInterval(() => {
                this.statusIndex = (this.statusIndex + 1) % this.statusTexts.length;
                this.statusElement.textContent = this.statusTexts[this.statusIndex];
            }, 1200);
        },
        
        show(message) {
            if (this.loaderContainer) {
                this.loaderContainer.classList.remove('hidden');
                if (message) {
                    this.statusElement.textContent = message;
                    clearInterval(this.statusInterval);
                } else {
                    this.startStatusRotation();
                }
            }
        },
        
        hide() {
            if (this.loaderContainer) {
                this.loaderContainer.classList.add('hidden');
                clearInterval(this.statusInterval);
            }
        },
        
        setMessage(message) {
            if (this.statusElement) {
                this.statusElement.textContent = message;
                clearInterval(this.statusInterval);
            }
        }
    };

    document.addEventListener('DOMContentLoaded', () => {
        AppLoader.init();
    });
</script>
