<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>模拟支付 - KDX电商</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="/styles-premium.css">
    <link rel="stylesheet" href="/mobile.css">
    <style>
        body {
            background: linear-gradient(135deg, #0a0a0a 0%, #1a1a2e 50%, #0f0f1e 100%);
            min-height: 100vh;
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, sans-serif;
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }
    </style>
    <script src="/vercel-analytics.js"></script>
</head>
<body class="text-white">
    <div class="min-h-screen flex items-center justify-center p-4">
        <div class="glass-card rounded-3xl p-8 max-w-md w-full">
            <div class="text-center mb-8">
                <div class="w-20 h-20 bg-blue-500 rounded-full flex items-center justify-center mx-auto mb-4">
                    <i class="fas fa-credit-card text-3xl"></i>
                </div>
                <h1 class="text-2xl font-bold mb-2">模拟支付</h1>
                <p class="text-gray-400 text-sm">这是模拟支付环境，用于测试</p>
            </div>
            
            <div class="space-y-4 mb-8">
                <div class="flex justify-between items-center py-3 border-b border-gray-700">
                    <span class="text-gray-400">订单号</span>
                    <span id="orderId" class="font-mono">-</span>
                </div>
                <div class="flex justify-between items-center py-3 border-b border-gray-700">
                    <span class="text-gray-400">交易号</span>
                    <span id="outTradeNo" class="font-mono text-sm">-</span>
                </div>
                <div class="flex justify-between items-center py-3 border-b border-gray-700">
                    <span class="text-gray-400">商品名称</span>
                    <span id="subject" class="font-medium">-</span>
                </div>
                <div class="flex justify-between items-center py-3">
                    <span class="text-gray-400">支付金额</span>
                    <span id="totalAmount" class="text-2xl font-bold text-green-400">¥0.00</span>
                </div>
            </div>
            
            <div class="space-y-3">
                <button onclick="confirmPayment()" class="w-full py-4 bg-green-500 hover:bg-green-600 text-white font-bold rounded-xl transition-all transform hover:scale-[1.02] active:scale-[0.98]">
                    <i class="fas fa-check-circle mr-2"></i>确认支付
                </button>
                <button onclick="cancelPayment()" class="w-full py-4 bg-gray-700 hover:bg-gray-600 text-white font-medium rounded-xl transition-all">
                    <i class="fas fa-times-circle mr-2"></i>取消支付
                </button>
            </div>
            
            <div class="mt-6 p-4 bg-yellow-500/10 border border-yellow-500/20 rounded-xl">
                <p class="text-yellow-400 text-xs text-center">
                    <i class="fas fa-info-circle mr-1"></i>
                    模拟支付环境，点击确认支付即可完成订单
                </p>
            </div>
        </div>
    </div>
    
    <script>
        // 从URL获取参数
        const urlParams = new URLSearchParams(window.location.search);
        const orderId = urlParams.get('orderId');
        const outTradeNo = urlParams.get('outTradeNo');
        const totalAmount = urlParams.get('totalAmount');
        const subject = urlParams.get('subject');
        
        // 显示订单信息
        document.getElementById('orderId').textContent = orderId || '-';
        document.getElementById('outTradeNo').textContent = outTradeNo || '-';
        document.getElementById('subject').textContent = subject ? decodeURIComponent(subject) : '-';
        document.getElementById('totalAmount').textContent = '¥' + (parseFloat(totalAmount || 0).toFixed(2));
        
        // 确认支付
        async function confirmPayment() {
            try {
                const btn = event.target.closest('button');
                btn.disabled = true;
                btn.innerHTML = '<i class="fas fa-spinner fa-spin mr-2"></i>处理中...';
                
                // 调用模拟支付成功接口
                const response = await fetch('/api/alipay/mock-success', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ outTradeNo, orderId })
                });
                
                const result = await response.json();
                
                if (result.success) {
                    // 跳转到支付成功页面
                    window.location.href = `/payment-success?out_trade_no=${outTradeNo}&total_amount=${totalAmount}`;
                } else {
                    alert('支付失败: ' + (result.message || '未知错误'));
                    btn.disabled = false;
                    btn.innerHTML = '<i class="fas fa-check-circle mr-2"></i>确认支付';
                }
            } catch (error) {
                console.error('支付错误:', error);
                alert('支付失败，请重试');
                const btn = event.target.closest('button');
                btn.disabled = false;
                btn.innerHTML = '<i class="fas fa-check-circle mr-2"></i>确认支付';
            }
        }
        
        // 取消支付
        function cancelPayment() {
            if (confirm('确定要取消支付吗？')) {
                window.location.href = '/shop';
            }
        }
    </script>
</body>
</html>
