<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>登录 - KDX丨ZHX</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="/mobile.css">
    <!-- Vercel Analytics -->
    <script defer src="https://unpkg.com/@vercel/analytics@1.1.1/dist/script.js"></script>
    
    <style>
        * {
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #0a0a0a 0%, #1a1a2e 50%, #0f0f1e 100%);
            min-height: 100vh;
        }
        
        .glass-card {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.05);
        }
        
        .btn-premium {
            background: #ffffff;
            color: #000;
            font-weight: 700;
            font-size: 17px;
            letter-spacing: 0.5px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 6px 24px rgba(255, 255, 255, 0.15), 0 3px 8px rgba(0, 0, 0, 0.3);
        }
        
        .btn-premium:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 40px rgba(255, 255, 255, 0.2), 0 6px 16px rgba(0, 0, 0, 0.35);
        }
        
        .btn-premium:active {
            transform: translateY(-1px);
        }
        
        .input-wrapper {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 16px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        .input-wrapper:focus-within {
            background: rgba(255, 255, 255, 0.06);
            border-color: rgba(255, 255, 255, 0.15);
            box-shadow: 0 0 0 4px rgba(255, 255, 255, 0.03);
        }
        
        .input-icon {
            color: rgba(255, 255, 255, 0.4);
            transition: color 0.3s ease;
        }
        
        .input-wrapper:focus-within .input-icon {
            color: rgba(255, 255, 255, 0.7);
        }
        
        .input-field {
            background: transparent;
            border: none;
            color: #ffffff;
            font-size: 16px;
            font-weight: 400;
            letter-spacing: 0.2px;
            padding: 8px 0;
            width: 100%;
            min-width: 0;
            box-sizing: border-box;
        }
        
        .input-field::placeholder {
            color: rgba(255, 255, 255, 0.25);
        }
        
        .input-field:focus {
            outline: none;
        }
        
        .tabs-container {
            display: flex;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 12px;
            padding: 4px;
        }
        
        .tab-btn {
            flex: 1;
            padding: 12px 20px;
            border-radius: 8px;
            border: none;
            background: transparent;
            color: rgba(255, 255, 255, 0.6);
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .tab-btn.active {
            background: rgba(255, 255, 255, 0.1);
            color: #ffffff;
        }
        
        .tab-btn:hover:not(.active) {
            color: rgba(255, 255, 255, 0.8);
        }
        
        .captcha-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 14px 20px;
            color: rgba(255, 255, 255, 0.5);
            cursor: not-allowed;
            transition: all 0.3s ease;
        }
        
        .captcha-btn.enabled {
            background: rgba(255, 255, 255, 0.1);
            color: rgba(255, 255, 255, 0.9);
            cursor: pointer;
        }
        
        .captcha-btn.enabled:hover {
            background: rgba(255, 255, 255, 0.2);
        }
        
        .captcha-btn.success {
            background: rgba(34, 197, 94, 0.2);
            border-color: rgba(34, 197, 94, 0.3);
            color: #22c55e;
        }
        
        .fade-in {
            animation: fadeIn 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        @keyframes fadeIn {
            from { 
                opacity: 0; 
                transform: translateY(15px); 
            }
            to { 
                opacity: 1; 
                transform: translateY(0); 
            }
        }
        
        .logo-glow {
            text-shadow: 0 0 30px rgba(255, 255, 255, 0.15);
        }
        
        .loading-spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(0,0,0,0.1);
            border-radius: 50%;
            border-top-color: #000;
            animation: spin 0.8s linear infinite;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body class="text-white">
    <div class="min-h-screen flex items-center justify-center p-4">
        <div class="w-full max-w-md fade-in">
            <!-- Logo -->
            <div class="text-center mb-10">
                <div class="inline-flex items-center justify-center w-24 h-24 rounded-3xl bg-gradient-to-br from-gray-800/50 to-black/70 mb-5 border border-white/5 shadow-2xl">
                    <i class="fas fa-store text-5xl text-white/90"></i>
                </div>
                <h1 class="text-4xl font-bold logo-glow tracking-tight">KDX丨ZHX</h1>
                <p class="text-gray-400/80 mt-3 text-sm tracking-wide" id="page-subtitle">欢迎回来，请登录您的账户</p>
            </div>
            
            <!-- Login Card -->
            <div class="glass-card rounded-[32px] overflow-hidden">
                <div class="p-8">
                    <!-- Tabs -->
                    <div class="tabs-container mb-8">
                        <button class="tab-btn" id="login-tab" onclick="switchTab('login')">登录</button>
                        <button class="tab-btn active" id="signup-tab" onclick="switchTab('signup')">注册</button>
                    </div>
                    
                    <!-- Signup Form (Default) -->
                    <div id="signup-form">
                        <form id="phone-signup-form" onsubmit="handleSignup(event)">
                            <div class="mb-4">
                                <label class="block text-xs font-medium mb-2 text-gray-400/80 tracking-wider uppercase">手机号</label>
                                <div class="input-wrapper flex items-center px-5 py-3.5">
                                    <div class="input-icon flex-shrink-0 mr-4">
                                        <i class="fas fa-phone text-lg"></i>
                                    </div>
                                    <input type="tel" id="signup-phone" required 
                                           class="input-field flex-1 w-full"
                                           placeholder="请输入手机号"
                                           oninput="checkAndRedirectExistingPhone(); updateSignupCaptchaBtn();">
                                    <div id="phone-verify-status" class="ml-2 text-sm"></div>
                                </div>
                                <div class="flex items-center justify-between mt-1">
                                    <p id="phone-verify-message" class="text-xs text-gray-500"></p>
                                    <p class="text-xs text-yellow-400/70">注册后不可修改</p>
                                </div>
                            </div>
                            
                            <div class="mb-4">
                                <label class="block text-xs font-medium mb-2 text-gray-400/80 tracking-wider uppercase">邮箱</label>
                                <div class="input-wrapper flex items-center px-5 py-3.5">
                                    <div class="input-icon flex-shrink-0 mr-4">
                                        <i class="fas fa-envelope text-lg"></i>
                                    </div>
                                    <input type="email" id="signup-email" required 
                                           class="input-field flex-1 w-full"
                                           placeholder="请输入邮箱地址"
                                           oninput="validateEmailInput(); updateSignupCaptchaBtn();">
                                    <div id="email-verify-status" class="ml-2 text-sm"></div>
                                </div>
                                <p id="email-verify-message" class="text-xs mt-1 text-gray-500"></p>
                            </div>
                            
                            <div class="mb-6">
                                <label class="block text-xs font-medium mb-2 text-gray-400/80 tracking-wider uppercase">密码</label>
                                <div class="input-wrapper flex items-center px-5 py-3.5">
                                    <div class="input-icon flex-shrink-0 mr-4">
                                        <i class="fas fa-lock text-lg"></i>
                                    </div>
                                    <input type="password" id="signup-password" required minlength="4" 
                                           class="input-field flex-1 w-full"
                                           placeholder="至少4位密码"
                                           oninput="updateSignupCaptchaBtn();">
                                </div>
                            </div>
                            
                            <!-- Human Verification -->
                            <div class="mb-6">
                                <label class="block text-xs font-medium mb-2 text-gray-400/80 tracking-wider uppercase">人机验证</label>
                                <div class="text-center">
                                    <button type="button" id="signup-captcha-btn" class="captcha-btn w-full" onclick="doSignupCaptcha()" disabled>
                                        <i class="fas fa-check-circle mr-2"></i>
                                        <span id="signup-captcha-text">请先输入手机号</span>
                                    </button>
                                </div>
                                <p class="text-xs text-gray-400/60 text-center mt-2" id="signup-captcha-status"></p>
                            </div>
                            
                            <button type="submit" class="btn-premium w-full py-4 rounded-2xl" id="signup-submit">
                                <span id="signup-text">下一步，获取验证码</span>
                                <span id="signup-loading" class="hidden">
                                    <span class="loading-spinner mr-2"></span>
                                    获取中...
                                </span>
                            </button>
                        </form>
                    </div>
                    
                    <!-- Login Form -->
                    <div id="login-form" class="hidden">
                        <form id="phone-login-form" onsubmit="handleLogin(event)">
                            <div class="mb-4">
                                <label class="block text-xs font-medium mb-2 text-gray-400/80 tracking-wider uppercase">手机号</label>
                                <div class="input-wrapper flex items-center px-5 py-3.5">
                                    <div class="input-icon flex-shrink-0 mr-4">
                                        <i class="fas fa-phone text-lg"></i>
                                    </div>
                                    <input type="tel" id="login-phone" required 
                                           class="input-field flex-1 w-full"
                                           placeholder="请输入手机号"
                                           oninput="updateCaptchaBtn()">
                                </div>
                            </div>
                            
                            <!-- Password -->
                            <div class="mb-4" id="password-section">
                                <label class="block text-xs font-medium mb-2 text-gray-400/80 tracking-wider uppercase">密码</label>
                                <div class="input-wrapper flex items-center px-5 py-3.5">
                                    <div class="input-icon flex-shrink-0 mr-4">
                                        <i class="fas fa-lock text-lg"></i>
                                    </div>
                                    <input type="password" id="login-password" 
                                           class="input-field flex-1 w-full"
                                           placeholder="请输入密码">
                                </div>
                            </div>
                            
                            <!-- Human Verification -->
                            <div class="mb-6">
                                <label class="block text-xs font-medium mb-2 text-gray-400/80 tracking-wider uppercase">人机验证</label>
                                <div class="text-center">
                                    <button type="button" id="captcha-btn" class="captcha-btn w-full" onclick="doCaptcha()" disabled>
                                        <i class="fas fa-check-circle mr-2"></i>
                                        <span id="captcha-text">请先输入手机号</span>
                                    </button>
                                </div>
                                <p class="text-xs text-gray-400/60 text-center mt-2" id="captcha-status"></p>
                            </div>
                            
                            <button type="submit" class="btn-premium w-full py-4 rounded-2xl" id="login-submit">
                                <span id="login-text">登录</span>
                                <span id="login-loading" class="hidden">
                                    <span class="loading-spinner mr-2"></span>
                                    登录中...
                                </span>
                            </button>
                            
                            <div class="mt-4 text-center">
                                <a href="#" onclick="showForgotPassword()" class="text-sm text-gray-400/60 hover:text-white/80 transition">
                                    忘记密码？点击找回
                                </a>
                            </div>
                        </form>
                        
                        <!-- Unusual Login Warning -->
                        <div id="unusual-login-warning" class="hidden mt-4 p-4 bg-yellow-500/20 border border-yellow-500/30 rounded-2xl">
                            <div class="flex items-start gap-3">
                                <i class="fas fa-exclamation-triangle text-yellow-500 mt-1"></i>
                                <div>
                                    <p class="text-yellow-400 font-medium text-sm mb-1">检测到异常登录</p>
                                    <p class="text-yellow-400/70 text-xs" id="unusual-login-details"></p>
                                </div>
                            </div>
                        </div>
                    </div>
                    
                    <!-- Forgot Password Form -->
                    <div id="forgot-password-form" class="hidden">
                        <form onsubmit="handleForgotPassword(event)">
                            <h3 class="text-lg font-semibold mb-6 text-white text-center">找回密码</h3>
                            
                            <!-- Tab for recovery method -->
                            <div class="tabs-container mb-6">
                                <button type="button" class="tab-btn active" id="forgot-tab-email" onclick="switchForgotTab('email')">
                                    <i class="fas fa-envelope mr-2"></i>邮箱找回
                                </button>
                                <button type="button" class="tab-btn" id="forgot-tab-order" onclick="switchForgotTab('order')">
                                    <i class="fas fa-receipt mr-2"></i>订单找回
                                </button>
                            </div>
                            
                            <!-- Email Recovery -->
                            <div id="forgot-email-section">
                                <div class="mb-4">
                                <label class="block text-xs font-medium mb-2 text-gray-400/80 tracking-wider uppercase">邮箱</label>
                                <div class="input-wrapper flex items-center px-5 py-3.5">
                                    <div class="input-icon flex-shrink-0 mr-4">
                                        <i class="fas fa-envelope text-lg"></i>
                                    </div>
                                    <input type="email" id="forgot-email" 
                                           class="input-field flex-1 w-full"
                                           placeholder="请输入注册时的邮箱"
                                           oninput="validateForgotEmailInput();">
                                    <div id="forgot-email-verify-status" class="ml-2 text-sm"></div>
                                </div>
                                <p id="forgot-email-verify-message" class="text-xs mt-1 text-gray-500"></p>
                            </div>
                            </div>
                            
                            <!-- Order Recovery -->
                            <div id="forgot-order-section" class="hidden">
                                <div class="mb-4">
                                    <label class="block text-xs font-medium mb-2 text-gray-400/80 tracking-wider uppercase">支付宝订单号</label>
                                    <div class="input-wrapper flex items-center px-5 py-3.5">
                                        <div class="input-icon flex-shrink-0 mr-4">
                                            <i class="fas fa-receipt text-lg"></i>
                                        </div>
                                        <input type="text" id="forgot-order" 
                                               class="input-field flex-1 w-full"
                                               placeholder="请输入付款后的支付宝订单号">
                                    </div>
                                    <p class="text-xs text-gray-500 mt-2">
                                        <i class="fas fa-info-circle mr-1"></i>
                                        输入您在本平台付款时的支付宝订单号，我们将通过订单信息帮您找回账号
                                    </p>
                                </div>
                            </div>
                            
                            <button type="submit" class="btn-premium w-full py-4 rounded-2xl" id="forgot-submit">
                                <span id="forgot-text">找回密码</span>
                                <span id="forgot-loading" class="hidden">
                                    <span class="loading-spinner mr-2"></span>
                                    发送中...
                                </span>
                            </button>
                            
                            <div id="forgot-result" class="hidden mt-6 p-4 rounded-xl bg-green-500/10 border border-green-500/20">
                                <div class="flex items-center gap-3 mb-2">
                                    <i class="fas fa-check-circle text-green-500"></i>
                                    <span class="text-green-400 font-medium">找回成功</span>
                                </div>
                                <p id="forgot-result-text" class="text-sm text-gray-300"></p>
                            </div>
                            
                            <div class="mt-4 text-center">
                                <a href="#" onclick="backToLogin()" class="text-sm text-gray-400/60 hover:text-white/80 transition">
                                    <i class="fas fa-arrow-left mr-1"></i>返回登录
                                </a>
                            </div>
                        </form>
                    </div>
                    

                </div>
            </div>
            
            <!-- Back to Home -->
            <div class="text-center mt-8">
                <a href="/shop" class="inline-flex items-center gap-2 text-gray-400/60 hover:text-white/80 transition text-sm">
                    <i class="fas fa-arrow-left"></i>
                    返回商城
                </a>
            </div>
        </div>
    </div>
    
    <!-- Toast Notification -->
    <div id="toast" class="fixed top-6 right-6 bg-white text-black px-6 py-4 rounded-2xl shadow-2xl hidden flex items-center gap-3 z-50 fade-in">
        <i class="fas fa-check-circle text-green-600" id="toast-icon"></i>
        <span id="toast-message" class="font-medium"></span>
    </div>
    
    <!-- Phone Verification Modal -->
    <div id="ai-verify-modal" class="fixed inset-0 bg-black/80 backdrop-blur-md hidden flex items-center justify-center z-[100] p-4">
        <div class="bg-gradient-to-br from-gray-900 to-black rounded-3xl p-8 max-w-md w-full border border-white/10 shadow-2xl">
            <div class="text-center">
                <div id="ai-verify-icon" class="w-24 h-24 mx-auto mb-6 rounded-full flex items-center justify-center bg-gray-700">
                    <i class="fas fa-phone text-white text-4xl"></i>
                </div>
                
                <h3 id="ai-verify-title" class="text-2xl font-bold text-white mb-3">正在验证手机号</h3>
                
                <p id="ai-verify-message" class="text-gray-400 mb-6">
                    正在验证，确认这是一个真实有效的手机号码...
                </p>
                
                <!-- Loading Animation -->
                <div id="ai-verify-loading" class="mb-8">
                    <div class="flex justify-center gap-2">
                        <div class="w-3 h-3 bg-gray-500 rounded-full animate-bounce" style="animation-delay: 0.1s;"></div>
                        <div class="w-3 h-3 bg-gray-500 rounded-full animate-bounce" style="animation-delay: 0.3s;"></div>
                        <div class="w-3 h-3 bg-gray-500 rounded-full animate-bounce" style="animation-delay: 0.5s;"></div>
                    </div>
                </div>
                
                <!-- Verification Result -->
                <div id="ai-verify-result" class="hidden mb-8">
                    <div id="ai-verify-result-content" class="text-left">
                    </div>
                </div>
                
                <!-- 手机号核对提示 -->
                <div class="mb-6 p-4 bg-yellow-500/10 border border-yellow-500/20 rounded-xl">
                    <div class="flex items-start justify-between">
                        <div class="flex items-center gap-3">
                            <i class="fas fa-exclamation-triangle text-yellow-500 text-lg"></i>
                            <div class="text-left">
                                <p class="text-yellow-400 font-medium text-sm">手机号注册后不可修改</p>
                                <p class="text-yellow-300/80 text-xs mt-1">请核对号码是否正确</p>
                            </div>
                        </div>
                        <span id="ai-verify-success-text" class="text-green-400 font-bold text-sm hidden">验证通过</span>
                    </div>
                </div>
                
                <!-- Button -->
                <button id="ai-verify-close" onclick="closeAiVerifyModal()" class="hidden w-full py-4 bg-gray-700 text-white rounded-2xl font-semibold hover:bg-gray-600 transition">
                    确定
                </button>
            </div>
        </div>
    </div>

    <script>
        // State
        let currentTab = 'signup'; // Default to signup
        let isCaptchaVerified = false;
        let isSignupCaptchaVerified = false;
        let checkPhoneTimeout = null;

        // Show Toast
        function showToast(message, isError = false) {
            const toast = document.getElementById('toast');
            const toastMessage = document.getElementById('toast-message');
            const toastIcon = document.getElementById('toast-icon');
            
            toast.className = `fixed top-6 right-6 ${isError ? 'bg-red-500 text-white' : 'bg-white text-black'} px-6 py-4 rounded-2xl shadow-2xl flex items-center gap-3 z-50 fade-in`;
            toastMessage.textContent = message;
            toastIcon.className = isError ? 'fas fa-exclamation-circle text-white' : 'fas fa-check-circle text-green-600';
            toast.classList.remove('hidden');
            
            setTimeout(() => {
                toast.classList.add('hidden');
            }, 3000);
        }

        // Switch Tab
        function switchTab(tab) {
            currentTab = tab;
            const loginTab = document.getElementById('login-tab');
            const signupTab = document.getElementById('signup-tab');
            const loginForm = document.getElementById('login-form');
            const signupForm = document.getElementById('signup-form');
            const subtitle = document.getElementById('page-subtitle');
            
            if (tab === 'login') {
                loginTab.classList.add('active');
                signupTab.classList.remove('active');
                loginForm.classList.remove('hidden');
                signupForm.classList.add('hidden');
                subtitle.textContent = '欢迎回来，请登录您的账户';
            } else {
                signupTab.classList.add('active');
                loginTab.classList.remove('active');
                signupForm.classList.remove('hidden');
                loginForm.classList.add('hidden');
                subtitle.textContent = '创建新账户，开始购物之旅';
            }
            
            isCaptchaVerified = false;
            isSignupCaptchaVerified = false;
            resetCaptcha();
            resetSignupCaptcha();
        }

        // ==================== 手机号深度验证系统 ====================
        let phoneVerifyTimeout = null;
        let phoneVerified = false;
        let aiModalOpen = false;
        
        // 打开验证弹窗
        function openAiVerifyModal() {
            const modal = document.getElementById('ai-verify-modal');
            if (modal) {
                modal.classList.remove('hidden');
                aiModalOpen = true;
            }
        }
        
        // 关闭验证弹窗
        function closeAiVerifyModal() {
            const modal = document.getElementById('ai-verify-modal');
            if (modal) {
                modal.classList.add('hidden');
                aiModalOpen = false;
            }
        }
        
        // 设置验证成功状态
        function setAiVerifySuccess(message, details) {
            const iconDiv = document.getElementById('ai-verify-icon');
            const titleEl = document.getElementById('ai-verify-title');
            const messageEl = document.getElementById('ai-verify-message');
            const loadingDiv = document.getElementById('ai-verify-loading');
            const resultDiv = document.getElementById('ai-verify-result');
            const resultContentDiv = document.getElementById('ai-verify-result-content');
            const closeBtn = document.getElementById('ai-verify-close');
            const successText = document.getElementById('ai-verify-success-text');
            
            if (iconDiv) {
                iconDiv.className = 'w-24 h-24 mx-auto mb-6 rounded-full flex items-center justify-center bg-green-600';
                iconDiv.innerHTML = '<i class="fas fa-check text-white text-4xl"></i>';
            }
            
            if (titleEl) titleEl.textContent = '手机号验证成功';
            if (messageEl) messageEl.textContent = message;
            
            if (loadingDiv) loadingDiv.classList.add('hidden');
            if (resultDiv) resultDiv.classList.remove('hidden');
            if (closeBtn) closeBtn.classList.remove('hidden');
            if (successText) successText.classList.remove('hidden');

        // 处理手机号输入
        let aiVerifyTimeout = null;
        function handlePhoneInput(event) {
            const phone = event.target.value.trim();
            
            // 更新普通状态
            const statusDiv = document.getElementById('phone-verify-status');
            const messageDiv = document.getElementById('phone-verify-message');
            
            // 清除旧的计时器
            if (aiVerifyTimeout) clearTimeout(aiVerifyTimeout);
            
            // 输入完成后（11位），自动触发验证
            if (phone.length === 11 && validatePhone(phone)) {
                // 显示简单状态
                if (statusDiv) {
                    statusDiv.innerHTML = '<i class="fas fa-spinner fa-spin text-gray-500"></i>';
                }
                if (messageDiv) {
                    messageDiv.textContent = '准备验证...';
                    messageDiv.className = 'text-xs mt-1 text-gray-500';
                }
                
                // 延迟200ms再触发，让用户完成输入
                aiVerifyTimeout = setTimeout(() => {
                    startAiPhoneVerification(phone);
                }, 300);
            } else if (phone.length === 11 && !validatePhone(phone)) {
                // 格式不对
                if (statusDiv) {
                    statusDiv.innerHTML = '<i class="fas fa-times-circle text-red-500"></i>';
                }
                if (messageDiv) {
                    messageDiv.textContent = '手机号格式不正确';
                    messageDiv.className = 'text-xs mt-1 text-red-500';
                }
                phoneVerified = false;
                updateSignupCaptchaBtn();
            } else if (phone.length > 0) {
                if (statusDiv) {
                    statusDiv.innerHTML = '<i class="fas fa-circle text-yellow-500"></i>';
                }
                if (messageDiv) {
                    messageDiv.textContent = '请继续输入';
                    messageDiv.className = 'text-xs mt-1 text-yellow-500';
                }
                phoneVerified = false;
                updateSignupCaptchaBtn();
            } else {
                if (statusDiv) statusDiv.innerHTML = '';
                if (messageDiv) {
                    messageDiv.textContent = '';
                    messageDiv.className = 'text-xs mt-1 text-gray-500';
                }
                phoneVerified = false;
                updateSignupCaptchaBtn();
            }
            
            // 同时检查是否已注册
            checkAndRedirectExistingPhone();
        }
        
        // 启动验证流程
        let currentVerificationCallback = null;
        
        async function startAiPhoneVerification(phone, callback) {
            // 重置并打开弹窗
            resetAiVerifyModal();
            openAiVerifyModal();
            currentVerificationCallback = callback;
            
            const statusDiv = document.getElementById('phone-verify-status');
            const messageDiv = document.getElementById('phone-verify-message');
            
            try {
                // 发送给后端验证
                const response = await fetch('/api/ai/phone-verify', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ phone })
                });
                
                const result = await response.json();
                
                // 等待1.5秒再显示结果
                await new Promise(resolve => setTimeout(resolve, 1500));
                
                if (result.verified && result.valid) {
                    // 验证成功！
                    setAiVerifySuccess(result.message, result.details);
                    phoneVerified = true;
                    
                    if (statusDiv) {
                        statusDiv.innerHTML = '<i class="fas fa-check-circle text-green-500"></i>';
                    }
                    if (messageDiv) {
                        messageDiv.textContent = '验证通过';
                        messageDiv.className = 'text-xs mt-1 text-green-500';
                    }
                } else {
                    // 验证失败
                    setAiVerifyFailure(result.message, result.details);
                    phoneVerified = false;
                    
                    if (statusDiv) {
                        statusDiv.innerHTML = '<i class="fas fa-times-circle text-red-500"></i>';
                    }
                    if (messageDiv) {
                        messageDiv.textContent = '验证失败';
                        messageDiv.className = 'text-xs mt-1 text-red-500';
                    }
                }
                
                updateSignupCaptchaBtn();
                
            } catch (error) {
                console.error('验证错误:', error);
                setAiVerifyFailure(
                    '验证出错',
                    '网络连接失败，请稍后再试'
                );
                phoneVerified = false;
            }
        }
        
        // 在验证弹窗关闭按钮的点击事件中执行回调
        function closeAiVerifyModal() {
            const modal = document.getElementById('ai-verify-modal');
            if (modal) {
                modal.classList.add('hidden');
                aiModalOpen = false;
            }
            
            // 如果有回调并且验证成功，执行回调
            if (currentVerificationCallback && phoneVerified) {
                const callback = currentVerificationCallback;
                currentVerificationCallback = null;
                setTimeout(() => callback(), 100);
            } else {
                currentVerificationCallback = null;
            }
        }

        // 手机号验证
        async function verifyPhoneWithAI() {
            const phone = document.getElementById('signup-phone').value;
            const statusDiv = document.getElementById('phone-verify-status');
            const messageDiv = document.getElementById('phone-verify-message');
            
            phoneVerified = false;
            
            if (!phone.trim()) {
                statusDiv.innerHTML = '';
                messageDiv.textContent = '';
                updateSignupCaptchaBtn();
                return;
            }
            
            // 简单格式检查
            if (phone.length < 11) {
                statusDiv.innerHTML = '<i class="fas fa-circle text-yellow-500"></i>';
                messageDiv.textContent = '请输入完整的手机号';
                messageDiv.className = 'text-xs mt-1 text-yellow-500';
                updateSignupCaptchaBtn();
                return;
            }
            
            statusDiv.innerHTML = '<i class="fas fa-spinner fa-spin text-gray-500"></i>';
            messageDiv.textContent = '正在验证手机号...';
            messageDiv.className = 'text-xs mt-1 text-gray-500';
            
            // 清除之前的定时器
            if (phoneVerifyTimeout) {
                clearTimeout(phoneVerifyTimeout);
            }
            
            // 防抖 - 等待用户停止输入500ms后验证
            phoneVerifyTimeout = setTimeout(async () => {
                try {
                    const response = await fetch('/api/ai/verify-phone', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ phone })
                    });
                    
                    const data = await response.json();
                    
                    if (data.valid) {
                        phoneVerified = true;
                        statusDiv.innerHTML = '<i class="fas fa-check-circle text-green-500"></i>';
                        messageDiv.textContent = data.message || '手机号验证通过！';
                        messageDiv.className = 'text-xs mt-1 text-green-500';
                    } else {
                        phoneVerified = false;
                        statusDiv.innerHTML = '<i class="fas fa-times-circle text-red-500"></i>';
                        messageDiv.textContent = data.message || '手机号验证失败';
                        messageDiv.className = 'text-xs mt-1 text-red-500';
                    }
                    
                    updateSignupCaptchaBtn();
                } catch (error) {
                    console.error('Phone verification error:', error);
                    statusDiv.innerHTML = '<i class="fas fa-exclamation-circle text-gray-400"></i>';
                    messageDiv.textContent = '验证服务暂时不可用';
                    messageDiv.className = 'text-xs mt-1 text-gray-500';
                    updateSignupCaptchaBtn();
                }
            }, 500);
        }

        // Check and redirect if phone already exists (for signup page)
        function checkAndRedirectExistingPhone() {
            const phone = document.getElementById('signup-phone').value;
            
            if (!phone.trim()) {
                return;
            }
            
            // Clear previous timeout
            if (checkPhoneTimeout) {
                clearTimeout(checkPhoneTimeout);
            }
            
            // 只有手机号格式验证通过后才检查是否已注册
            if (!validatePhone(phone)) {
                return;
            }
            
            // Debounce check - wait 800ms after user stops typing
            checkPhoneTimeout = setTimeout(async () => {
                try {
                    const checkRes = await fetch('/api/check-phone', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ phone })
                    });
                    
                    const checkData = await checkRes.json();
                    
                    if (checkData.exists) {
                        // Phone exists - redirect to login
                        showToast('该手机号已注册，正在跳转到登录...', true);
                        
                        setTimeout(() => {
                            switchTab('login');
                            document.getElementById('login-phone').value = phone;
                            updateCaptchaBtn();
                        }, 1200);
                    }
                } catch (error) {
                    console.error('Check phone error:', error);
                }
            }, 800);
        }

        // 验证邮箱格式
        function validateEmail(email) {
            if (!email) return { valid: false, message: '' };
            
            // 检查是否包含中文句号
            if (email.includes('。')) {
                return { valid: false, message: '邮箱中不能使用中文句号，请使用英文句号(.)' };
            }
            
            // 检查是否包含@符号
            const atIndex = email.indexOf('@');
            if (atIndex === -1) {
                return { valid: false, message: '邮箱格式不正确，缺少@符号' };
            }
            
            // 检查@符号前后的位数
            const localPart = email.substring(0, atIndex);
            const domainPart = email.substring(atIndex + 1);
            
            if (localPart.length < 2) {
                return { valid: false, message: '@符号前至少需要2个字符' };
            }
            
            if (domainPart.length < 3) {
                return { valid: false, message: '@符号后至少需要3个字符' };
            }
            
            // 检查域名是否包含点
            const dotIndex = domainPart.indexOf('.');
            if (dotIndex === -1) {
                return { valid: false, message: '邮箱域名格式不正确' };
            }
            
            // 检查顶级域名长度
            const tld = domainPart.substring(dotIndex + 1);
            if (tld.length < 2) {
                return { valid: false, message: '顶级域名至少需要2个字符' };
            }
            
            // 检查是否为一次性邮箱
            if (isDisposableEmail(domainPart)) {
                return { valid: false, message: '不支持使用临时邮箱，请使用正规邮箱' };
            }
            
            // 检查是否在允许的邮箱域名白名单中
            if (!isAllowedEmailDomain(domainPart)) {
                return { valid: false, message: '暂不支持该邮箱域名，请使用QQ、163等常见邮箱' };
            }
            
            // 标准邮箱正则验证
            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            if (!emailRegex.test(email)) {
                return { valid: false, message: '邮箱格式不正确' };
            }
            
            return { valid: true, message: '' };
        }

        // 检查邮箱域名是否在白名单中
        function isAllowedEmailDomain(domain) {
            const lowerDomain = domain.toLowerCase();
            return allowedEmailDomains.some(allowedDomain => 
                lowerDomain === allowedDomain || lowerDomain.endsWith('.' + allowedDomain)
            );
        }

        // 检查是否为一次性邮箱
        function isDisposableEmail(domain) {
            const lowerDomain = domain.toLowerCase();
            return disposableEmailDomains.some(disposableDomain => 
                lowerDomain === disposableDomain || lowerDomain.endsWith('.' + disposableDomain)
            );
        }

        // 验证手机号格式（加强版）
        function validatePhone(phone) {
            if (!phone) return false;
            if (phone.length !== 11) return false;
            if (phone.charAt(0) !== '1') return false;
            
            const secondDigit = parseInt(phone.charAt(1));
            if (secondDigit < 3 || secondDigit > 9) return false;
            
            // 检查是否全是数字
            for (let i = 0; i < phone.length; i++) {
                const digit = phone.charAt(i);
                if (digit < '0' || digit > '9') {
                    return false;
                }
            }
            
            const phoneRegex = /^1[3-9]\d{9}$/;
            return phoneRegex.test(phone);
        }

        // Handle forgot password
        async function handleForgotPassword(event) {
            event.preventDefault();
            
            setLoading('forgot', true);
            document.getElementById('forgot-result').classList.add('hidden');
            
            try {
                let requestData = {};
                
                if (currentForgotTab === 'email') {
                    const email = document.getElementById('forgot-email').value;
                    if (!email) {
                        throw new Error('请输入邮箱');
                    }
                    // 验证邮箱
                    const emailResult = validateEmail(email);
                    if (!emailResult.valid) {
                        throw new Error(emailResult.message);
                    }
                    requestData = { type: 'email', email };
                } else {
                    const orderNo = document.getElementById('forgot-order').value;
                    if (!orderNo) {
                        throw new Error('请输入支付宝订单号');
                    }
                    requestData = { type: 'order', orderNo };
                }
                
                const res = await fetch('/api/forgot-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(requestData)
                });
                
                const data = await res.json();
                
                if (!res.ok) {
                    throw new Error(data.error || '找回密码失败');
                }
                
                // Show result
                const resultDiv = document.getElementById('forgot-result');
                const resultText = document.getElementById('forgot-result-text');
                resultDiv.classList.remove('hidden');
                
                if (currentForgotTab === 'email') {
                    resultText.textContent = `您的密码是：${data.password}`;
                } else {
                    resultText.textContent = `找到账号：${data.phone}\n密码是：${data.password}`;
                }
                
                // After 3s, back to login
                setTimeout(() => {
                    backToLogin();
                }, 3000);
                
            } catch (error) {
                console.error('Forgot password error:', error);
                showToast(error.message || '找回密码失败', true);
            } finally {
                setLoading('forgot', false);
            }
        }

                const checkRes = await fetch('/api/check-phone', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ phone })
                });
                
                const checkData = await checkRes.json();
                
                if (!checkData.exists) {
                    // Phone not registered - go to signup
                    showToast('该手机号还没有注册过，正在跳转到注册页面...', true);
                    
                    setTimeout(() => {
                        switchTab('signup');
                        document.getElementById('signup-phone').value = phone;
                        updateSignupCaptchaBtn();
                    }, 1200);
                    
                    setLoading('login', false);
                    return;
                }
                
                // Phone is registered - try to login
                if (!password) {
                    showToast('请输入密码', true);
                    setLoading('login', false);
                    return;
                }
                
                const loginRes = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        username: phone, 
                        password: password,
                        loginType: 'phone'
                    })
                });
                
                const loginData = await loginRes.json();
                
                if (!loginRes.ok) {
                    throw new Error(loginData.error || '登录失败');
                }
                
                // Save user info
                const userWithLoginInfo = {
                    ...loginData.user,
                    lastLoginLocation: loginData.loginLocation,
                    lastLoginTime: new Date().toISOString()
                };
                
                // 确保用户名格式为 KZ-xxxx
                if (loginData.user && loginData.user.username && !loginData.user.username.startsWith('KZ-')) {
                    // 如果用户名不是 KZ- 开头，使用手机号后四位生成
                    if (loginData.user.phone && loginData.user.phone.length >= 4) {
                        const phoneLastFour = loginData.user.phone.slice(-4);
                        userWithLoginInfo.username = `KZ-${phoneLastFour}`;
                    }
                }
                
                localStorage.setItem('user', JSON.stringify(userWithLoginInfo));
                localStorage.setItem('token', loginData.token);
                
                // Show unusual login warning
                if (loginData.isUnusualLogin || loginData.unusualLogin) {
                    document.getElementById('unusual-login-warning').classList.remove('hidden');
                    const details = `IP: ${loginData.loginLocation?.ip || '未知'}, 设备: ${loginData.loginLocation?.deviceType || '未知'}`;
                    document.getElementById('unusual-login-details').textContent = details;
                }
                
                showToast('登录成功！');
                
                setTimeout(() => {
                    const savedReturnUrl = sessionStorage.getItem('returnUrl');
                    sessionStorage.removeItem('returnUrl');
                    window.location.href = savedReturnUrl || '/shop';
                }, 800);
                
            } catch (error) {
                console.error('Login error:', error);
                setLoading('login', false);
                showToast(error.message || '登录失败', true);
            }
        }
        
        // Handle Login
        async function handleLogin(event) {
            event.preventDefault();
            
            const phone = document.getElementById('login-phone').value;
            const password = document.getElementById('login-password').value;
            
            if (!phone) {
                showToast('请输入手机号', true);
                return;
            }
            
            // 测试手机号自动登录
            if (phone === '13900000000' && password === 'kdx123456') {
                setLoading('login', true);
                
                setTimeout(() => {
                    const mockUser = {
                        id: 'admin-kdx',
                        username: 'kdx',
                        phone: '13900000000',
                        email: 'kdx@kdxzhx.com',
                        role: 'admin',
                        isAdmin: true
                    };
                    localStorage.setItem('user', JSON.stringify(mockUser));
                    localStorage.setItem('token', 'demo-token');
                    showToast('登录成功！');
                    sessionStorage.removeItem('returnUrl');
                    setTimeout(() => { window.location.href = '/admin'; }, 1000);

            // 先进行手机号验证
            startAiPhoneVerification(phone, performLogin);

        // 实际执行注册的函数（验证通过后调用）
        async function performSignup() {
            const phone = document.getElementById('signup-phone').value;
            const email = document.getElementById('signup-email').value;
            const password = document.getElementById('signup-password').value;
            
            // 验证邮箱
            const emailResult = validateEmail(email);
            if (!emailResult.valid) {
                showToast(emailResult.message, true);
                validateEmailInput();
                return;
            }
            
            if (!password) {
                showToast('请输入密码', true);
                return;
            }
            
            if (!isSignupCaptchaVerified) {
                showToast('请先完成人机验证', true);
                return;
            }
            
            setLoading('signup', true);
            
            try {
                // First check if phone is already registered
                const checkRes = await fetch('/api/check-phone', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ phone })
                });
                
                const checkData = await checkRes.json();
                
                if (checkData.exists) {
                    showToast('该手机号已被注册，请直接登录', true);
                    
                    setTimeout(() => {
                        switchTab('login');
                        document.getElementById('login-phone').value = phone;
                        updateCaptchaBtn();
                    }, 1500);
                    
                    setLoading('signup', false);
                    return;
                }
                
                // Generate username
                const phoneLastFour = phone.slice(-4);
                const username = `KZ-${phoneLastFour}`;
                
                // Register user
                const registerRes = await fetch('/api/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password, phone, email })
                });
                
                const registerData = await registerRes.json();
                
                if (!registerRes.ok) {
                    throw new Error(registerData.error || '注册失败');
                }
                
                // Save user info
                const userWithUsername = {
                    ...registerData.user,
                    username: username  // 使用我们生成的 KZ-xxxx 格式用户名
                };
                localStorage.setItem('user', JSON.stringify(userWithUsername));
                localStorage.setItem('token', registerData.token);
                
                showToast('注册成功！');
                
                setTimeout(() => {
                    const savedReturnUrl = sessionStorage.getItem('returnUrl');
                    sessionStorage.removeItem('returnUrl');
                    window.location.href = savedReturnUrl || '/shop';
                }, 800);
                
            } catch (error) {
                console.error('Signup error:', error);
                showToast(error.message || '注册失败', true);
            } finally {
                setLoading('signup', false);
            }
        }
        
        // Handle Signup
        async function handleSignup(event) {
            event.preventDefault();
            
            // 检查人机验证是否通过
            if (!isSignupCaptchaVerified) {
                showToast('请先完成人机验证', true);
                return;
            }
            
            const phone = document.getElementById('signup-phone').value;
            
            if (!phone) {
                showToast('请输入手机号', true);
                return;
            }
            
            // 验证手机号格式
            if (!validatePhone(phone)) {
                showToast('请输入正确的手机号', true);
                return;
            }
            
            // 先进行手机号验证
            startAiPhoneVerification(phone, performSignup);
        }

        // Initialize
        document.addEventListener('DOMContentLoaded', async () => {
            // Parse return URL from query string
            const urlParams = new URLSearchParams(window.location.search);
            const returnUrl = urlParams.get('returnUrl');
            if (returnUrl) {
                sessionStorage.setItem('returnUrl', returnUrl);
            }

            // Check if already logged in
            const user = localStorage.getItem('user');
            if (user) {
                const userData = JSON.parse(user);
                const savedReturnUrl = sessionStorage.getItem('returnUrl');
                sessionStorage.removeItem('returnUrl');
                // Admin always goes to admin page, regular users go to returnUrl or shop
                if (userData.isAdmin) {
                    window.location.href = '/admin';
                } else {
                    window.location.href = savedReturnUrl || '/shop';
                }
                return;
            }
            
            // Try auto login with IP
            try {
                const res = await fetch('/api/auto-login', {
                    method: 'POST',
                    credentials: 'same-origin'
                });
                
                if (res.ok) {
                    const data = await res.json();
                    if (data.success && data.user) {
                        localStorage.setItem('user', JSON.stringify(data.user));
                        if (data.token) {
                            localStorage.setItem('token', data.token);
                        }
                        showToast('欢迎回来！已自动登录');
                        setTimeout(() => {
                            const savedReturnUrl = sessionStorage.getItem('returnUrl');
                            sessionStorage.removeItem('returnUrl');
                            // Admin always goes to admin page, regular users go to returnUrl or shop
                            if (data.user.isAdmin) {
                                window.location.href = '/admin';
                            } else {
                                window.location.href = savedReturnUrl || '/shop';
                            }
                        }, 500);
                    }
                }
            } catch (error) {
                console.log('Auto login not available');
            }
        });
    </script>
